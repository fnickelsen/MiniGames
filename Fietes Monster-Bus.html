<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="Bus">
<title>Fietes Monster-Bus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Bungee&display=swap">
<style>
/* Layout: Busdepot – Sticker-Karten mit harten Schatten auf Schulbus-Gelb, die Straße ist die Hauptbühne */
:root{
  --gym:#fff0b3; --dots:rgba(150,110,0,.14); --ink:#1d1a2b; --paper:#fffaf0;
  --grape:#6c3fd1; --go:#38c172; --sky:#3fb6ff; --white:#ffffff; --red:#ff5a4e;
  --p1:#ffe14d; --p2:#7fe3ff;
  --display:'Bungee','Arial Black',Impact,system-ui,sans-serif;
  --body:'Baloo 2','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;min-height:100%}
*{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
html,body{background-color:var(--gym);color:var(--ink);
  background-image:radial-gradient(circle at 2px 2px,var(--dots) 2px,transparent 2.6px);background-size:28px 28px;background-attachment:fixed}
body{font-family:var(--body);font-size:18px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1060px;margin:0 auto;display:grid;gap:20px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,44px);line-height:1;margin:0;text-wrap:balance}
h1 span{color:var(--white);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.steps{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0}
.steps li{font-weight:800;font-size:16px;padding:3px 14px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);opacity:.5}
.steps li.on{opacity:1;background:var(--grape);color:var(--white)}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink)}
.builder{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
@media (max-width:820px){.builder{grid-template-columns:minmax(0,1fr)}}
.preview{padding:16px;display:grid;gap:10px}
@media (min-width:821px){.preview{position:sticky;top:12px}}
#pv{display:block;width:100%;height:auto;border:3px solid var(--ink);border-radius:14px}
label{font-weight:800}
.txt-in{font:inherit;font-weight:800;font-size:20px;padding:5px 14px;border:3px solid var(--ink);border-radius:12px;background:var(--white);color:var(--ink);width:100%;box-sizing:border-box}
.panel{padding:18px 20px;display:grid;gap:16px;min-width:0}
.flat{padding:0}
h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0;text-wrap:balance}
.row{display:grid;gap:6px}
.lab{font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:700;font-size:17px;padding:3px 14px;border:3px solid var(--ink);border-radius:12px;background:var(--white);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.chip.sel{background:var(--grape);color:var(--white)}
.chip.sw{width:42px;height:42px;padding:0;border-radius:50%}
.chip.sw.sel{outline:4px solid var(--grape);outline-offset:3px}
.chip:disabled{opacity:.25;cursor:not-allowed}
:focus-visible{outline:4px solid var(--sky);outline-offset:2px}
.sep{border:0;border-top:3px dashed rgba(29,26,43,.2);margin:4px 0;width:100%}
.btn{font-family:var(--display);font-weight:400;font-size:18px;padding:10px 18px;border:3px solid var(--ink);border-radius:14px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);background:var(--white);color:var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.go{background:var(--go)}
.btn.small{font-size:15px;padding:6px 14px;box-shadow:3px 3px 0 var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
.actions #go{margin-left:auto}
.who{font-family:var(--display);font-size:15px;justify-self:start;padding:2px 12px;border:3px solid var(--ink);border-radius:999px;background:var(--p1)}
.who.p2{background:var(--p2)}
.game{display:grid;gap:12px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.score{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;align-items:center;gap:12px;padding:6px 16px}
.pname{display:flex;align-items:center;gap:8px;min-width:0;font-weight:800;font-size:18px}
.pname .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#n1{justify-content:flex-end;text-align:right}
.jdot{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink);flex:none}
.hearts{font-size:21px;line-height:1;letter-spacing:0;white-space:nowrap}
.hearts.pop{animation:pop .6s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
.vs{font-family:var(--display);font-size:15px;background:var(--ink);color:var(--p1);padding:3px 10px;border-radius:10px}
@media (max-width:560px){.pname{font-size:14px}.hearts{font-size:18px}.vs{font-size:13px}}
.stage{position:relative;border:3px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:6px 6px 0 var(--ink);background:#5b6270;justify-self:center;width:100%;box-sizing:border-box}
#cv{display:block;width:100%;height:auto;touch-action:none}
.overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:grid;place-items:center;background:rgba(29,26,43,.55);padding:12px}
.ocard{padding:16px 22px;width:min(440px,100%);box-sizing:border-box;display:grid;gap:10px;text-align:center}
.ocard h2{font-size:26px}
.ocard p{margin:0;font-weight:700}
.ocard .actions{justify-content:center}
@media (max-width:700px){.overlay{position:static;background:none;padding:12px 0 0}}
.keys{margin:0;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;font-weight:700;font-size:16px}
.keys .tag{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:0 10px;border:3px solid var(--ink);border-radius:999px;background:var(--p1);margin-right:6px}
.keys .tag.p2{background:var(--p2)}
kbd{font-family:var(--body);font-weight:800;font-size:14px;padding:0 7px;border:2px solid var(--ink);border-bottom-width:4px;border-radius:6px;background:var(--white)}
.touch{display:none;justify-content:space-between;align-items:center;gap:12px}
html.is-touch .touch{display:flex}
html.is-touch .keys{display:none}
.tpad{display:flex;align-items:center;gap:14px}
.tpad.r{flex-direction:row-reverse}
.mid{flex:1;min-width:0;display:grid;gap:8px;justify-items:center;align-content:center}
.joy{width:124px;height:124px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);position:relative;touch-action:none;flex:none}
.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-30px 0 0 -30px;border-radius:50%;background:var(--p1);border:3px solid var(--ink);pointer-events:none}
#joy1 .knob{background:var(--p2)}
.tbtns{display:flex;flex-direction:column;gap:10px}
.tb{touch-action:none;min-width:116px;min-height:56px;font-size:18px;padding:8px 14px}
.tb.throw{background:var(--red);color:var(--white)}
.tb.jump{background:var(--sky)}
.tbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tbar .btn.small{font-size:13px;padding:5px 10px}
.foot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
body.playing{padding-block:8px 4px}
body.playing .top{display:none}
@media (prefers-reduced-motion:reduce){.hearts.pop{animation:none}}
.linename{font-family:var(--display);font-size:18px;white-space:nowrap}
.stat{font-weight:800;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat b{font-family:var(--display);font-weight:400;font-size:20px}
@media (max-width:560px){.linename{font-size:14px}.stat{font-size:13px}.stat b{font-size:15px}}
.pedal{touch-action:none;min-width:130px;min-height:110px;font-size:20px;line-height:1.2}
.pedal.gas{background:var(--go)}
.pedal.brake{background:var(--red);color:var(--white)}
.pedal.down{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.doorbtn,.hornbtn{min-height:56px;font-size:17px;touch-action:none}
.doorbtn{background:var(--sky)}
.hornbtn{background:var(--p1)}
.lninfo{flex-basis:100%;margin:2px 0 0;font-weight:700;font-size:15px}
.hall{font-family:var(--display);font-size:14px;padding:4px 12px;border:3px solid var(--ink);border-radius:12px;background:var(--white);color:var(--ink);text-decoration:none;box-shadow:3px 3px 0 var(--ink)}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Fietes <span>Monster-Bus</span></h1>
    <a class="hall" href="index.html">← Spielehalle</a>
    <ol class="steps" id="steps"><li class="on">1 Fahrer &amp; Bus</li><li>2 Losfahren</li></ol>
  </header>

  <section id="builder" class="builder">
    <div class="card preview">
      <canvas id="pv" width="440" height="300" aria-label="Vorschau von Fahrer und Bus"></canvas>
      <label for="name">Wie heißt dein Busfahrer-Monster?</label>
      <input id="name" class="txt-in" maxlength="14" autocomplete="off">
    </div>
    <div class="card panel">
      <div class="row">
        <div class="lab">Welche Buslinie?</div>
        <div class="chips" id="lnrow"></div>
      </div>
      <div class="row">
        <div class="lab">Welcher Bus?</div>
        <div class="chips" id="btrow"></div>
      </div>
      <div class="row">
        <div class="lab">Busfarbe</div>
        <div class="chips" id="bcrow"></div>
      </div>
      <hr class="sep">
      <h2>Bau deinen Busfahrer!</h2>
      <div id="rows" class="panel flat" style="gap:14px"></div>
      <div class="actions">
        <button id="rand" class="btn small">🎲 Zufalls-Monster</button>
        <button id="go" class="btn go">Einsteigen und losfahren!</button>
      </div>
    </div>
  </section>

  <section id="game" class="game" hidden>
    <div class="card score">
      <span class="linename" id="linename"></span>
      <span class="stat">👥 <b id="riders">0</b></span>
      <span class="stat">✅ <b id="done">0</b></span>
      <span class="stat">🪙 <b id="coins">0</b></span>
    </div>
    <div class="stage">
      <canvas id="cv" width="1000" height="560" aria-label="Straße mit Bus"></canvas>
      <div id="overlay" class="overlay" hidden></div>
    </div>
    <div class="touch" id="touch">
      <button id="brake" class="btn tb pedal brake">🛑<br>Bremse</button>
      <div class="mid" id="tmid"><div class="tbar"><button id="door" class="btn tb doorbtn">🚪 Türen</button><button id="horn" class="btn tb hornbtn">📯 Hupe</button></div></div>
      <button id="gas" class="btn tb pedal gas">Gas<br>⏩</button>
    </div>
    <p class="keys"><span>Gas <kbd>→</kbd> oder <kbd>D</kbd></span><span>Bremse <kbd>←</kbd> oder <kbd>A</kbd></span><span>Türen <kbd>Leertaste</kbd></span><span>Hupe <kbd>H</kbd></span></p>
    <div class="foot">
      <button id="quit" class="btn small">← Zum Busdepot</button>
      <button id="mute" class="btn small">🔊 Ton an</button>
    </div>
  </section>
</div>

<script>
/* ===== iPad-Grundlagen (Zielgerät: iPad Air 2, iOS 15, Safari) =====
   - Touch erkennen, Bildschirm einpassen, kein Scrollen/Zoomen im Spiel
   - Ton unter iOS freischalten (braucht ein echtes Antippen)
   - Bildqualität automatisch senken, wenn das Gerät zu langsam ist */
var DPR_MAX=2;
var IS_TOUCH=('ontouchstart' in window)||(navigator.maxTouchPoints||0)>0;
if(IS_TOUCH)document.documentElement.classList.add('is-touch');
function gameOn(){var g=document.getElementById('game');return !!g&&!g.hidden;}
function fitStage(){
  var game=document.getElementById('game'),stage=document.querySelector('.stage'),c=document.getElementById('cv');
  if(!game||game.hidden||!stage||!c)return;
  stage.style.maxWidth='';
  var other=game.getBoundingClientRect().height-stage.getBoundingClientRect().height;
  var avail=window.innerHeight-other-22;
  stage.style.maxWidth=Math.max(300,Math.floor(avail*c.width/c.height))+'px';
}
function enterGameScreen(){document.body.classList.add('playing');window.scrollTo(0,0);fitStage();requestAnimationFrame(fitStage);setTimeout(fitStage,400);}
function leaveGameScreen(){document.body.classList.remove('playing');var s=document.querySelector('.stage');if(s)s.style.maxWidth='';window.scrollTo(0,0);}
window.addEventListener('resize',fitStage);
window.addEventListener('orientationchange',function(){setTimeout(fitStage,400);});
var audioUnlocked=false;
function unlockAudio(){
  if(typeof initAudio!=='function')return;
  initAudio();
  if(audioUnlocked||!AC)return;
  try{var b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0);audioUnlocked=true;}catch(e){}
}
document.addEventListener('touchend',unlockAudio,true);
document.addEventListener('click',unlockAudio,true);
document.addEventListener('touchmove',function(e){
  if(gameOn()&&!(e.target&&e.target.closest&&e.target.closest('.ocard,.rcard')))e.preventDefault();
},{passive:false});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
var perfN=0,perfSum=0,lowQ=false;
function perfTick(raw){
  if(lowQ||!gameOn()||document.hidden||raw>0.25)return;
  perfN++;perfSum+=raw;
  if(perfN>=90){
    if(perfSum/perfN>0.026){lowQ=true;DPR_MAX=1;if(typeof onLowQuality==='function')onLowQuality();}
    perfN=0;perfSum=0;
  }
}
function compactControls(){
  if(!IS_TOUCH)return;
  var mid=document.getElementById('tmid'),foot=document.querySelector('.foot');if(!mid||!foot)return;
  var bar=document.createElement('div');bar.className='tbar';
  while(foot.firstElementChild)bar.appendChild(foot.firstElementChild);
  mid.appendChild(bar);foot.hidden=true;
}
compactControls();
/* ===== Ende iPad-Grundlagen ===== */


/* Kompatibilität: ältere Safari-Versionen (iPadOS < 16) kennen roundRect nicht */
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.max(0,Math.min(typeof r==='number'?r:(r&&r[0])||0,Math.abs(w)/2,Math.abs(h)/2));
    this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};
}
/* Fehler sichtbar machen, falls doch etwas schiefgeht (hilft auf dem iPad ohne Entwicklerwerkzeuge) */
window.addEventListener('error',function(e){
  var b=document.getElementById('errbox');
  if(!b){b=document.createElement('div');b.id='errbox';
    b.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#fffaf0;color:#1d1a2b;border:3px solid #1d1a2b;border-radius:14px;padding:10px 14px;font:600 15px/1.35 system-ui,sans-serif;box-shadow:4px 4px 0 #1d1a2b';
    document.body.appendChild(b);}
  b.textContent='Ups, da ist etwas kaputtgegangen. Bitte diesen Text an Claude schicken: '+e.message+' (Zeile '+e.lineno+')';
});

const INK='#1d1a2b', TAU=Math.PI*2;
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shade(hex,a){let n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  const f=v=>Math.round(a<0?v*(1+a):v+(255-v)*a);return `rgb(${f(r)},${f(g)},${f(b)})`;}
function P(c,p){c.beginPath();c.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);c.closePath();}
function fs(c,fill,lw=3){c.fillStyle=fill;c.fill();c.lineWidth=lw;c.strokeStyle=INK;c.stroke();}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,TAU);}
function setup(cv,w,h){const d=Math.min(DPR_MAX,window.devicePixelRatio||1);cv.width=w*d;cv.height=h*d;const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);return x;}

/* ---------- Monster ---------- */
const COLORS=['#38c172','#ff5a4e','#3fb6ff','#a66bff','#ff9f1c','#ff6fb5','#2ec4b6','#8d6e63'];
const OPTS={
  color:COLORS.map(v=>({v})),
  eyes:[{v:1,l:'1'},{v:2,l:'2'},{v:3,l:'3'},{v:5,l:'5'}],
  horns:[{v:'none',l:'Keine'},{v:'small',l:'Kleine'},{v:'big',l:'Riesig'},{v:'antenna',l:'Antennen'}],
  mouth:[{v:'smile',l:'Lächeln'},{v:'teeth',l:'Zähne'},{v:'fangs',l:'Riesenzähne'},{v:'tongue',l:'Zunge raus'}],
  arms:[{v:2,l:'2 Arme'},{v:4,l:'4 Arme'}],
  tail:[{v:'none',l:'Keiner'},{v:'tail',l:'Puschel'},{v:'spiky',l:'Stachel'}],
  wings:[{v:false,l:'Keine'},{v:true,l:'Flügel'}],
  pattern:[{v:'none',l:'Keins'},{v:'spots',l:'Punkte'},{v:'stripes',l:'Streifen'}],
};
const ROWS=[['color','Farbe'],['eyes','Augen'],['horns','Hörner'],['mouth','Mund'],['arms','Arme'],['tail','Schwanz'],['wings','Flügel'],['pattern','Muster']];
function randMonster(except){const m={};for(const k in OPTS)m[k]=pick(OPTS[k]).v;
  if(except){m.color=pick(COLORS.filter(c=>!except.includes(c)));}return m;}

function arm(c,x1,y1,x2,y2,col){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.lineWidth=10;c.strokeStyle=INK;c.stroke();
  c.lineWidth=5;c.strokeStyle=col;c.stroke();circ(c,x2,y2,4.5);fs(c,col,2.5);}
const EYES={1:[[10,-8,11]],2:[[2,-10,8],[18,-8,7]],3:[[-6,-12,7],[10,-15,7.5],[22,-3,6]],5:[[-10,-12,5.5],[1,-19,6],[13,-13,6.5],[23,-3,5],[5,-2,4.5]]};

function drawMonster(c,m,x,y,s,t){
  const col=m.color,dk=shade(col,-0.3),lt=shade(col,0.4);
  c.save();c.translate(x,y+Math.sin(t*7)*1.2);c.scale(s,s);c.lineJoin='round';c.lineCap='round';
  if(m.wings){const f=Math.sin(t*16)*0.4;c.save();c.translate(-8,-14);c.rotate(-0.5+f);
    c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(-20,-36,-46,-28);c.quadraticCurveTo(-34,-16,-40,-4);c.quadraticCurveTo(-22,-8,0,0);c.closePath();
    fs(c,'rgba(255,255,255,.9)',2.5);c.restore();}
  if(m.tail!=='none'){const w=Math.sin(t*6)*5;c.beginPath();c.moveTo(-22,12);c.quadraticCurveTo(-46,18+w,-50,-4+w);
    c.lineWidth=11;c.strokeStyle=INK;c.stroke();c.lineWidth=5;c.strokeStyle=col;c.stroke();
    if(m.tail==='spiky'){P(c,[-57,-2+w,-50,-18+w,-43,-2+w]);fs(c,'#fff1c9',2.5);}
    else{circ(c,-50,-5+w,7);fs(c,dk,2.5);}}
  if(m.arms===4)arm(c,-10,4,-28,-20+Math.sin(t*9)*7,col);
  const body=()=>{c.beginPath();c.ellipse(0,0,30,28,0,0,TAU);};
  body();c.fillStyle=col;c.fill();
  c.save();body();c.clip();
  c.fillStyle=lt;c.beginPath();c.ellipse(12,16,18,14,0,0,TAU);c.fill();
  c.fillStyle=dk;
  if(m.pattern==='spots')[[-15,-9,6],[-19,9,4],[-4,-21,3.5],[-8,14,3]].forEach(([a,b,r])=>{circ(c,a,b,r);c.fill();});
  if(m.pattern==='stripes')for(let i=-30;i<6;i+=11){P(c,[i,-30,i+5,-30,i-1,30,i-6,30]);c.fill();}
  c.restore();
  body();c.lineWidth=3;c.strokeStyle=INK;c.stroke();
  arm(c,6,28,36,33,col);
  const hc='#fff1c9';
  if(m.horns==='small'){P(c,[-15,-23,-9,-38,-4,-26]);fs(c,hc,2.5);P(c,[5,-27,12,-41,16,-24]);fs(c,hc,2.5);}

  // Anzeige
  c.beginPath();c.roundRect(x-L+14,top+3,60,10,3);c.fillStyle=INK;c.fill();c.fillStyle='#ff9f1c';c.font='9px Bungee, "Arial Black", sans-serif';c.textAlign='left';c.fillText('LINIE '+lineNo,x-L+18,top+12);
  if(type==='schul'){c.fillStyle=INK;c.font='12px Bungee, "Arial Black", sans-serif';c.textAlign='center';c.fillText('SCHULBUS',x-L*0.55,y-28);}
  // Lichter
  var fx=type==='schul'?x+16:x-3;circ(c,fx,y-34,5);c.fillStyle='#fff6c2';c.fill();c.lineWidth=2;c.strokeStyle=INK;c.stroke();
  if(night){c.fillStyle='rgba(255,246,194,.25)';c.beginPath();c.moveTo(fx,y-36);c.lineTo(fx+160,y-60);c.lineTo(fx+160,y+10);c.closePath();c.fill();}

  [x-L+32,x-34].forEach(function(wx){circ(c,wx,y-6,16);c.fillStyle=INK;c.fill();circ(c,wx,y-6,8);c.fillStyle='#cfd8dc';c.fill();
    c.save();c.translate(wx,y-6);c.rotate(wheelRot);c.strokeStyle=INK;c.lineWidth=2;for(var k=0;k<3;k++){c.rotate(TAU/3);c.beginPath();c.moveTo(0,0);c.lineTo(8,0);c.stroke();}c.restore();});

function updHud(){$('riders').textContent=G.riders.length+'/'+G.cap;$('done').textContent=G.done+'/'+G.total;$('coins').textContent=G.coins;}
function nextStopIdx(){for(var i=0;i<G.stops.length;i++){if(!G.stops[i].visited&&G.stops[i].x>G.x-6)return i;}return -1;}

function lightYellow(l){var cyc=(G.t+l.off)%10.2;return cyc>=5&&cyc<6.2;}

/* ---------- Steuerung ---------- */
addEventListener('keydown',function(e){if($('game').hidden||(e.target&&e.target.tagName==='INPUT'))return;var c=e.code;
  if(c==='ArrowRight'||c==='KeyD'){e.preventDefault();pedal.gas=1;}
  else if(c==='ArrowLeft'||c==='KeyA'){e.preventDefault();pedal.brake=1;}
  else if(c==='Space'||c==='Enter'){e.preventDefault();if(!e.repeat)toggleDoors();}
  else if(c==='KeyH'){e.preventDefault();if(!e.repeat)honk();}});
addEventListener('keyup',function(e){var c=e.code;if(c==='ArrowRight'||c==='KeyD')pedal.gas=0;if(c==='ArrowLeft'||c==='KeyA')pedal.brake=0;});
addEventListener('blur',function(){pedal.gas=pedal.brake=0;});
function holdBtn(id,k){var el=$(id),pid=null;
  el.addEventListener('pointerdown',function(e){e.preventDefault();initAudio();pid=e.pointerId;try{el.setPointerCapture(pid);}catch(err){}pedal[k]=1;el.classList.add('down');});
  function up(e){if(e.pointerId!==pid)return;pid=null;pedal[k]=0;el.classList.remove('down');}

function hint(t,d){G.hint=t;G.hintT=d||2;}
function toggleDoors(){if(state!=='drive')return;
  if(G.doorTarget===1){if(G.atStop>=0&&!G.stops[G.atStop].served){hint('Warte, es steigen noch Monster ein und aus!');return;}G.doorTarget=0;sfx('door');return;}
  if(G.v>0.4){hint('Erst ganz anhalten, dann Türen auf!');return;}
  G.doorTarget=1;sfx('door');
  var i=nextStopIdx(),s=i>=0?G.stops[i]:null;
  if(s&&Math.abs(G.x-s.x)<6){G.atStop=i;s.visited=true;G.opT=0.6;
    if(Math.abs(G.x-s.x)<1.6){G.perfect++;pop(W/2,150,'Perfekt gehalten! ⭐','#ffe14d');}}
  else{G.atStop=-1;hint('Hier ist keine Haltestelle 🙂');}
}
function honk(){if(state!=='drive')return;sfx('horn');G.horn=0.6;fx.push({k:'txt',x:busScreenX()+10,y:300,text:'TÜÜÜT! 📯',life:0.9,max:0.9});}
function busScreenX(){return 420;}

/* ---------- Ablauf ---------- */
function update(dt){
  fx.forEach(function(f){f.life-=dt;if(f.vx!==undefined){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=300*dt;if(f.r!==undefined)f.r+=dt*8;}else f.y-=30*dt;});
  fx=fx.filter(function(f){return f.life>0;});
  if(state!=='drive'&&state!=='finish')return;
  G.t+=dt;G.hintT-=dt;G.horn-=dt;
  // Gegenverkehr
  if(Math.random()<dt*0.35)cars.push({x:G.x+90,col:pick(['#3fb6ff','#38c172','#ff9f1c','#a66bff','#ff6fb5','#cfd8dc']),v:9+Math.random()*5});
  cars.forEach(function(c){c.x-=c.v*dt;});cars=cars.filter(function(c){return c.x>G.x-70;});
  // Türen
  G.doors+=clamp(G.doorTarget-G.doors,-dt*3,dt*3);
  // Fahren
  var open=G.doors>0.02||G.doorTarget===1;
  if(open&&pedal.gas&&state==='drive'){if(G.atStop>=0&&G.stops[G.atStop].served){G.doorTarget=0;sfx('door');}else if(G.hintT<0.5)hint(G.atStop>=0?'Warte, es steigen noch Monster ein und aus!':'Erst Türen zu! 🚪');}
  var acc=0;
  if(!open&&state==='drive'){if(pedal.gas)acc+=2.6;if(pedal.brake)acc-=7;}
  else if(pedal.brake)acc-=7;
  acc-=0.35+G.v*0.03;
  var mx=15;G.v=clamp(G.v+acc*dt,0,mx);
  if(open)G.v=0;
  if(pedal.brake&&G.v>9&&Math.random()<dt*4)sfx('squeak');
  var px=G.x;G.x+=G.v*dt;G.wheel+=G.v*dt/1.3;
  if(G.x>G.endX){G.x=G.endX;G.v=0;}
  // Ampeln
  G.lights.forEach(function(l){if(px<l.x-1&&G.x>=l.x-1){if(lightRed(l)){G.reds++;G.coins=Math.max(0,G.coins-5);pop(W/2,150,'Über Rot gefahren! 🚨 -5 🪙','#ff8a80');sfx('fail');}}});
  // Haltestellen verpasst
  G.stops.forEach(function(s,i){if(s.visited||G.x<s.x+7)return;s.visited=true;
    var out=G.riders.filter(function(r){return r.dest===i;}).length;
    if(s.waiting.length||out){s.missed=true;s.waiting.forEach(function(w){w.sad=true;});G.missed+=s.waiting.length;
      pop(W/2,150,'Oh nein! '+s.emo+' '+s.name+' vergessen 😢','#ff8a80');sfx('fail');}
    G.riders.forEach(function(r){if(r.dest===i)r.missed=true;});});
  // Ein- und Aussteigen
  if(G.atStop>=0&&G.doors>0.95){var s=G.stops[G.atStop];G.opT-=dt;
    if(G.opT<=0){
      var outIdx=-1;for(var k=0;k<G.riders.length;k++){if(G.riders[k].dest===G.atStop||(G.atStop===G.stops.length-1)){outIdx=k;break;}}
      if(outIdx>=0){var r=G.riders.splice(outIdx,1)[0];var ok=!r.missed;
        walkers.push({sp:r.sp,x:G.x-0.55*busDims(BUS.type).L*BSC/S+1,y:RY,tx:s.x-14-Math.random()*6,dir:-1,mode:'out',sad:!ok,t:0});
        if(ok){G.done++;var c2=5+(G.perfect?1:0);G.coins+=c2;fx.push({k:'coin',x:W/2-40,y:330,text:'+'+c2+' 🪙',life:1,max:1});sfx('coin');}else{G.missed++;}
        G.opT=0.45;updHud();}
      else if(s.waiting.length&&G.riders.length<G.cap){var w=s.waiting.shift();G.riders.push({sp:w.sp,dest:w.dest,missed:false});sfx('step');G.opT=0.45;updHud();
        fx.push({k:'txt',x:W/2-70,y:360,text:'Hallo! 👋',life:0.6,max:0.6});}
      else if(!s.served){s.served=true;G.opT=99;
        if(G.atStop===G.stops.length-1){state='finish';G.finishT=1.6;sfx('bell');pop(W/2,150,'Endstation! Alle aussteigen! 🏁','#7fffb0');}
        else hint('Alle fertig! Türen zu und weiterfahren 🚪',3);
        if(s.waiting.length){G.missed+=s.waiting.length;s.waiting.forEach(function(w){w.sad=true;});hint('Der Bus ist voll! 😮',3);}}
    }
  }
  if(state==='finish'){G.finishT-=dt;if(G.finishT<=0)endLine();}
  // Ende der Straße
  if(G.x>=G.endX&&state==='drive'&&!G.stops[G.stops.length-1].served&&G.doorTarget===0&&G.v===0){
    G.missed+=G.riders.length;G.riders=[];state='finish';G.finishT=1.2;pop(W/2,150,'Ende der Straße! 🚧','#ff8a80');}
  walkers.forEach(function(w){w.t+=dt;var sp=3*dt;w.x+=(w.tx>w.x?1:-1)*Math.min(sp,Math.abs(w.tx-w.x));w.y=Math.min(WALK,w.y+60*dt);if(Math.abs(w.tx-w.x)<0.1&&w.y>=WALK)w.gone=w.t>2;});
  walkers=walkers.filter(function(w){return !w.gone;});
  // Hinweise
  if(G.hintT<0&&state==='drive'){var ni=nextStopIdx();
    if(ni>=0){var s2=G.stops[ni],d=s2.x-G.x;
      if(d<40&&d>6&&G.v>6)hint('Bremsen! Haltestelle '+s2.emo,0.3);
      else if(Math.abs(d)<6&&G.v<0.4&&G.doorTarget===0)hint('Türen auf! 🚪',0.3);}
    G.lights.forEach(function(l){var d2=l.x-G.x;if(d2>0&&d2<45&&(lightRed(l)||lightYellow(l)))hint('Rote Ampel – anhalten! 🚦',0.3);});}
}
function endLine(){
  state='over';
  var ratio=G.total?G.done/G.total:1,st=ratio>=0.9?3:ratio>=0.6?2:1;if(G.reds>=2)st=Math.max(1,st-1);
  STARS[line]=Math.max(STARS[line],st);if(line+1<LINES.length&&unlocked<line+2)unlocked=line+2;
  var card=mkCard(st===3?'Super gefahren! ⭐⭐⭐':st===2?'Gut gefahren! ⭐⭐':'Geschafft! ⭐');
  addP(card,G.done+' von '+G.total+' Monstern ans Ziel gebracht.'+(G.missed?' '+G.missed+' wurden vergessen 😢':' Keiner vergessen! 🎉'));
  addP(card,'Münzen: '+G.coins+' 🪙'+(G.perfect?' · Perfekt gehalten: '+G.perfect+'×':'')+(G.reds?' · Über Rot: '+G.reds+'× 🚨':''));
  var btns=[['Zum Busdepot',function(){$('quit').click();}],['Nochmal',function(){hideOverlay();startLine();}]];
  if(line+1<LINES.length)btns.push(['Linie '+(line+2)+' →',function(){line++;hideOverlay();startLine();},'go']);
  else addP(card,'Du bist alle Linien gefahren! Du bist der beste Busfahrer der Welt! 🏆');
  addBtns(card,btns);showOverlay(card);
  if(st>=2){sfx('fanfare');for(var i=0;i<60;i++){var a=Math.random()*TAU,v=120+Math.random()*260;fx.push({k:'c',x:W/2,y:180,vx:Math.cos(a)*v,vy:Math.sin(a)*v-140,life:1.8,max:1.8,col:pick(['#ffe14d','#ff5a4e','#3fb6ff','#38c172','#ff6fb5']),r:Math.random()*TAU});}}
}
function pop(x,y,text,col){fx.push({k:'big',x:x,y:y,text:text,col:col,life:2,max:2});}
function mkCard(t){var c=document.createElement('div');c.className='card ocard';var h=document.createElement('h2');h.textContent=t;c.appendChild(h);return c;}
function addP(c,t){var p=document.createElement('p');p.textContent=t;c.appendChild(p);}
function addBtns(c,list){var ac=document.createElement('div');ac.className='actions';
  list.forEach(function(b){var e=document.createElement('button');e.className='btn'+(b[2]?' '+b[2]:'');e.textContent=b[0];e.onclick=b[1];ac.appendChild(e);});c.appendChild(ac);}
function showOverlay(node){var o=$('overlay');o.innerHTML='';o.appendChild(node);o.hidden=false;}
function hideOverlay(){$('overlay').hidden=true;}
$('quit').onclick=function(){state='idle';$('game').hidden=true;hideOverlay();$('builder').hidden=false;leaveGameScreen();showBuilder();};

/* ---------- Zeichnen ---------- */
function buildSky(night){var cnv=document.createElement('canvas'),d=Math.min(DPR_MAX,window.devicePixelRatio||1),w=800,h=330;cnv.width=w*d;cnv.height=h*d;
  var c=cnv.getContext('2d');c.setTransform(d,0,0,d,0,0);
  var cols=night?['#3b3552','#4b4370','#2b2838']:['#9fb4d6','#b8c7e3','#8aa1c8'];
  for(var i=0;i<14;i++){var bw=40+rnd(i)*50,bh=80+rnd(i*7)*150,bx=i*58+rnd(i*3)*20;c.fillStyle=cols[i%3];c.fillRect(bx,h-bh,bw,bh);
    for(var y=h-bh+10;y<h-10;y+=18)for(var x=bx+6;x<bx+bw-8;x+=14){c.fillStyle=night?(rnd(x*y)<0.5?'#ffe7a3':'#2b2838'):'rgba(255,255,255,.35)';c.fillRect(x,y,7,9);}}
  return cnv;}
function wx(x){return (x-G.x)*S+busScreenX();}
function drawGame(t){
  var c=g,night=G.L.night;
  if(!skyCache)skyCache=buildSky(night);
  var gr=c.createLinearGradient(0,0,0,330);if(night){gr.addColorStop(0,'#14122a');gr.addColorStop(1,'#3b3552');}else{gr.addColorStop(0,'#7cc8ff');gr.addColorStop(1,'#dff4ff');}c.fillStyle=gr;c.fillRect(0,0,W,330);
  if(night){for(var i=0;i<40;i++){circ(c,rnd(i)*W,rnd(i*3)*160,1.5);c.fillStyle='#fff';c.fill();}circ(c,860,70,26);c.fillStyle='#fff6c2';c.fill();}
  else{circ(c,860,70,30);c.fillStyle='#ffe14d';c.fill();}
  var so=((G.x*S*0.25)%800+800)%800;for(var k=-1;k<2;k++)c.drawImage(skyCache,k*800-so,0,800,330);
  // Gehweg hinten, Straße, Gehweg vorne
  c.fillStyle=night?'#6b7280':'#cfd8dc';c.fillRect(0,330,W,25);
  c.fillStyle=night?'#3a3f4a':'#5b6270';c.fillRect(0,355,W,128);
  c.fillStyle='#ffffff';var lo=((G.x*S)%80+80)%80;for(var x=-lo;x<W;x+=80)c.fillRect(x,414,44,5);
  c.fillStyle=night?'#8a8f99':'#e8e8ee';c.fillRect(0,483,W,77);c.fillStyle=INK;c.fillRect(0,481,W,3);
  for(x=-((G.x*S)%60+60)%60;x<W;x+=60){c.fillStyle='rgba(0,0,0,.08)';c.fillRect(x,483,2,77);}
  // Haltestellen-Gebäude hinten
  G.stops.forEach(function(s,i){var X=wx(s.x)-40;if(X<-200||X>W+200)return;
    c.beginPath();c.roundRect(X-70,200,140,130,8);fs(c,night?'#5d5480':pick2(i),3);
    c.beginPath();c.roundRect(X-56,214,112,40,8);fs(c,'#ffffff',2.5);c.font='26px sans-serif';c.textAlign='center';c.fillStyle=INK;c.fillText(s.emo,X-30,244);
    c.font='13px Bungee, "Arial Black", sans-serif';c.fillText(s.name.length>11?s.name.slice(0,11)+'.':s.name,X+18,240);
    c.fillStyle=night?'#ffe7a3':'#bfe9ff';c.fillRect(X-50,270,30,30);c.fillRect(X+20,270,30,30);c.fillStyle=INK;c.fillRect(X-12,290,24,40);});
  // Gegenverkehr
  cars.forEach(function(cr){var X=wx(cr.x);drawCar(c,X,412,cr.col,night);});
  // Ampeln
  G.lights.forEach(function(l){var X=wx(l.x);if(X<-60||X>W+60)return;
    c.fillStyle='#ffffff';c.fillRect(X-2,357,6,124);
    c.fillStyle='#3b3552';c.fillRect(X+8,470,4,70);c.beginPath();c.roundRect(X-4,400,28,64,6);fs(c,'#2b2838',2.5);
    var red=lightRed(l),yel=lightYellow(l);
    circ(c,X+10,412,7);c.fillStyle=red?'#ff3b30':'#4a2020';c.fill();circ(c,X+10,431,7);c.fillStyle=yel?'#ffcc00':'#4a4020';c.fill();circ(c,X+10,450,7);c.fillStyle=!red&&!yel?'#34c759':'#204a28';c.fill();});
  var EX=wx(G.endX+1.5);if(EX<W+80){for(var q=0;q<6;q++){c.fillStyle=q%2?'#ff5a4e':'#ffffff';c.fillRect(EX,360+q*20,16,20);}c.strokeStyle=INK;c.lineWidth=2.5;c.strokeRect(EX,360,16,120);
    c.beginPath();c.roundRect(EX-30,300,90,40,8);fs(c,'#ffe14d',2.5);c.font='14px Bungee, "Arial Black", sans-serif';c.textAlign='center';c.fillStyle=INK;c.fillText('DEPOT',EX+15,326);}
  // Haltestellen-Schilder vorne
  G.stops.forEach(function(s,i){var X=wx(s.x);if(X<-120||X>W+120)return;
    c.fillStyle='rgba(255,225,77,.35)';c.fillRect(X-6*S,486,12*S,8);
    c.fillStyle='#6b7280';c.fillRect(X+6,470,4,80);circ(c,X+8,470,16);fs(c,'#ffe14d',2.5);c.font='16px sans-serif';c.textAlign='center';c.fillStyle=INK;c.fillText('🚏',X+8,476);
    s.waiting.forEach(function(w,k){var wxp=X-34-k*30,wy=WALK+Math.sin(t*3+w.ph)*1.5;c.drawImage(w.sp,wxp-24,wy-46,48,48);
      var em=w.sad?'😢':G.stops[w.dest].emo;c.beginPath();c.roundRect(wxp-14,wy-70,28,24,8);fs(c,'#ffffff',2);c.font='15px sans-serif';c.textAlign='center';c.fillStyle=INK;c.fillText(em,wxp,wy-52);});});
  // Bus
  c.save();c.translate(busScreenX(),RY);c.scale(BSC,BSC);c.translate(-busScreenX(),-RY);
  drawBus(c,busScreenX(),RY,BUS.type,BUS.color,G.doors,t,G.riders,G.wheel,night,G.L.n);c.restore();
  // Aussteiger
  walkers.forEach(function(w){var X=wx(w.x);c.drawImage(w.sp,X-24,w.y-46,48,48);if(w.t<1.6){c.beginPath();c.roundRect(X-14,w.y-70,28,24,8);fs(c,'#ffffff',2);c.font='15px sans-serif';c.textAlign='center';c.fillStyle=INK;c.fillText(w.sad?'😢':'😄',X,w.y-52);}});
  // Anzeigen
  drawPanel(c,t);
  if(G.hintT>0&&G.hint){c.font='22px Bungee, "Arial Black", sans-serif';var tw=c.measureText(G.hint).width;c.beginPath();c.roundRect(W/2-tw/2-16,190,tw+32,40,12);fs(c,'rgba(255,255,255,.95)',3);c.fillStyle=INK;c.textAlign='center';c.fillText(G.hint,W/2,219);}
  fx.forEach(function(f){c.globalAlpha=Math.min(1,f.life/f.max*2);
    if(f.k==='c'){c.save();c.translate(f.x,f.y);c.rotate(f.r);c.fillStyle=f.col;c.fillRect(-5,-3,10,6);c.restore();}
    else if(f.k==='coin'){c.font='20px Bungee, "Arial Black", sans-serif';c.textAlign='center';c.lineWidth=5;c.strokeStyle=INK;c.strokeText(f.text,f.x,f.y);c.fillStyle='#ffe14d';c.fillText(f.text,f.x,f.y);}
    else if(f.k==='txt'){c.font='18px Bungee, "Arial Black", sans-serif';c.textAlign='center';c.lineWidth=5;c.strokeStyle=INK;c.strokeText(f.text,f.x,f.y);c.fillStyle='#fff';c.fillText(f.text,f.x,f.y);}
    else if(f.k==='big'){bigText(c,f.text,f.y,30,f.col);}});
  c.globalAlpha=1;
}
function pick2(i){return ['#ffb38a','#a8e890','#9fdcff','#ffd27a','#d7b8ff','#ffb3d9','#fff1a8'][i%7];}
function drawCar(c,X,y,col,night){c.beginPath();c.roundRect(X-30,y-30,60,22,8);fs(c,col,2.5);c.beginPath();c.roundRect(X-18,y-44,34,16,6);fs(c,col,2.5);
  c.fillStyle=night?'#ffe7a3':'#bfe9ff';c.fillRect(X-14,y-41,12,11);c.fillRect(X+1,y-41,12,11);
  [X-18,X+18].forEach(function(wx2){circ(c,wx2,y-8,7);c.fillStyle=INK;c.fill();});}
function drawPanel(c,t){
  // Tacho
  c.beginPath();c.roundRect(16,16,130,60,12);fs(c,'rgba(255,255,255,.92)',3);
  c.font='30px Bungee, "Arial Black", sans-serif';c.textAlign='center';c.fillStyle=INK;c.fillText(Math.round(G.v*3.6),70,56);c.font='12px Bungee, "Arial Black", sans-serif';c.fillText('km/h',118,56);
  // Nächster Halt
  var ni=nextStopIdx();var txt=ni>=0?('Nächster Halt: '+G.stops[ni].emo+' '+G.stops[ni].name):'Endstation';
  var out=ni>=0?G.riders.filter(function(r){return r.dest===ni;}).length:0,inn=ni>=0?G.stops[ni].waiting.length:0;
  c.font='17px Bungee, "Arial Black", sans-serif';var tw=Math.max(c.measureText(txt).width,250);
  c.beginPath();c.roundRect(W/2-tw/2-18,16,tw+36,62,10);fs(c,'#1d1a2b',3);c.fillStyle='#ff9f1c';c.textAlign='center';c.fillText(txt,W/2,42);
  c.font='13px Bungee, "Arial Black", sans-serif';c.fillStyle='#ffe7a3';c.fillText('⬇ '+out+' steigen aus   ⬆ '+inn+' warten',W/2,66);
  // Fahrgäste nach Ziel
  var cnt={};G.riders.forEach(function(r){var e=G.stops[r.dest].emo;cnt[e]=(cnt[e]||0)+1;});var keys2=Object.keys(cnt);
  if(keys2.length){var s=keys2.map(function(k){return k+'×'+cnt[k];}).join('  ');c.font='16px sans-serif';var w2=c.measureText(s).width;
    c.beginPath();c.roundRect(W-w2-46,16,w2+30,40,10);fs(c,'rgba(255,255,255,.92)',3);c.fillStyle=INK;c.textAlign='left';c.fillText(s,W-w2-31,42);}
}
function bigText(c,text,y,size,col){c.font=size+'px Bungee, "Arial Black", sans-serif';c.textAlign='center';c.lineJoin='round';
  c.lineWidth=Math.max(5,size/6);c.strokeStyle=INK;c.strokeText(text,W/2,y);c.fillStyle=col;c.fillText(text,W/2,y);}

/* ---------- Ton ---------- */
var AC=null,muted=false,eng=null;
function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f0,f1,type,dur,vol,delay){
  var n=AC.currentTime+(delay||0),o=AC.createOscillator(),gn=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,n);o.frequency.exponentialRampToValueAtTime(f1,n+dur);
  gn.gain.setValueAtTime(vol,n);gn.gain.setValueAtTime(vol,n+dur*0.6);gn.gain.exponentialRampToValueAtTime(0.0001,n+dur);
  o.connect(gn);gn.connect(AC.destination);o.start(n);o.stop(n+dur+0.02);}
var lastSq=0;
function sfx(k){if(!AC||muted)return;
  if(k==='horn'){tone(330,330,'sawtooth',0.45,0.05);tone(415,415,'sawtooth',0.45,0.04);}
  else if(k==='door'){tone(1200,300,'sawtooth',0.25,0.03);}
  else if(k==='bell'){tone(880,880,'sine',0.3,0.07);tone(698,698,'sine',0.4,0.07,0.3);}
  else if(k==='coin')tone(988,1318,'square',0.08,0.03);
  else if(k==='step')tone(500,700,'triangle',0.06,0.04);
  else if(k==='squeak'){var n=performance.now();if(n-lastSq<500)return;lastSq=n;tone(1800,1500,'sine',0.25,0.02);}
  else if(k==='fail')tone(300,150,'triangle',0.35,0.08);
  else if(k==='fanfare'){[392,523,659,784,659,784].forEach(function(f,i){tone(f,f,'square',0.16,0.045,i*0.15);});}}
function engine(){if(!AC||muted||state!=='drive'||!G){if(eng){eng.g.gain.value=0;}return;}
  if(!eng){var o=AC.createOscillator(),gn=AC.createGain();o.type='sawtooth';o.frequency.value=40;gn.gain.value=0;o.connect(gn);gn.connect(AC.destination);o.start();eng={o:o,g:gn};}
  eng.o.frequency.value=38+G.v*5;eng.g.gain.value=0.012+(pedal.gas?0.012:0);}
$('mute').onclick=function(){muted=!muted;$('mute').textContent=muted?'🔇 Ton aus':'🔊 Ton an';initAudio();if(muted&&eng)eng.g.gain.value=0;};

/* ---------- Schleife ---------- */
showBuilder();
var last=performance.now();
function loop(now){var raw=(now-last)/1000,dt=Math.min(0.05,raw);last=now;var t=now/1000;perfTick(raw);
  if(!$('builder').hidden)drawPreview(t);
  if(!$('game').hidden&&G){update(dt);drawGame(t);}
  if(AC)engine();
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
