<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="Restaurant">
<title>Fietes Monster-Restaurant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Bungee&display=swap">
<style>
/* Layout: Imbiss-Theke – Sticker-Karten mit harten Schatten auf Minz-Fliesen, Theke mit Gast oben und Kochplatz unten ist die Hauptbühne */
:root{
  --mint:#c8f0e0; --tile:rgba(20,110,80,.10); --ink:#1d1a2b; --paper:#fffaf0;
  --grape:#6c3fd1; --go:#38c172; --sky:#3fb6ff; --white:#ffffff; --red:#ff5a4e; --p1:#ffe14d;
  --display:'Bungee','Arial Black',Impact,system-ui,sans-serif;
  --body:'Baloo 2','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;min-height:100%}
*{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
html,body{background-color:var(--mint);color:var(--ink);
  background-image:linear-gradient(var(--tile) 2px,transparent 2px),linear-gradient(90deg,var(--tile) 2px,transparent 2px);background-size:40px 40px;background-attachment:fixed}
body{font-family:var(--body);font-size:18px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1060px;margin:0 auto;display:grid;gap:20px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,44px);line-height:1;margin:0;text-wrap:balance}
h1 span{color:var(--white);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.steps{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0}
.steps li{font-weight:800;font-size:16px;padding:3px 14px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);opacity:.5}
.steps li.on{opacity:1;background:var(--grape);color:var(--white)}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink)}
.builder{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
@media (max-width:820px){.builder{grid-template-columns:minmax(0,1fr)}}
.preview{padding:16px;display:grid;gap:10px}
@media (min-width:821px){.preview{position:sticky;top:12px}}
#pv{display:block;width:100%;height:auto;border:3px solid var(--ink);border-radius:14px}
label{font-weight:800}
.txt-in{font:inherit;font-weight:800;font-size:20px;padding:5px 14px;border:3px solid var(--ink);border-radius:12px;background:var(--white);color:var(--ink);width:100%;box-sizing:border-box}
.panel{padding:18px 20px;display:grid;gap:16px;min-width:0}
.flat{padding:0}
h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0;text-wrap:balance}
.row{display:grid;gap:6px}
.lab{font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:700;font-size:17px;padding:3px 14px;border:3px solid var(--ink);border-radius:12px;background:var(--white);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.chip.sel{background:var(--grape);color:var(--white)}
.chip.sw{width:42px;height:42px;padding:0;border-radius:50%}
.chip.sw.sel{outline:4px solid var(--grape);outline-offset:3px}
:focus-visible{outline:4px solid var(--sky);outline-offset:2px}
.sep{border:0;border-top:3px dashed rgba(29,26,43,.2);margin:4px 0;width:100%}
.btn{font-family:var(--display);font-weight:400;font-size:18px;padding:10px 18px;border:3px solid var(--ink);border-radius:14px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);background:var(--white);color:var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.go{background:var(--go)}
.btn.small{font-size:15px;padding:6px 14px;box-shadow:3px 3px 0 var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
.actions #go{margin-left:auto}
.game{display:grid;gap:10px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.stage{position:relative;border:3px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:6px 6px 0 var(--ink);background:#ffe9c7;justify-self:center;width:100%;box-sizing:border-box}
#cv{display:block;width:100%;height:auto;touch-action:none}
.overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:grid;place-items:center;background:rgba(29,26,43,.55);padding:12px}
.ocard{padding:16px 22px;width:min(460px,100%);box-sizing:border-box;display:grid;gap:10px;text-align:center}
.ocard h2{font-size:26px}
.ocard p{margin:0;font-weight:700}
.ocard .actions{justify-content:center}
@media (max-width:700px){.overlay{position:static;background:none;padding:12px 0 0}}
.bar1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.tabs{display:flex;gap:6px}
.tab{font-size:28px;line-height:1;padding:6px 10px;min-width:58px;font-family:var(--emoji);touch-action:none;box-shadow:3px 3px 0 var(--ink)}
.tab.sel{background:var(--p1);outline:4px solid var(--grape);outline-offset:2px}
.acts{display:flex;gap:8px}
.act{font-size:15px;padding:8px 12px;touch-action:none;box-shadow:3px 3px 0 var(--ink)}
.act.serve{background:var(--go);font-size:17px}
.act.cook{background:#ff9f1c}
.mid{flex:1;min-width:0;display:grid;gap:8px;justify-items:center;align-content:center}
.tbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tbar .btn.small{font-size:13px;padding:5px 10px}
.ings{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.ing{display:grid;justify-items:center;min-width:76px;padding:4px 6px;font-family:var(--body);font-weight:800;font-size:12px;line-height:1.15;touch-action:none;box-shadow:3px 3px 0 var(--ink)}
.ing .fe{font-size:26px;line-height:1.15;font-family:var(--emoji)}
.ing .dot{width:26px;height:26px;border-radius:50%;border:3px solid var(--ink);margin:1px 0}
html.is-touch .ing{min-width:80px;min-height:66px}
.foot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
body.playing{padding-block:8px 4px}
body.playing .top{display:none}
.hall{font-family:var(--display);font-size:14px;padding:4px 12px;border:3px solid var(--ink);border-radius:12px;background:var(--white);color:var(--ink);text-decoration:none;box-shadow:3px 3px 0 var(--ink)}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Fietes <span>Monster-Restaurant</span></h1>
    <a class="hall" href="index.html">← Spielehalle</a>
    <ol class="steps" id="steps"><li class="on">1 Koch</li><li>2 Kochen</li></ol>
  </header>

  <section id="builder" class="builder">
    <div class="card preview">
      <canvas id="pv" width="440" height="300" aria-label="Vorschau von deinem Monster-Koch"></canvas>
      <label for="name">Wie heißt dein Monster-Koch?</label>
      <input id="name" class="txt-in" maxlength="14" autocomplete="off">
      <label for="rname">Wie heißt dein Restaurant?</label>
      <input id="rname" class="txt-in" maxlength="24" autocomplete="off">
    </div>
    <div class="card panel">
      <div class="row">
        <div class="lab">Wie gut kochst du schon?</div>
        <div class="chips"><button type="button" id="d0" class="chip">🥄 Lehrling</button><button type="button" id="d1" class="chip sel">👨‍🍳 Koch</button><button type="button" id="d2" class="chip">🏆 Meisterkoch</button></div>
        <p id="lvltxt" style="margin:0;font-weight:700;font-size:15px"></p>
      </div>
      <hr class="sep">
      <h2>Bau deinen Monster-Koch!</h2>
      <div id="rows" class="panel flat" style="gap:14px"></div>
      <div class="actions">
        <button id="rand" class="btn small">🎲 Zufalls-Monster</button>
        <button id="go" class="btn go">Restaurant öffnen!</button>
      </div>
    </div>
  </section>

  <section id="game" class="game" hidden>
    <div class="stage">
      <canvas id="cv" width="1000" height="560" aria-label="Dein Restaurant"></canvas>
      <div id="overlay" class="overlay" hidden></div>
    </div>
    <div class="bar1">
      <div class="tabs" id="tabs"></div>
      <div class="mid" id="tmid"></div>
      <div class="acts">
        <button type="button" class="btn act" id="peek" hidden>👀 Spicken</button>
        <button type="button" class="btn act" id="trash">🗑️ Neu</button>
        <button type="button" class="btn act cook" id="cook">🔥 Backen</button>
        <button type="button" class="btn act serve" id="serve">🍽️ Servieren</button>
      </div>
    </div>
    <div class="ings" id="ings"></div>
    <div class="foot">
      <button id="quit" class="btn small">← Zum Koch</button>
      <button id="mute" class="btn small">🔊 Ton an</button>
    </div>
  </section>
</div>

<script>
/* ===== iPad-Grundlagen (Zielgerät: iPad Air 2, iOS 15, Safari) =====
   - Touch erkennen, Bildschirm einpassen, kein Scrollen/Zoomen im Spiel
   - Ton unter iOS freischalten (braucht ein echtes Antippen)
   - Bildqualität automatisch senken, wenn das Gerät zu langsam ist */
var DPR_MAX=2;
var IS_TOUCH=('ontouchstart' in window)||(navigator.maxTouchPoints||0)>0;
if(IS_TOUCH)document.documentElement.classList.add('is-touch');
function gameOn(){var g=document.getElementById('game');return !!g&&!g.hidden;}
function fitStage(){
  var game=document.getElementById('game'),stage=document.querySelector('.stage'),c=document.getElementById('cv');
  if(!game||game.hidden||!stage||!c)return;
  stage.style.maxWidth='';
  var other=game.getBoundingClientRect().height-stage.getBoundingClientRect().height;
  var avail=window.innerHeight-other-22;
  stage.style.maxWidth=Math.max(300,Math.floor(avail*c.width/c.height))+'px';
}
function enterGameScreen(){document.body.classList.add('playing');window.scrollTo(0,0);fitStage();requestAnimationFrame(fitStage);setTimeout(fitStage,400);}
function leaveGameScreen(){document.body.classList.remove('playing');var s=document.querySelector('.stage');if(s)s.style.maxWidth='';window.scrollTo(0,0);}
window.addEventListener('resize',fitStage);
window.addEventListener('orientationchange',function(){setTimeout(fitStage,400);});
var audioUnlocked=false;
function unlockAudio(){
  if(typeof initAudio!=='function')return;
  initAudio();
  if(audioUnlocked||!AC)return;
  try{var b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0);audioUnlocked=true;}catch(e){}
}
document.addEventListener('touchend',unlockAudio,true);
document.addEventListener('click',unlockAudio,true);
document.addEventListener('touchmove',function(e){
  if(gameOn()&&!(e.target&&e.target.closest&&e.target.closest('.ocard,.rcard')))e.preventDefault();
},{passive:false});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
var perfN=0,perfSum=0,lowQ=false;
function perfTick(raw){
  if(lowQ||!gameOn()||document.hidden||raw>0.25)return;
  perfN++;perfSum+=raw;
  if(perfN>=90){
    if(perfSum/perfN>0.026){lowQ=true;DPR_MAX=1;if(typeof onLowQuality==='function')onLowQuality();}
    perfN=0;perfSum=0;
  }
}
function compactControls(){
  if(!IS_TOUCH)return;
  var mid=document.getElementById('tmid'),foot=document.querySelector('.foot');if(!mid||!foot)return;
  var bar=document.createElement('div');bar.className='tbar';
  while(foot.firstElementChild)bar.appendChild(foot.firstElementChild);
  mid.appendChild(bar);foot.hidden=true;
}
compactControls();
/* ===== Ende iPad-Grundlagen ===== */


/* Kompatibilität: ältere Safari-Versionen (iPadOS < 16) kennen roundRect nicht */
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.max(0,Math.min(typeof r==='number'?r:(r&&r[0])||0,Math.abs(w)/2,Math.abs(h)/2));
    this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};
}
/* Fehler sichtbar machen, falls doch etwas schiefgeht (hilft auf dem iPad ohne Entwicklerwerkzeuge) */
window.addEventListener('error',function(e){
  var b=document.getElementById('errbox');
  if(!b){b=document.createElement('div');b.id='errbox';
    b.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#fffaf0;color:#1d1a2b;border:3px solid #1d1a2b;border-radius:14px;padding:10px 14px;font:600 15px/1.35 system-ui,sans-serif;box-shadow:4px 4px 0 #1d1a2b';
    document.body.appendChild(b);}
  b.textContent='Ups, da ist etwas kaputtgegangen. Bitte diesen Text an Claude schicken: '+e.message+' (Zeile '+e.lineno+')';
});

const INK='#1d1a2b', TAU=Math.PI*2;
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shade(hex,a){let n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  const f=v=>Math.round(a<0?v*(1+a):v+(255-v)*a);return `rgb(${f(r)},${f(g)},${f(b)})`;}
function P(c,p){c.beginPath();c.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);c.closePath();}
function fs(c,fill,lw=3){c.fillStyle=fill;c.fill();c.lineWidth=lw;c.strokeStyle=INK;c.stroke();}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,TAU);}
function setup(cv,w,h){const d=Math.min(DPR_MAX,window.devicePixelRatio||1);cv.width=w*d;cv.height=h*d;const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);return x;}

/* ---------- Monster ---------- */
const COLORS=['#38c172','#ff5a4e','#3fb6ff','#a66bff','#ff9f1c','#ff6fb5','#2ec4b6','#8d6e63'];
const OPTS={
  color:COLORS.map(v=>({v})),
  eyes:[{v:1,l:'1'},{v:2,l:'2'},{v:3,l:'3'},{v:5,l:'5'}],
  horns:[{v:'none',l:'Keine'},{v:'small',l:'Kleine'},{v:'big',l:'Riesig'},{v:'antenna',l:'Antennen'}],
  mouth:[{v:'smile',l:'Lächeln'},{v:'teeth',l:'Zähne'},{v:'fangs',l:'Riesenzähne'},{v:'tongue',l:'Zunge raus'}],
  arms:[{v:2,l:'2 Arme'},{v:4,l:'4 Arme'}],
  tail:[{v:'none',l:'Keiner'},{v:'tail',l:'Puschel'},{v:'spiky',l:'Stachel'}],
  wings:[{v:false,l:'Keine'},{v:true,l:'Flügel'}],
  pattern:[{v:'none',l:'Keins'},{v:'spots',l:'Punkte'},{v:'stripes',l:'Streifen'}],
};
const ROWS=[['color','Farbe'],['eyes','Augen'],['horns','Hörner'],['mouth','Mund'],['arms','Arme'],['tail','Schwanz'],['wings','Flügel'],['pattern','Muster']];
function randMonster(except){const m={};for(const k in OPTS)m[k]=pick(OPTS[k]).v;
  if(except){m.color=pick(COLORS.filter(c=>!except.includes(c)));}return m;}

function arm(c,x1,y1,x2,y2,col){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.lineWidth=10;c.strokeStyle=INK;c.stroke();
  c.lineWidth=5;c.strokeStyle=col;c.stroke();circ(c,x2,y2,4.5);fs(c,col,2.5);}
const EYES={1:[[10,-8,11]],2:[[2,-10,8],[18,-8,7]],3:[[-6,-12,7],[10,-15,7.5],[22,-3,6]],5:[[-10,-12,5.5],[1,-19,6],[13,-13,6.5],[23,-3,5],[5,-2,4.5]]};

function drawMonster(c,m,x,y,s,t){
  const col=m.color,dk=shade(col,-0.3),lt=shade(col,0.4);
  c.save();c.translate(x,y+Math.sin(t*7)*1.2);c.scale(s,s);c.lineJoin='round';c.lineCap='round';
  if(m.wings){const f=Math.sin(t*16)*0.4;c.save();c.translate(-8,-14);c.rotate(-0.5+f);
    c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(-20,-36,-46,-28);c.quadraticCurveTo(-34,-16,-40,-4);c.quadraticCurveTo(-22,-8,0,0);c.closePath();
    fs(c,'rgba(255,255,255,.9)',2.5);c.restore();}
  if(m.tail!=='none'){const w=Math.sin(t*6)*5;c.beginPath();c.moveTo(-22,12);c.quadraticCurveTo(-46,18+w,-50,-4+w);
    c.lineWidth=11;c.strokeStyle=INK;c.stroke();c.lineWidth=5;c.strokeStyle=col;c.stroke();
    if(m.tail==='spiky'){P(c,[-57,-2+w,-50,-18+w,-43,-2+w]);fs(c,'#fff1c9',2.5);}
    else{circ(c,-50,-5+w,7);fs(c,dk,2.5);}}
  if(m.arms===4)arm(c,-10,4,-28,-20+Math.sin(t*9)*7,col);
  const body=()=>{c.beginPath();c.ellipse(0,0,30,28,0,0,TAU);};
  body();c.fillStyle=col;c.fill();
  c.save();body();c.clip();
  c.fillStyle=lt;c.beginPath();c.ellipse(12,16,18,14,0,0,TAU);c.fill();
  c.fillStyle=dk;
  if(m.pattern==='spots')[[-15,-9,6],[-19,9,4],[-4,-21,3.5],[-8,14,3]].forEach(([a,b,r])=>{circ(c,a,b,r);c.fill();});
  if(m.pattern==='stripes')for(let i=-30;i<6;i+=11){P(c,[i,-30,i+5,-30,i-1,30,i-6,30]);c.fill();}
  c.restore();
  body();c.lineWidth=3;c.strokeStyle=INK;c.stroke();
  arm(c,6,28,36,33,col);
  const hc='#fff1c9';
  if(m.horns==='small'){P(c,[-15,-23,-9,-38,-4,-26]);fs(c,hc,2.5);P(c,[5,-27,12,-41,16,-24]);fs(c,hc,2.5);}
  if(m.horns==='big'){c.beginPath();c.moveTo(-20,-18);c.quadraticCurveTo(-34,-42,-14,-54);c.quadraticCurveTo(-22,-40,-6,-26);c.closePath();fs(c,hc,2.5);
    c.beginPath();c.moveTo(4,-27);c.quadraticCurveTo(10,-52,30,-54);c.quadraticCurveTo(18,-42,18,-20);c.closePath();fs(c,hc,2.5);}
  if(m.horns==='antenna'){const w=Math.sin(t*5)*3;[[-6,-27,-13+w,-48],[8,-27,15+w,-48]].forEach(([a,b,cx,cy])=>{
    c.beginPath();c.moveTo(a,b);c.lineTo(cx,cy);c.lineWidth=3;c.strokeStyle=INK;c.stroke();circ(c,cx,cy,5);fs(c,'#ffe14d',2.5);});}
  const blink=((t*0.7)%3)<0.09;
  for(const [ex,ey,r] of EYES[m.eyes]){circ(c,ex,ey,r);fs(c,'#fff',2.5);
    if(blink){c.beginPath();c.moveTo(ex-r,ey);c.lineTo(ex+r,ey);c.stroke();}
    else{circ(c,ex+r*0.35,ey+r*0.1,r*0.5);c.fillStyle=INK;c.fill();circ(c,ex+r*0.2,ey-r*0.15,r*0.17);c.fillStyle='#fff';c.fill();}}
  c.lineWidth=2.5;
  if(m.mouth==='smile'){c.beginPath();c.arc(16,3,9,0.25,Math.PI-0.7);c.lineWidth=3;c.strokeStyle=INK;c.stroke();}
  else if(m.mouth==='teeth'){c.beginPath();c.moveTo(6,8);c.quadraticCurveTo(18,22,28,5);c.closePath();fs(c,INK,2);
    for(const x of [11,17,23]){P(c,[x-3,7.5,x,13,x+3,7]);c.fillStyle='#fff';c.fill();}}
  else if(m.mouth==='fangs'){c.beginPath();c.moveTo(2,6);c.quadraticCurveTo(17,24,30,3);c.closePath();fs(c,INK,2);
    P(c,[6,7,9.5,19,13,7]);fs(c,'#fff',2);P(c,[20,6,24,18,27,4.5]);fs(c,'#fff',2);}
  else{c.beginPath();c.moveTo(6,7);c.quadraticCurveTo(18,22,28,5);c.closePath();fs(c,INK,2);
    c.beginPath();c.ellipse(18,17+Math.sin(t*10),5.5,7,0,0,TAU);fs(c,'#ff6f91',2.5);}
  c.restore();
}



/* ---------- Grundlagen ---------- */
var $=function(id){return document.getElementById(id);};

  [[-12,-14,8.6],[12,-14,8.6],[0,-20,10.6]].forEach(function(q){circ(c,q[0],q[1],q[2]);c.fillStyle='#ffffff';c.fill();});
  c.beginPath();c.rect(-14.5,-12,29,15);c.fillStyle='#ffffff';c.fill();c.beginPath();c.moveTo(-16,-8);c.lineTo(-16,6);c.lineTo(16,6);c.lineTo(16,-8);c.lineWidth=2.5;c.strokeStyle=INK;c.stroke();c.restore();}

function makeOrder(st){
  if(st===undefined)st=Math.floor(Math.random()*4);var S=ST[st],n=LVL[amount].n,items=[];
  if(S.k==='burger'){var pool=['fleisch','kaese','salat','tomate','gurke','socke','schleim'];items.push('fleisch');while(items.length<n)items.push(pick(pool));
    if(LVL[amount].seq){items=shuffle(items);return {st:st,items:items,seq:true};}}
  else if(S.k==='pizza'){items.push('sosse');if(n>2||Math.random()<0.5)items.push('kaese');var pp=['pilze','paprika','salami','wuermer','augen'];while(items.length<n+1)items.push(pick(pp));}
  else if(S.k==='eis'){var fl=['erdbeer','schoko','vanille','schleimeis'],k=clamp(n-1,1,3);for(var i=0;i<k;i++)items.push(pick(fl));var ex=['sosse2','streusel','kirsche'];if(n>=3||Math.random()<0.6)items.push(pick(ex));if(n>=4)items.push(pick(ex));}
  else{var col=['rot','blau','gelb'],xt=['frosch','stern','pilz'];items.push(pick(col));if(n>=3)items.push(pick(col));items.push(pick(xt));if(n>=4)items.push(pick(xt));}
  var order=items.slice().sort(function(a,b){return S.ings.indexOf(ingOf(st,a))-S.ings.indexOf(ingOf(st,b));});
  return {st:st,items:order};
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}
function nextGuest(){
  var o1=makeOrder(),orders=[o1];
  if(Math.random()<LVL[amount].combo){var st2=Math.floor(Math.random()*3);if(st2>=o1.st)st2++;orders.push(makeOrder(st2));}
  guest={m:randMonster(),name:pick(GUEST_NAMES),orders:orders,results:[],plates:[],x:-160,state:'enter',t:0,say:'',eat:0,showT:0,peeks:2};
  updButtons();
}
function openOrders(){return guest.orders.filter(function(o,i){return !guest.results[i];});}
function startGame(){
  GUESTS=LVL[amount].guests;maxStars=GUESTS*3;stars=0;served=0;fx=[];texts=[];drops=[];dishes=[newDish(),newDish(),newDish(),newDish()];state='play';

  nextGuest();enterGameScreen();

}
function countMap(a){var m={};a.forEach(function(x){m[x]=(m[x]||0)+1;});return m;}
function rate(o,d){
  var st=1,line;
  if(station!==o.st){st=1;line='Ich wollte doch '+ST[o.st].name+'! 😅 Aber danke!';}
  else{
    var want=countMap(o.items),got=countMap(d.items),miss=0,extra=0,missing=null;
    Object.keys(want).forEach(function(k){var df=want[k]-(got[k]||0);if(df>0){miss+=df;missing=missing||k;}});
    Object.keys(got).forEach(function(k){var df=got[k]-(want[k]||0);if(df>0)extra+=df;});
    var err=miss+extra;var cookNeed=ST[station].cook&&!d.done;
    if(cookNeed)err+=1;
    var wrongOrder=false;if(o.seq&&err===0&&o.items.join()!==d.items.join()){err=1;wrongOrder=true;}
    st=err===0?3:err<=1?2:1;
    if(st===3)line=pick(['Mmmh! Perfekt! 😍','Das beste Essen der Welt!','Genau so wollte ich es! 🤩']);
    else if(wrongOrder)line='Lecker! Aber falsch gestapelt. 🍔';
    else if(cookNeed&&err===1)line=ST[station].cook==='bake'?'Lecker, aber noch nicht gebacken!':'Lecker, aber nicht umgerührt!';
    else if(st===2)line=missing?'Lecker! Nur '+(ingOf(station,missing).emo||'')+' '+ingOf(station,missing).name+' fehlte.':'Lecker! Nur etwas zu viel drauf.';
    else line=pick(['Hmm, ganz anders … aber danke!','Interessant! 😄','Komisch, aber satt bin ich!']);
  }
  return {stars:st,line:line};
}
function serve(){
  if(state!=='play'||!guest||guest.state!=='wait')return;var d=dishes[station];if(!d.items.length||d.anim>0)return;
  var idx=-1;guest.orders.forEach(function(o,i){if(idx<0&&!guest.results[i]&&o.st===station)idx=i;});
  if(idx<0)guest.orders.forEach(function(o,i){if(idx<0&&!guest.results[i])idx=i;});
  var r=rate(guest.orders[idx],d);guest.results[idx]=r;guest.plates.push({st:station,dish:d});dishes[station]=newDish();
  var open=openOrders();
  if(open.length){guest.say='Danke! Und jetzt noch '+ST[open[0].st].name+'! '+ST[open[0].st].emo;guest.sayT=2.2;setStation(open[0].st);sfx('plop');updButtons();return;}
  var sum=0;guest.results.forEach(function(x){sum+=x.stars;});var st=Math.floor(sum/guest.results.length+0.01);
  var worst=guest.results.slice().sort(function(a,b){return a.stars-b.stars;})[0];
  guest.state='eat';guest.t=0;guest.stars=st;guest.say=st===3?pick(['Mmmh! Alles perfekt! 😍','Das beste Essen der Welt!','Genau so wollte ich es! 🤩']):worst.line;
  stars+=st;served++;sfx('chomp');updButtons();
}
$('peek').addEventListener('pointerdown',function(e){e.preventDefault();if(!guest||guest.state!=='wait'||guest.peeks<=0||guest.showT>0)return;guest.peeks--;guest.showT=3;sfx('tick');updButtons();});

}

  else if(id==='gurke'){for(var q=-1;q<=1;q++){c.beginPath();c.ellipse(x+q*w*0.3,y,w*0.15,7,0,0,TAU);fs(c,'#7fbf4f',2);circ(c,x+q*w*0.3,y,3);c.fillStyle='#d7f0b0';c.fill();}}
  else if(id==='socke'){c.beginPath();c.roundRect(x-w/2+2,y-6,w-4,12,6);fs(c,'#ff9fd0',2.5);c.fillStyle='#ffffff';for(var s=0;s<5;s++)c.fillRect(x-w/2+12+s*(w-24)/4,y-6,5,12);

function drawDish(c,st,d,x,y,s,t,full){

  var S=ST[st],items=d.items;
  c.fillStyle='rgba(0,0,0,.15)';c.beginPath();c.ellipse(0,50,120,16,0,0,TAU);c.fill();
  if(S.k==='burger'){
    c.beginPath();c.ellipse(0,52,115,14,0,0,TAU);fs(c,'#ffffff',2.5);
    c.beginPath();c.moveTo(-80,40);c.quadraticCurveTo(-82,22,-60,22);c.lineTo(60,22);c.quadraticCurveTo(82,22,80,40);c.closePath();fs(c,'#e8a25a',2.5);
    var yy=14;items.forEach(function(id,i){drawLayer(c,id,0,yy-(full?0:dropOff(st,i)),150);yy-=18;});

      for(var z=0;z<7;z++){c.beginPath();c.ellipse(-50+z*16,yy-20+Math.abs(z-3)*4,3,1.6,0.3,0,TAU);c.fillStyle='#fff3dc';c.fill();}}
  } else if(S.k==='pizza'){
    var baked=d.done,ba=d.anim>0?1-d.anim/2:0;
    c.beginPath();c.ellipse(0,20,125,52,0,0,TAU);fs(c,baked?'#c8873e':'#f2d49b',3);
    var cnt=countMap(items),sauce=cnt.sosse,cheese=cnt.kaese;
    if(sauce){c.beginPath();c.ellipse(0,18,108,43,0,0,TAU);c.fillStyle=baked?'#b8322a':'#e04a3c';c.fill();}
    if(cheese){for(var ch=0;ch<14;ch++){var a=ch*2.4,r=20+(ch%5)*16;c.beginPath();c.ellipse(Math.cos(a)*r,18+Math.sin(a)*r*0.4,16,7,a,0,TAU);c.fillStyle=baked?'#f5b83a':'#fff1a8';c.fill();}}
    var tops=items.filter(function(id){return id!=='sosse'&&id!=='kaese';});
    tops.forEach(function(id,i){var a=i*2.4+0.6,r=30+(i%3)*28,px=Math.cos(a)*r,py=18+Math.sin(a)*r*0.38-(full?0:dropOff(st,items.indexOf(id)));
      if(id==='salami'){c.beginPath();c.ellipse(px,py,14,7,0,0,TAU);fs(c,'#c0392b',2);circ(c,px-4,py-1,2);c.fillStyle='#ff9f9f';c.fill();}
      else emo(c,ingOf(st,id).emo,px,py,26);});
    if(d.anim>0){c.globalAlpha=0.6*Math.sin(ba*Math.PI);c.beginPath();c.ellipse(0,20,135,60,0,0,TAU);c.fillStyle='#ff9f1c';c.fill();c.globalAlpha=1;emo(c,'🔥',0,-40,40);}
    if(baked){for(var sm=0;sm<3;sm++){var sv=(t*0.6+sm/3)%1;c.beginPath();c.moveTo(-30+sm*30,-20-sv*40);c.quadraticCurveTo(-20+sm*30,-30-sv*40,-30+sm*30,-40-sv*40);c.lineWidth=3;c.strokeStyle='rgba(255,255,255,'+(1-sv)+')';c.stroke();}}
  } else if(S.k==='eis'){
    c.beginPath();c.moveTo(-50,0);c.lineTo(50,0);c.lineTo(30,48);c.lineTo(-30,48);c.closePath();fs(c,'rgba(220,240,255,.9)',3);
    c.beginPath();c.rect(-10,48,20,6);fs(c,'#b8d8f0',2);
    var scoops=items.filter(function(id){return ingOf(st,id).dot;}),ex=items.filter(function(id){return !ingOf(st,id).dot;});
    var sp=[[0,-14],[-26,-30],[26,-30],[0,-52]];
    scoops.forEach(function(id,i){var p=sp[i]||[0,-60-i*10];circ(c,p[0],p[1]-(full?0:dropOff(st,items.indexOf(id))),26);fs(c,ingOf(st,id).dot,2.5);
      circ(c,p[0]-8,p[1]-8,6);c.fillStyle='rgba(255,255,255,.4)';c.fill();});
    var topY=scoops.length?sp[Math.min(scoops.length,4)-1][1]-22:-10;
    ex.forEach(function(id){if(id==='sosse2'){c.beginPath();c.moveTo(-34,topY+16);c.quadraticCurveTo(-10,topY-4,0,topY+12);c.quadraticCurveTo(14,topY+28,34,topY+10);c.lineWidth=7;c.strokeStyle='#5a3418';c.stroke();}
      else if(id==='streusel'){for(var q=0;q<16;q++){c.save();c.translate(-30+rnd(q)*60,topY+rnd(q+9)*40);c.rotate(rnd(q+3)*3);c.fillStyle=['#ff5a4e','#ffe14d','#3fb6ff','#38c172','#ff6fb5'][q%5];c.fillRect(-4,-1.5,8,3);c.restore();}}
      else if(id==='kirsche'){emo(c,'🍒',0,topY-6,30);}});
  } else {
    var mixC=mixColor(items),stirred=d.done,sa=d.anim>0;
    c.beginPath();c.ellipse(-60,48,10,6,0,0,TAU);c.ellipse(60,48,10,6,0,0,TAU);c.fillStyle=INK;c.fill();
    for(var fl=0;fl<5;fl++){var fh=Math.sin(t*12+fl)*5;c.beginPath();c.moveTo(-40+fl*20,58);c.quadraticCurveTo(-46+fl*20,40-fh,-40+fl*20,30-fh);c.quadraticCurveTo(-34+fl*20,40-fh,-40+fl*20,58);c.fillStyle=fl%2?'#ff9f1c':'#ffd23f';c.fill();}
    c.beginPath();c.moveTo(-80,-10);c.quadraticCurveTo(-90,50,0,52);c.quadraticCurveTo(90,50,80,-10);c.closePath();fs(c,'#2b2838',3);
    c.beginPath();c.ellipse(0,-10,80,18,0,0,TAU);fs(c,'#3a3650',3);
    c.beginPath();c.ellipse(0,-8,70,13,0,0,TAU);c.fillStyle=mixC;c.fill();
    if(sa||stirred){c.save();c.beginPath();c.ellipse(0,-8,70,13,0,0,TAU);c.clip();c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=3;c.beginPath();
      for(var sw=0;sw<3;sw++){c.ellipse(0,-8,20+sw*18,4+sw*3,t*(sa?8:1),0,4);}c.stroke();c.restore();}
    for(var bb=0;bb<4;bb++){var bv=(t*0.9+bb/4)%1;circ(c,-40+bb*26,-12-bv*30,4+bv*3);c.strokeStyle='rgba(255,255,255,'+(1-bv)+')';c.lineWidth=2;c.stroke();}
    items.filter(function(id){return !ingOf(st,id).dot;}).forEach(function(id,i){emo(c,ingOf(st,id).emo,-36+i*24,-14+Math.sin(t*3+i)*3-(full?0:dropOff(st,items.indexOf(id))),22);});
    if(stirred){for(var sp2=0;sp2<6;sp2++){var sa2=t*2+sp2;emo(c,'✨',Math.cos(sa2)*70,-30+Math.sin(sa2*1.3)*16,16);}}
  }
  c.restore();
}
function mixColor(items){var cols={rot:[255,59,92],blau:[63,123,255],gelb:[255,210,63]},r=0,gg=0,b=0,n=0;
  items.forEach(function(id){if(cols[id]){r+=cols[id][0];gg+=cols[id][1];b+=cols[id][2];n++;}});
  if(!n)return '#8fb3c9';return 'rgb('+Math.round(r/n)+','+Math.round(gg/n)+','+Math.round(b/n)+')';}
function drawOrder(c,g,x,y,hidden){
  var rows=g.orders,maxN=0;rows.forEach(function(o){maxN=Math.max(maxN,o.items.length);});
  var w=Math.min(W-x-12,Math.max(230,96+maxN*40)),rh=72,h=12+rows.length*rh;
  c.beginPath();c.roundRect(x,y,w,h,18);fs(c,'#ffffff',3);c.beginPath();c.moveTo(x+30,y+h-2);c.lineTo(x+14,y+h+22);c.lineTo(x+56,y+h-2);c.closePath();fs(c,'#ffffff',3);
  c.fillStyle='#ffffff';c.fillRect(x+28,y+h-6,30,8);
  if(hidden){emo(c,'🤔',x+46,y+h/2,40);c.fillStyle=INK;c.font='800 17px "Baloo 2", sans-serif';c.textAlign='left';
    c.fillText('Was wollte ich nochmal?',x+80,y+h/2-4);c.font='700 14px "Baloo 2", sans-serif';c.fillText('Spicken: 👀 unten',x+80,y+h/2+18);return;}
  rows.forEach(function(o,r){var S=ST[o.st],yy=y+6+r*rh,done=g.results[r];
    if(done)c.globalAlpha=0.35;
    emo(c,S.emo,x+40,yy+rh/2,40);
    c.fillStyle=INK;c.font='800 13px "Baloo 2", sans-serif';c.textAlign='left';c.fillText(S.name+(o.seq?' (von unten nach oben):':' mit:'),x+76,yy+18);
    var step=Math.min(40,(w-100)/o.items.length);
    o.items.forEach(function(id,i){var ig=ingOf(o.st,id),cx=x+92+i*step,cy=yy+46;
      if(ig.dot){circ(c,cx,cy,13);fs(c,ig.dot,2.5);}else emo(c,ig.emo,cx,cy,26);
      if(o.seq&&i<o.items.length-1){c.fillStyle='rgba(29,26,43,.4)';c.font='800 12px sans-serif';c.textAlign='center';c.fillText('›',cx+step/2,cy+4);}});
    if(done){c.globalAlpha=1;emo(c,'✅',x+w-24,yy+rh/2,24);}
    c.globalAlpha=1;});
}
function render(t){
  var c=g;
  if(!bgCache){bgCache=document.createElement('canvas');var d=Math.min(DPR_MAX,window.devicePixelRatio||1);bgCache.width=W*d;bgCache.height=H*d;
    var bc=bgCache.getContext('2d');bc.setTransform(d,0,0,d,0,0);drawBackground(bc);}
  c.drawImage(bgCache,0,0,W,H);
  if(guest){
    var gy=210+(guest.state==='eat'?Math.abs(Math.sin(t*14))*-6:0);
    c.save();c.beginPath();c.rect(0,0,W,268);c.clip();drawMonster(c,guest.m,guest.x,gy,1.7,t);c.restore();
    c.font='800 15px "Baloo 2", sans-serif';c.textAlign='center';var nw=c.measureText(guest.name).width+18;c.beginPath();c.roundRect(guest.x-nw/2,276,nw,24,10);fs(c,'#fffaf0',2);c.fillStyle=INK;c.fillText(guest.name,guest.x,293);
    if(guest.state==='wait'){var hid=LVL[amount].hide&&guest.t>LVL[amount].hide&&guest.showT<=0;
      if(guest.sayT>0){c.font='800 17px "Baloo 2", sans-serif';var tw0=c.measureText(guest.say).width+30;c.beginPath();c.roundRect(guest.x+70,56,tw0,40,14);fs(c,'#ffffff',3);c.fillStyle=INK;c.textAlign='left';c.fillText(guest.say,guest.x+85,82);}
      else drawOrder(c,guest,guest.x+70,40,hid);
      if(LVL[amount].hide&&!hid&&guest.t<LVL[amount].hide){var left=Math.ceil(LVL[amount].hide-guest.t);c.font='26px Bungee, "Arial Black", sans-serif';c.textAlign='center';c.lineJoin='round';c.lineWidth=7;c.strokeStyle=INK;c.strokeText('Merken! '+left,guest.x-190,150);c.fillStyle='#ffe14d';c.fillText('Merken! '+left,guest.x-190,150);}
      guest.plates.forEach(function(pl,i){drawDish(c,pl.st,pl.dish,guest.x-160-i*90,262,0.42,t,true);});}
    if(guest.state==='eat'||guest.state==='leave'){
      if(guest.state==='eat'&&guest.t<1.2)guest.plates.forEach(function(pl,i){drawDish(c,pl.st,pl.dish,guest.x+10-i*120,285,0.5,t,true);});
      if(guest.t>0.5&&guest.say){c.font='800 17px "Baloo 2", sans-serif';var tw=c.measureText(guest.say).width+30;c.beginPath();c.roundRect(guest.x+60,60,tw,40,14);fs(c,'#ffffff',3);c.fillStyle=INK;c.textAlign='left';c.fillText(guest.say,guest.x+75,86);
        for(var s=0;s<3;s++)emo(c,s<guest.stars?'⭐':'☆',guest.x+80+s*34,126,s<guest.stars?28:24);}
    }
  }
  drawChef(c,150,430,1.6,t,dishes[station].anim>0&&ST[station].cook==='stir');
  drawDish(c,station,dishes[station],520,440,1,t,false);
  if(!dishes[station].items.length){c.font='800 18px "Baloo 2", sans-serif';c.textAlign='center';c.fillStyle='rgba(29,26,43,.45)';c.fillText('Tipp unten auf die Zutaten!',520,360);}
  c.beginPath();c.roundRect(14,284,150,40,12);fs(c,'rgba(255,250,240,.95)',2.5);
  c.font='18px Bungee, "Arial Black", sans-serif';c.textAlign='left';c.fillStyle=INK;c.fillText('⭐ '+stars,26,311);
  c.textAlign='right';c.font='800 15px "Baloo 2", sans-serif';c.fillText((LVL[amount].hide?'':'')+'Gast '+Math.min(GUESTS,served+(guest&&guest.state==='wait'?1:0))+'/'+GUESTS,154,310);
  fx.forEach(function(f){c.globalAlpha=Math.min(1,f.life/f.max*1.5);emo(c,f.heart?'💖':'⭐',f.x,f.y,20);});c.globalAlpha=1;
  texts.forEach(function(x){c.globalAlpha=Math.min(1,x.life*2);c.font='22px Bungee, "Arial Black", sans-serif';c.textAlign='center';c.lineWidth=6;c.strokeStyle=INK;c.lineJoin='round';c.strokeText(x.text,x.x,x.y);c.fillStyle='#ffffff';c.fillText(x.text,x.x,x.y);});c.globalAlpha=1;
}
function update(dt){
  fx.forEach(function(f){f.life-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=200*dt;});fx=fx.filter(function(f){return f.life>0;});
  texts.forEach(function(x){x.life-=dt;x.y-=24*dt;});texts=texts.filter(function(x){return x.life>0;});
  drops.forEach(function(d){d.t-=dt;});drops=drops.filter(function(d){return d.t>0;});
  dishes.forEach(function(d,i){if(d.anim>0){d.anim-=dt;if(d.anim<=0){d.anim=0;d.done=true;sfx(ST[i].cook==='bake'?'ding':'magic');if(i===station)updButtons();}}});
  if(!guest||state!=='play')return;
  guest.t+=dt;if(guest.showT>0){guest.showT-=dt;if(guest.showT<=0)updButtons();}if(guest.sayT>0)guest.sayT-=dt;
  if(guest.state==='enter'){guest.x+=420*dt;if(guest.x>=560){guest.x=560;guest.state='wait';guest.t=0;setStation(guest.orders[0].st);sfx('bell');updButtons();}}
  else if(guest.state==='eat'&&guest.t>=2.4){guest.state='leave';guest.t=0;finishGuest();}
  else if(guest.state==='leave'){if(guest.t>0.8)guest.x+=420*dt;if(guest.x>W+180){if(served>=GUESTS){guest=null;endDay();}else nextGuest();}}
}

/* ---------- Ton ---------- */
var AC=null,muted=false,NOISE=null;
function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f0,f1,type,dur,vol,delay){
  var n=AC.currentTime+(delay||0),o=AC.createOscillator(),gn=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,n);o.frequency.exponentialRampToValueAtTime(f1,n+dur);
  gn.gain.setValueAtTime(vol,n);gn.gain.exponentialRampToValueAtTime(0.0001,n+dur);
  o.connect(gn);gn.connect(AC.destination);o.start(n);o.stop(n+dur+0.02);}
function noise(dur,vol,freq){
  if(!NOISE){NOISE=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);var d=NOISE.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  var n=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain();
  s.buffer=NOISE;f.type='lowpass';f.frequency.value=freq;gn.gain.setValueAtTime(vol,n);gn.gain.exponentialRampToValueAtTime(0.0001,n+dur);
  s.connect(f);f.connect(gn);gn.connect(AC.destination);s.start(n);s.stop(n+dur);}
function sfx(k){if(!AC||muted)return;
  if(k==='tick')tone(700,700,'square',0.04,0.03);
  else if(k==='plop')tone(500+Math.random()*200,250,'triangle',0.1,0.08);
  else if(k==='nope')tone(220,160,'square',0.15,0.04);
  else if(k==='trash')noise(0.25,0.15,1500);
  else if(k==='oven')noise(1.6,0.06,500);
  else if(k==='stir'){for(var i=0;i<5;i++)tone(300+i*40,200,'sine',0.12,0.05,i*0.22);}
  else if(k==='ding'){tone(1568,1568,'sine',0.5,0.07);tone(2093,2093,'sine',0.5,0.04,0.02);}
  else if(k==='magic'){[784,988,1175,1568].forEach(function(f,i){tone(f,f,'triangle',0.15,0.05,i*0.07);});}
  else if(k==='bell'){tone(1318,1318,'sine',0.35,0.06);tone(1046,1046,'sine',0.4,0.05,0.15);}
  else if(k==='chomp'){[0,0.18,0.36].forEach(function(d){noise(0.08,0.2,2500);tone(200,120,'square',0.06,0.04,d);});}
  else if(k==='yay'){tone(660,660,'triangle',0.12,0.06);tone(880,880,'triangle',0.18,0.06,0.1);}
  else if(k==='yay3'){[523,659,784,1046].forEach(function(f,i){tone(f,f,'triangle',0.16,0.07,i*0.09);});}
  else if(k==='win'){[523,659,784,1046,1318].forEach(function(f,i){tone(f,f,'triangle',0.22,0.07,i*0.12);});}}
$('mute').onclick=function(){muted=!muted;$('mute').textContent=muted?'🔇 Ton aus':'🔊 Ton an';initAudio();};

/* ---------- Schleife ---------- */
showBuilder();
var last=performance.now();
function loop(now){var raw=(now-last)/1000,dt=Math.min(0.033,raw);last=now;var t=now/1000;perfTick(raw);
  if(!$('builder').hidden)drawPreview(t);
  if(!$('game').hidden&&state!=='idle'){update(dt);render(t);}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
