<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="Rutsche">
<title>Fietes Monster-Rutsche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Bungee&display=swap">
<style>
/* Layout: Freibad – Sticker-Karten mit harten Schatten auf Poolblau, die Rutsche ist die Hauptbühne */
:root{
  --gym:#bfe9ff; --dots:rgba(20,90,160,.14); --ink:#1d1a2b; --paper:#fffaf0;
  --grape:#6c3fd1; --go:#38c172; --sky:#3fb6ff; --white:#ffffff; --red:#ff5a4e;
  --p1:#ffe14d; --p2:#7fe3ff;
  --display:'Bungee','Arial Black',Impact,system-ui,sans-serif;
  --body:'Baloo 2','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;min-height:100%}
*{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
html,body{background-color:var(--gym);color:var(--ink);
  background-image:radial-gradient(circle at 2px 2px,var(--dots) 2px,transparent 2.6px);background-size:28px 28px;background-attachment:fixed}
body{font-family:var(--body);font-size:18px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1060px;margin:0 auto;display:grid;gap:20px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,44px);line-height:1;margin:0;text-wrap:balance}
h1 span{color:var(--white);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.steps{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0}
.steps li{font-weight:800;font-size:16px;padding:3px 14px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);opacity:.5}
.steps li.on{opacity:1;background:var(--grape);color:var(--white)}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink)}
.builder{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
@media (max-width:820px){.builder{grid-template-columns:minmax(0,1fr)}}
.preview{padding:16px;display:grid;gap:10px}
@media (min-width:821px){.preview{position:sticky;top:12px}}
#pv{display:block;width:100%;height:auto;border:3px solid var(--ink);border-radius:14px}
label{font-weight:800}
.txt-in{font:inherit;font-weight:800;font-size:20px;padding:5px 14px;border:3px solid var(--ink);border-radius:12px;background:var(--white);color:var(--ink);width:100%;box-sizing:border-box}
.panel{padding:18px 20px;display:grid;gap:16px;min-width:0}
.flat{padding:0}
h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0;text-wrap:balance}
.row{display:grid;gap:6px}
.lab{font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:700;font-size:17px;padding:3px 14px;border:3px solid var(--ink);border-radius:12px;background:var(--white);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.chip.sel{background:var(--grape);color:var(--white)}
.chip.sw{width:42px;height:42px;padding:0;border-radius:50%}
.chip.sw.sel{outline:4px solid var(--grape);outline-offset:3px}
.chip:disabled{opacity:.25;cursor:not-allowed}
:focus-visible{outline:4px solid var(--sky);outline-offset:2px}
.sep{border:0;border-top:3px dashed rgba(29,26,43,.2);margin:4px 0;width:100%}
.btn{font-family:var(--display);font-weight:400;font-size:18px;padding:10px 18px;border:3px solid var(--ink);border-radius:14px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);background:var(--white);color:var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.go{background:var(--go)}
.btn.small{font-size:15px;padding:6px 14px;box-shadow:3px 3px 0 var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
.actions #go{margin-left:auto}
.who{font-family:var(--display);font-size:15px;justify-self:start;padding:2px 12px;border:3px solid var(--ink);border-radius:999px;background:var(--p1)}
.who.p2{background:var(--p2)}
.game{display:grid;gap:12px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.score{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto;align-items:center;gap:12px;padding:6px 16px}
.pname{display:flex;align-items:center;gap:8px;min-width:0;font-weight:800;font-size:18px}
.pname .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#n1{justify-content:flex-end;text-align:right}
.jdot{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink);flex:none}
.hearts{font-size:21px;line-height:1;letter-spacing:0;white-space:nowrap}
.hearts.pop{animation:pop .6s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
.vs{font-family:var(--display);font-size:15px;background:var(--ink);color:var(--p1);padding:3px 10px;border-radius:10px}
@media (max-width:560px){.pname{font-size:14px}.hearts{font-size:18px}.vs{font-size:13px}}
.stage{position:relative;border:3px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:6px 6px 0 var(--ink);background:#8fd16a;justify-self:center;width:100%;box-sizing:border-box}
#cv{display:block;width:100%;height:auto;touch-action:none}
.overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:grid;place-items:center;background:rgba(29,26,43,.55);padding:12px}
.ocard{padding:16px 22px;width:min(440px,100%);box-sizing:border-box;display:grid;gap:10px;text-align:center}
.ocard h2{font-size:26px}
.ocard p{margin:0;font-weight:700}
.ocard .actions{justify-content:center}
@media (max-width:700px){.overlay{position:static;background:none;padding:12px 0 0}}
.keys{margin:0;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;font-weight:700;font-size:16px}
.keys .tag{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:0 10px;border:3px solid var(--ink);border-radius:999px;background:var(--p1);margin-right:6px}
.keys .tag.p2{background:var(--p2)}
kbd{font-family:var(--body);font-weight:800;font-size:14px;padding:0 7px;border:2px solid var(--ink);border-bottom-width:4px;border-radius:6px;background:var(--white)}
.touch{display:none;justify-content:space-between;align-items:center;gap:12px}
html.is-touch .touch{display:flex}
html.is-touch .keys{display:none}
.tpad{display:flex;align-items:center;gap:14px}
.tpad.r{flex-direction:row-reverse}
.mid{flex:1;min-width:0;display:grid;gap:8px;justify-items:center;align-content:center}
.joy{width:124px;height:124px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);position:relative;touch-action:none;flex:none}
.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-30px 0 0 -30px;border-radius:50%;background:var(--p1);border:3px solid var(--ink);pointer-events:none}
#joy1 .knob{background:var(--p2)}
.tbtns{display:flex;flex-direction:column;gap:10px}
.tb{touch-action:none;min-width:116px;min-height:56px;font-size:18px;padding:8px 14px}
.tb.throw{background:var(--red);color:var(--white)}
.tb.jump{background:var(--sky)}
.tbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tbar .btn.small{font-size:13px;padding:5px 10px}
.foot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
body.playing{padding-block:8px 4px}
body.playing .top{display:none}
@media (prefers-reduced-motion:reduce){.hearts.pop{animation:none}}
.stat{font-weight:800;font-size:18px;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat b{font-family:var(--display);font-weight:400;font-size:22px}
.recs{padding:1px 10px;border:3px solid var(--ink);border-radius:999px;background:var(--white)}
.recs.beat{background:var(--p1);animation:pop .6s}
@media (max-width:560px){.stat{font-size:14px}.stat b{font-size:16px}}
.rec{margin:0;font-weight:800}
.tb.steer{min-width:118px;min-height:100px;font-size:20px;background:var(--p1)}
.tb.big{min-width:150px;min-height:110px;font-size:22px}
.hint{margin:0;text-align:center;font-weight:800;font-size:15px;opacity:.75}
.ocard .big{font-family:var(--display);font-weight:400;font-size:20px}
#cv{cursor:ew-resize}
.hall{font-family:var(--display);font-size:14px;padding:4px 12px;border:3px solid var(--ink);border-radius:12px;background:var(--white);color:var(--ink);text-decoration:none;box-shadow:3px 3px 0 var(--ink)}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Fietes <span>Monster-Rutsche</span></h1>
    <a class="hall" href="index.html">← Spielehalle</a>
    <ol class="steps" id="steps"><li class="on">1 Monster</li><li>2 Rutschen</li></ol>
  </header>

  <section id="builder" class="builder">
    <div class="card preview">
      <canvas id="pv" width="440" height="300" aria-label="Vorschau von deinem Monster"></canvas>
      <label for="name">Wie heißt dein Monster?</label>
      <input id="name" class="txt-in" maxlength="14" autocomplete="off">
      <p class="rec" id="recbox"></p>
    </div>
    <div class="card panel">
      <div id="modebox" class="panel flat">
        <div class="row">
          <div class="lab">Wer rutscht?</div>
          <div class="chips"><button type="button" id="m1" class="chip sel">Allein</button><button type="button" id="m2" class="chip">Zu zweit, abwechselnd</button></div>
        </div>
        <div class="row">
          <div class="lab">Welche Rutsche?</div>
          <div class="chips" id="slrow"></div>
        </div>
        <hr class="sep">
      </div>
      <span id="who" class="who" hidden>Spieler 1</span>
      <h2>Bau dein Monster!</h2>
      <div id="rows" class="panel flat" style="gap:14px"></div>
      <hr class="sep">
      <div class="row">
        <div class="lab">Badehose</div>
        <div class="chips" id="jrow"></div>
      </div>
      <div class="row">
        <div class="lab">Schwimmreifen</div>
        <div class="chips" id="rrow"></div>
      </div>
      <div class="actions">
        <button id="back1" class="btn" hidden>← Spieler 1</button>
        <button id="rand" class="btn small">🎲 Zufalls-Monster</button>
        <button id="go" class="btn go">Los rutschen!</button>
      </div>
    </div>
  </section>

  <section id="game" class="game" hidden>
    <div class="card score">
      <div class="pname"><span class="jdot" id="j0"></span><span class="tx" id="t0"></span></div>
      <span class="hearts" id="h0"></span>
      <span class="stat">📏 <b id="meters">0</b> m</span>
      <span class="stat">⭐ <b id="stars">0</b></span>
      <span class="stat recs">🏆 <b id="rec">0</b></span>
    </div>
    <div class="stage">
      <canvas id="cv" width="1000" height="560" aria-label="Wasserrutsche"></canvas>
      <div id="overlay" class="overlay" hidden></div>
    </div>
    <div class="touch" id="touch">
      <div class="tpad"><button id="left" class="btn tb steer">◀ Links</button><button id="right" class="btn tb steer">Rechts ▶</button></div>
      <div class="mid" id="tmid"><p class="hint">Oder mit dem Finger auf der Rutsche wischen!</p></div>
      <div class="tpad"><button id="jmp" class="btn tb jump big">Springen</button></div>
    </div>
    <p class="keys"><span>Lenken <kbd>←</kbd><kbd>→</kbd> oder <kbd>A</kbd><kbd>D</kbd></span><span>Springen <kbd>Leertaste</kbd> oder <kbd>↑</kbd></span></p>
    <div class="foot">
      <button id="quit" class="btn small">← Zum Monster</button>
      <button id="pause" class="btn small">⏸ Pause</button>
      <button id="mute" class="btn small">🔊 Ton an</button>
    </div>
  </section>
</div>

<script>
/* ===== iPad-Grundlagen (Zielgerät: iPad Air 2, iOS 15, Safari) =====
   - Touch erkennen, Bildschirm einpassen, kein Scrollen/Zoomen im Spiel
   - Ton unter iOS freischalten (braucht ein echtes Antippen)
   - Bildqualität automatisch senken, wenn das Gerät zu langsam ist */
var DPR_MAX=2;
var IS_TOUCH=('ontouchstart' in window)||(navigator.maxTouchPoints||0)>0;
if(IS_TOUCH)document.documentElement.classList.add('is-touch');
function gameOn(){var g=document.getElementById('game');return !!g&&!g.hidden;}
function fitStage(){
  var game=document.getElementById('game'),stage=document.querySelector('.stage'),c=document.getElementById('cv');
  if(!game||game.hidden||!stage||!c)return;
  stage.style.maxWidth='';
  var other=game.getBoundingClientRect().height-stage.getBoundingClientRect().height;
  var avail=window.innerHeight-other-22;
  stage.style.maxWidth=Math.max(300,Math.floor(avail*c.width/c.height))+'px';
}
function enterGameScreen(){document.body.classList.add('playing');window.scrollTo(0,0);fitStage();requestAnimationFrame(fitStage);setTimeout(fitStage,400);}
function leaveGameScreen(){document.body.classList.remove('playing');var s=document.querySelector('.stage');if(s)s.style.maxWidth='';window.scrollTo(0,0);}
window.addEventListener('resize',fitStage);
window.addEventListener('orientationchange',function(){setTimeout(fitStage,400);});
var audioUnlocked=false;
function unlockAudio(){
  if(typeof initAudio!=='function')return;
  initAudio();
  if(audioUnlocked||!AC)return;
  try{var b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0);audioUnlocked=true;}catch(e){}
}
document.addEventListener('touchend',unlockAudio,true);
document.addEventListener('click',unlockAudio,true);
document.addEventListener('touchmove',function(e){
  if(gameOn()&&!(e.target&&e.target.closest&&e.target.closest('.ocard,.rcard')))e.preventDefault();
},{passive:false});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
var perfN=0,perfSum=0,lowQ=false;
function perfTick(raw){
  if(lowQ||!gameOn()||document.hidden||raw>0.25)return;
  perfN++;perfSum+=raw;
  if(perfN>=90){
    if(perfSum/perfN>0.026){lowQ=true;DPR_MAX=1;if(typeof onLowQuality==='function')onLowQuality();}
    perfN=0;perfSum=0;
  }
}
function compactControls(){
  if(!IS_TOUCH)return;
  var mid=document.getElementById('tmid'),foot=document.querySelector('.foot');if(!mid||!foot)return;
  var bar=document.createElement('div');bar.className='tbar';
  while(foot.firstElementChild)bar.appendChild(foot.firstElementChild);
  mid.appendChild(bar);foot.hidden=true;
}
compactControls();
/* ===== Ende iPad-Grundlagen ===== */


/* Kompatibilität: ältere Safari-Versionen (iPadOS < 16) kennen roundRect nicht */
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.max(0,Math.min(typeof r==='number'?r:(r&&r[0])||0,Math.abs(w)/2,Math.abs(h)/2));
    this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};
}
/* Fehler sichtbar machen, falls doch etwas schiefgeht (hilft auf dem iPad ohne Entwicklerwerkzeuge) */
window.addEventListener('error',function(e){
  var b=document.getElementById('errbox');
  if(!b){b=document.createElement('div');b.id='errbox';
    b.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#fffaf0;color:#1d1a2b;border:3px solid #1d1a2b;border-radius:14px;padding:10px 14px;font:600 15px/1.35 system-ui,sans-serif;box-shadow:4px 4px 0 #1d1a2b';
    document.body.appendChild(b);}
  b.textContent='Ups, da ist etwas kaputtgegangen. Bitte diesen Text an Claude schicken: '+e.message+' (Zeile '+e.lineno+')';
});

const INK='#1d1a2b', TAU=Math.PI*2;
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shade(hex,a){let n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  const f=v=>Math.round(a<0?v*(1+a):v+(255-v)*a);return `rgb(${f(r)},${f(g)},${f(b)})`;}
function P(c,p){c.beginPath();c.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);c.closePath();}
function fs(c,fill,lw=3){c.fillStyle=fill;c.fill();c.lineWidth=lw;c.strokeStyle=INK;c.stroke();}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,TAU);}
function setup(cv,w,h){const d=Math.min(DPR_MAX,window.devicePixelRatio||1);cv.width=w*d;cv.height=h*d;const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);return x;}

/* ---------- Monster ---------- */
const COLORS=['#38c172','#ff5a4e','#3fb6ff','#a66bff','#ff9f1c','#ff6fb5','#2ec4b6','#8d6e63'];
const OPTS={
  color:COLORS.map(v=>({v})),
  eyes:[{v:1,l:'1'},{v:2,l:'2'},{v:3,l:'3'},{v:5,l:'5'}],
  horns:[{v:'none',l:'Keine'},{v:'small',l:'Kleine'},{v:'big',l:'Riesig'},{v:'antenna',l:'Antennen'}],
  mouth:[{v:'smile',l:'Lächeln'},{v:'teeth',l:'Zähne'},{v:'fangs',l:'Riesenzähne'},{v:'tongue',l:'Zunge raus'}],
  arms:[{v:2,l:'2 Arme'},{v:4,l:'4 Arme'}],
  tail:[{v:'none',l:'Keiner'},{v:'tail',l:'Puschel'},{v:'spiky',l:'Stachel'}],
  wings:[{v:false,l:'Keine'},{v:true,l:'Flügel'}],
  pattern:[{v:'none',l:'Keins'},{v:'spots',l:'Punkte'},{v:'stripes',l:'Streifen'}],
};
const ROWS=[['color','Farbe'],['eyes','Augen'],['horns','Hörner'],['mouth','Mund'],['arms','Arme'],['tail','Schwanz'],['wings','Flügel'],['pattern','Muster']];
function randMonster(except){const m={};for(const k in OPTS)m[k]=pick(OPTS[k]).v;
  if(except){m.color=pick(COLORS.filter(c=>!except.includes(c)));}return m;}

function arm(c,x1,y1,x2,y2,col){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.lineWidth=10;c.strokeStyle=INK;c.stroke();
  c.lineWidth=5;c.strokeStyle=col;c.stroke();circ(c,x2,y2,4.5);fs(c,col,2.5);}
const EYES={1:[[10,-8,11]],2:[[2,-10,8],[18,-8,7]],3:[[-6,-12,7],[10,-15,7.5],[22,-3,6]],5:[[-10,-12,5.5],[1,-19,6],[13,-13,6.5],[23,-3,5],[5,-2,4.5]]};

function drawMonster(c,m,x,y,s,t){
  const col=m.color,dk=shade(col,-0.3),lt=shade(col,0.4);
  c.save();c.translate(x,y+Math.sin(t*7)*1.2);c.scale(s,s);c.lineJoin='round';c.lineCap='round';
  if(m.wings){const f=Math.sin(t*16)*0.4;c.save();c.translate(-8,-14);c.rotate(-0.5+f);
    c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(-20,-36,-46,-28);c.quadraticCurveTo(-34,-16,-40,-4);c.quadraticCurveTo(-22,-8,0,0);c.closePath();
    fs(c,'rgba(255,255,255,.9)',2.5);c.restore();}
  if(m.tail!=='none'){const w=Math.sin(t*6)*5;c.beginPath();c.moveTo(-22,12);c.quadraticCurveTo(-46,18+w,-50,-4+w);
    c.lineWidth=11;c.strokeStyle=INK;c.stroke();c.lineWidth=5;c.strokeStyle=col;c.stroke();
    if(m.tail==='spiky'){P(c,[-57,-2+w,-50,-18+w,-43,-2+w]);fs(c,'#fff1c9',2.5);}
    else{circ(c,-50,-5+w,7);fs(c,dk,2.5);}}
  if(m.arms===4)arm(c,-10,4,-28,-20+Math.sin(t*9)*7,col);
  const body=()=>{c.beginPath();c.ellipse(0,0,30,28,0,0,TAU);};
  body();c.fillStyle=col;c.fill();
  c.save();body();c.clip();
  c.fillStyle=lt;c.beginPath();c.ellipse(12,16,18,14,0,0,TAU);c.fill();
  c.fillStyle=dk;
  if(m.pattern==='spots')[[-15,-9,6],[-19,9,4],[-4,-21,3.5],[-8,14,3]].forEach(([a,b,r])=>{circ(c,a,b,r);c.fill();});

var W=1000,H=560,F=300,ZP=1.15,ZMAX=26,STEP=0.5,MR=0.9;
var cv=$('cv'),g=setup(cv,W,H);
function onLowQuality(){g=setup(cv,W,H);}
var state='idle',stateT=0,paused=false,banner=null,fx=[],objs=[],sCam=0,speed=0,nextSpawn=0,nextLoop=0,turn=0,results=[],me=null,roll=0,loopFx=0;
function cX(s){var a=Math.min(1,0.35+s/500)*slide.curve;return a*(4.2*Math.sin(s/9)+2.2*Math.sin(s/4.1+1.3));}
function cXdd(s){var a=Math.min(1,0.35+s/500)*slide.curve;return a*(-4.2/81*Math.sin(s/9)-2.2/16.81*Math.sin(s/4.1+1.3));}
function cY(s){return 1.2*Math.sin(s/13+0.5);}
function slope(f,s){return (f(s+0.05)-f(s-0.05))/0.1;}
function proj(s,th,r){
  var z=s-sCam;if(z<0.25)z=0.25;
  var ox=cX(s)-cX(sCam)-slope(cX,sCam)*z,oy=cY(s)-cY(sCam)-slope(cY,sCam)*z;
  var x=Math.sin(th)*r+ox,y=Math.cos(th)*r+oy-0.25;
  return {x:W/2+x*F/z,y:H/2-20+y*F/z,k:F/z,z:z};
}
function startGame(){results=[];turn=0;startRun();}
function startRun(){
  var Pl=PLAYERS[mode===2?turn:0];
  me={P:Pl,th:0,thv:0,h:0,hv:0,lives:3,inv:0,dizzy:0,boost:0,stars:0,loops:0,inLoop:null};
  sCam=0;speed=0;objs=[];fx=[];nextSpawn=14;nextLoop=55;banner=null;paused=false;roll=0;state='ready';stateT=2.2;
  $('t0').textContent=Pl.name;$('j0').style.background=Pl.ring;
  updHud(true);
  $('overlay').hidden=true;$('pause').textContent='⏸ Pause';

  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  enterGameScreen();

function pS(){return sCam+ZP;}
function meters(){return Math.floor(sCam*1.5);}
function baseSpeed(){var s0=slide.fast?9.5:7.5,mx=slide.fast?17:14.5;return Math.min(mx,s0+sCam*0.012);}
function points(){return meters()+me.stars*10+me.loops*50;}

/* Hindernisse, Sterne und Loopings erzeugen */
function spawn(){
  var s=nextSpawn,m=s*1.5,r;
  if(s>=nextLoop){var L=16;objs.push({k:'loop',s:s,L:L});
    for(var i=0;i<6;i++)objs.push({k:'star',s:s+3+i*2,th:0});
    nextLoop=s+L+(slide.id==='kurven'?90:120)+Math.random()*60;nextSpawn=s+L+6;return;}
  var pDuck=Math.min(0.55,0.3+m/2500);r=Math.random();
  if(r<pDuck){var two=m>250&&Math.random()<0.45,ths=two?(Math.random()<0.5?[-0.55,0.2]:[-0.2,0.55]):[(Math.random()*2-1)*0.6];
    ths.forEach(function(t){objs.push({k:Math.random()<0.7?'duck':'ball',s:s+Math.random()*0.6,th:t});});
    if(Math.random()<0.6){var free=two?(ths[0]<-0.3?1.0:-1.0):(ths[0]>0?-0.9:0.9);objs.push({k:'star',s:s,th:free});}
  } else if(r<pDuck+0.1){objs.push({k:'boost',s:s,th:(Math.random()*2-1)*0.4});}
  else if(r<pDuck+0.2){for(var j=0;j<4;j++)objs.push({k:'star',s:s+j*1.2,th:0,air:true});objs.push({k:'jumpsign',s:s-2.5,th:0});}
  else{var t0=(Math.random()*2-1)*0.5,dir=Math.random()<0.5?-1:1;
    for(j=0;j<5;j++)objs.push({k:'star',s:s+j*1.1,th:clamp(t0+dir*j*0.22,-1.3,1.3)});}
  nextSpawn=s+clamp(9-m/200,5.5,9)+Math.random()*3;
}

/* ---------- Steuerung ---------- */
var keys={},jumpReq=0,drag=null,btn={l:0,r:0};
addEventListener('keydown',function(e){
  if($('game').hidden||(e.target&&e.target.tagName==='INPUT'))return;
  if(e.code==='Escape'||e.code==='KeyP'){e.preventDefault();togglePause();return;}
  if(['ArrowLeft','ArrowRight','KeyA','KeyD','Space','ArrowUp','KeyW','Enter'].indexOf(e.code)<0)return;
  e.preventDefault();keys[e.code]=1;if(!e.repeat&&(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyW'))jumpReq=1;});
addEventListener('keyup',function(e){delete keys[e.code];});
addEventListener('blur',function(){keys={};btn.l=btn.r=0;drag=null;});
function hold(id,k){var el=$(id),pid=null;
  el.addEventListener('pointerdown',function(e){e.preventDefault();pid=e.pointerId;try{el.setPointerCapture(pid);}catch(err){}btn[k]=1;initAudio();});
  function end(e){if(e.pointerId!==pid)return;pid=null;btn[k]=0;}
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);}
hold('left','l');hold('right','r');
$('jmp').addEventListener('pointerdown',function(e){e.preventDefault();jumpReq=1;initAudio();});
function canvasX(e){var r=cv.getBoundingClientRect();return (e.clientX-r.left)/r.width*W;}
cv.addEventListener('pointerdown',function(e){e.preventDefault();drag={id:e.pointerId,x0:canvasX(e),x:canvasX(e)};try{cv.setPointerCapture(e.pointerId);}catch(err){}initAudio();});
cv.addEventListener('pointermove',function(e){if(drag&&drag.id===e.pointerId)drag.x=canvasX(e);});
function dragEnd(e){if(drag&&drag.id===e.pointerId){if(Math.abs(drag.x-drag.x0)<8)jumpReq=1;drag=null;}}
cv.addEventListener('pointerup',dragEnd);cv.addEventListener('pointercancel',dragEnd);
function inputSteer(){
  var s=0;if(keys.ArrowLeft||keys.KeyA||btn.l)s-=1;if(keys.ArrowRight||keys.KeyD||btn.r)s+=1;
  if(!s&&drag)s=clamp((drag.x-drag.x0)/70,-1,1);return s;}

/* ---------- Spielablauf ---------- */
function update(dt){
  if(state==='idle'||state==='over'||paused)return;
  updFx(dt);if(banner){banner.t-=dt;if(banner.t<=0)banner=null;}
  if(state==='ready'){stateT-=dt;jumpReq=0;if(stateT<=0){state='play';sfx('go');}return;}
  if(state==='end'){stateT-=dt;speed*=Math.pow(0.3,dt);sCam+=speed*dt;if(stateT<=0)endRun();return;}
  var p=me,ps=pS();
  p.inv-=dt;p.dizzy-=dt;p.boost-=dt;
  var target=baseSpeed()*(p.boost>0?1.45:1)*(p.dizzy>0?0.6:1);
  speed+=(target-speed)*Math.min(1,dt*(speed<target?1.4:3));
  sCam+=speed*dt;ps=pS();
  while(nextSpawn<sCam+ZMAX+4)spawn();
  objs=objs.filter(function(o){return o.s+(o.L||0)>sCam-1;});
  // Looping
  p.inLoop=null;objs.forEach(function(o){if(o.k==='loop'&&ps>=o.s&&ps<=o.s+o.L)p.inLoop=o;});
  if(p.inLoop){var o=p.inLoop;if(!o.started){o.started=true;showBanner('LOOPING!','',1.6);sfx('loop');}
    o.prog=(ps-o.s)/o.L;}
  objs.forEach(function(o){if(o.k==='loop'&&o.started&&!o.done&&ps>o.s+o.L){o.done=true;p.loops++;sfx('star');pop(W/2,H/2-120,'+50 Looping!','#ffe14d');updHud();}});
  // Lenken an der Röhrenwand
  var st=inputSteer(),v=speed;
  if(jumpReq&&p.h<=0.01){p.hv=2.8;sfx('jump');}
  jumpReq=0;
  var thdd=-4.2*Math.sin(p.th)-0.42*cXdd(ps)*v*v*(p.inLoop?0:1)+st*9.5-2.6*p.thv;
  p.thv+=thdd*dt;p.th+=p.thv*dt;
  if(p.th>1.9){p.th=1.9;p.thv=Math.min(0,p.thv);}if(p.th<-1.9){p.th=-1.9;p.thv=Math.max(0,p.thv);}
  if(p.h>0||p.hv>0){p.hv-=7.5*dt;p.h+=p.hv*dt;if(p.h<=0){p.h=0;p.hv=0;sfx('land');splash(14);}}
  if(Math.random()<dt*v*0.6)splash(1);
  objs.forEach(function(o){
    if(o.done||o.k==='loop'||o.k==='jumpsign')return;
    if(o.s>ps+0.25||o.s<ps-0.6)return;
    var d=Math.abs(o.th-p.th);
    if(o.k==='star'){if(o.air&&p.h<0.22)return;if(d<0.4){o.done=true;p.stars++;sfx('star');pop(W/2,H/2+40,'+10','#ffe14d');updHud();}return;}
    if(o.k==='boost'){if(p.h>0.2||d>0.45)return;o.done=true;p.boost=2.2;sfx('boost');pop(W/2,H/2+40,'Turbo!','#7fffb0');return;}
    if(o.checked)return;
    if(o.s>ps)return;o.checked=true;
    if(p.h>0.28||p.inv>0||d>0.42)return;
    o.done=true;p.lives--;p.inv=1.6;p.dizzy=0.8;speed*=0.6;
    sfx(o.k==='duck'?'quack':'boing');pop(W/2,H/2+20,o.k==='duck'?'Quak!':'Boing!','#ffffff');updHud(false,true);
    if(p.lives<=0){state='end';stateT=2.4;showBanner('PLATSCH!',meters()+' Meter gerutscht',2.4);sfx('splash');splash(40);}
  });
  var tr=p.th*0.85+(p.inLoop?p.inLoop.prog*TAU:0);
  roll=tr;
  if(meters()!==shownM)updHud();
}
function splash(n){for(var i=0;i<n;i++){if(fx.length>140)return;var a=-Math.PI/2+(Math.random()-0.5)*2.4,v2=80+Math.random()*200;
  fx.push({k:'d',x:W/2+(Math.random()-0.5)*90,y:H-90,vx:Math.cos(a)*v2,vy:Math.sin(a)*v2,life:0.5,max:0.5});}}
var shownM=-1;
function updHud(reset,hit){
  if(!me)return;var s='';for(var k=0;k<3;k++)s+=k<me.lives?'❤️':'🤍';$('h0').textContent=s;
  if(hit){var el=$('h0');el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
  shownM=meters();$('meters').textContent=shownM;$('stars').textContent=me.stars;
  var r=RECORD[slide.id].pts;$('rec').textContent=Math.max(r,points());
  $('rec').parentNode.classList.toggle('beat',r>0&&points()>r);
}
function endRun(){
  var pts=points(),r=RECORD[slide.id],isRec=pts>r.pts;
  results.push({P:me.P,pts:pts,m:meters(),stars:me.stars,loops:me.loops,rec:isRec});
  if(isRec){r.pts=pts;r.name=me.P.name;}
  state='over';
  var res=results[results.length-1];
  var card=document.createElement('div');card.className='card ocard';
  var h=document.createElement('h2');h.textContent=isRec?'🏆 NEUER REKORD! 🏆':'PLATSCH! 💦';card.appendChild(h);
  var p1=document.createElement('p');p1.className='big';p1.textContent=res.P.name+': '+pts+' Punkte';card.appendChild(p1);
  var p2=document.createElement('p');p2.textContent=res.m+' Meter + '+res.stars+' Sterne × 10'+(res.loops?' + '+res.loops+' Looping'+(res.loops>1?'s':'')+' × 50':'');card.appendChild(p2);
  if(!isRec&&r.pts){var p3=document.createElement('p');p3.textContent='Rekord: '+r.pts+' Punkte von '+r.name+'. Noch '+(r.pts-pts+1)+' Punkte bis zum Rekord!';card.appendChild(p3);}
  var ac=document.createElement('div');ac.className='actions';
  if(mode===2&&turn===0){
    var p4=document.createElement('p');p4.textContent='Jetzt ist '+PLAYERS[1].name+' dran!';card.appendChild(p4);
    var bn=document.createElement('button');bn.className='btn go';bn.textContent=PLAYERS[1].name+' rutscht! →';bn.onclick=function(){turn=1;startRun();};ac.appendChild(bn);
  } else {
    if(mode===2){var a=results[0],b=results[1],w=a.pts===b.pts?null:(a.pts>b.pts?a:b);
      var p5=document.createElement('p');p5.className='big';p5.textContent=w?(w.P.name+' gewinnt! 🥇'):'Unentschieden!';card.insertBefore(p5,p1);
      p1.textContent=a.P.name+': '+a.pts+'  ·  '+b.P.name+': '+b.pts;p2.textContent='';}
    var b1=document.createElement('button');b1.className='btn';b1.textContent='Monster ändern';b1.onclick=function(){$('quit').click();};
    var b2=document.createElement('button');b2.className='btn go';b2.textContent='Nochmal rutschen!';b2.onclick=function(){startGame();};
    ac.appendChild(b1);ac.appendChild(b2);
  }
  card.appendChild(ac);showOverlay(card);
  if(isRec){sfx('cheer');for(var i=0;i<70;i++){var an=Math.random()*TAU,v=120+Math.random()*280;fx.push({k:'c',x:W/2,y:200,vx:Math.cos(an)*v,vy:Math.sin(an)*v-140,life:1.8,max:1.8,col:pick(['#ffe14d','#ff5a4e','#3fb6ff','#38c172','#ff6fb5']),r:Math.random()*TAU});}}
}
function showOverlay(node){var o=$('overlay');o.innerHTML='';o.appendChild(node);o.hidden=false;}
function togglePause(){
  if(state==='over'||state==='idle')return;
  paused=!paused;$('pause').textContent=paused?'▶ Weiter':'⏸ Pause';
  if(paused){var card=document.createElement('div');card.className='card ocard';
    var h=document.createElement('h2');h.textContent='Pause ⏸';card.appendChild(h);
    var ac=document.createElement('div');ac.className='actions';
    var b1=document.createElement('button');b1.className='btn';b1.textContent='Aufhören';b1.onclick=function(){$('quit').click();};
    var b2=document.createElement('button');b2.className='btn go';b2.textContent='Weiter rutschen';b2.onclick=togglePause;
    ac.appendChild(b1);ac.appendChild(b2);card.appendChild(ac);showOverlay(card);}
  else{$('overlay').hidden=true;keys={};}
}
$('pause').onclick=function(){togglePause();};
$('quit').onclick=function(){state='idle';paused=false;$('game').hidden=true;$('overlay').hidden=true;$('builder').hidden=false;leaveGameScreen();cur=0;showBuilder();};
function showBanner(a,b,t){banner={a:a,b:b,t:t,max:t};}
function pop(x,y,text,col){fx.push({k:'t',x:x,y:y,text:text,col:col,life:1,max:1});}
function updFx(dt){fx.forEach(function(f){f.life-=dt;if(f.k==='c'||f.k==='d'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=(f.k==='d'?700:320)*dt;if(f.r!==undefined)f.r+=dt*8;}else f.y-=40*dt;});
  fx=fx.filter(function(f){return f.life>0;});}

/* ---------- Monster von hinten ---------- */
function drawBack(c,Pl,x,y,s,t,o){
  o=o||{};var m=Pl.m,col=m.color,dk=shade(col,-0.3);
  c.save();c.translate(x,y);c.scale(s,s);c.rotate(o.rot||0);c.lineJoin='round';c.lineCap='round';
  if(o.flash&&Math.floor(o.flash*14)%2===0)c.globalAlpha=0.4;
  c.fillStyle='rgba(0,40,90,.25)';c.beginPath();c.ellipse(0,14+(o.h||0),58,16,0,0,TAU);c.fill();
  c.translate(0,-(o.h||0));
  // hintere Reifenhälfte
  c.beginPath();c.ellipse(0,6,56,20,0,Math.PI,TAU);c.lineWidth=19;c.strokeStyle=INK;c.stroke();c.lineWidth=14;c.strokeStyle=Pl.ring;c.stroke();
  var wave=Math.sin(t*8)*8;
  if(m.wings){[-1,1].forEach(function(sd){c.save();c.translate(sd*12,-40);c.scale(sd,1);c.rotate(-0.3+Math.sin(t*16)*0.3);
    c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(20,-34,46,-28);c.quadraticCurveTo(34,-16,40,-4);c.quadraticCurveTo(22,-8,0,0);c.closePath();fs(c,'rgba(255,255,255,.9)',2.5);c.restore();});}
  if(m.arms===4){arm(c,-24,-14,-50,-24+wave*0.5,col);arm(c,24,-14,50,-24-wave*0.5,col);}
  arm(c,-22,-36,-40,-66+wave,col);arm(c,22,-36,40,-66-wave,col);
  var body=function(){c.beginPath();c.ellipse(0,-28,31,30,0,0,TAU);};
  body();c.fillStyle=col;c.fill();
  c.save();body();c.clip();c.fillStyle=dk;
  if(m.pattern==='spots')[[-14,-40,6],[12,-46,5],[16,-22,6],[-10,-16,4],[2,-34,3.5]].forEach(function(q){circ(c,q[0],q[1],q[2]);c.fill();});
  if(m.pattern==='stripes')for(var i=-30;i<34;i+=13){c.fillRect(i,-60,5,64);}
  c.fillStyle='rgba(0,0,0,.12)';c.beginPath();c.ellipse(0,-6,30,12,0,0,TAU);c.fill();
  c.restore();
  body();c.lineWidth=3;c.strokeStyle=INK;c.stroke();
  var hc='#fff1c9';
  if(m.horns==='small'){P(c,[-16,-50,-12,-68,-5,-55]);fs(c,hc,2.5);P(c,[16,-50,12,-68,5,-55]);fs(c,hc,2.5);}
  if(m.horns==='big'){[-1,1].forEach(function(sd){c.beginPath();c.moveTo(sd*12,-54);c.quadraticCurveTo(sd*30,-84,sd*10,-94);c.quadraticCurveTo(sd*18,-78,sd*2,-58);c.closePath();fs(c,hc,2.5);});}
  if(m.horns==='antenna'){[-1,1].forEach(function(sd){var w=Math.sin(t*5+sd)*3;c.beginPath();c.moveTo(sd*7,-57);c.lineTo(sd*13+w,-80);c.lineWidth=3;c.strokeStyle=INK;c.stroke();circ(c,sd*13+w,-80,5);fs(c,'#ffe14d',2.5);});}
  c.beginPath();c.roundRect(-24,-6,48,14,6);fs(c,Pl.shorts,2.5);
  if(m.tail!=='none'){var tw=Math.sin(t*6)*4;c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(tw,22,tw*1.6,40);c.lineWidth=11;c.strokeStyle=INK;c.stroke();c.lineWidth=5;c.strokeStyle=col;c.stroke();
    if(m.tail==='spiky'){P(c,[tw*1.6-7,38,tw*1.6,52,tw*1.6+7,38]);fs(c,'#fff1c9',2.5);}else{circ(c,tw*1.6,42,7);fs(c,dk,2.5);}}
  // vordere Reifenhälfte
  c.beginPath();c.ellipse(0,6,56,20,0,0,Math.PI);c.lineWidth=19;c.strokeStyle=INK;c.stroke();c.lineWidth=14;c.strokeStyle=Pl.ring;c.stroke();
  c.strokeStyle='#ffffff';c.lineWidth=5;c.beginPath();c.ellipse(0,6,56,20,0,1.2,1.6);c.stroke();c.beginPath();c.ellipse(0,6,56,20,0,2.2,2.5);c.stroke();
  if(o.dizzy>0){for(var q=0;q<3;q++){var a=t*5+q*TAU/3;star(c,Math.cos(a)*26,-98+Math.sin(a)*6,6,'#ffe14d');}}
  c.restore();
}

/* ---------- Zeichnen ---------- */
function mix(a,b,f){var A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);
  var r=Math.round((A>>16)*(1-f)+(B>>16)*f),gg=Math.round(((A>>8)&255)*(1-f)+((B>>8)&255)*f),bb=Math.round((A&255)*(1-f)+(B&255)*f);return 'rgb('+r+','+gg+','+bb+')';}
var FOG='#fff6d6';
function drawGame(t){
  var c=g;
  c.save();c.translate(W/2,H/2);c.rotate(roll);c.translate(-W/2,-H/2);
  c.fillStyle=slide.wall;c.fillRect(-300,-300,W+600,H+600);
  var k0=Math.floor(sCam/STEP)+1,kN=k0+Math.floor(ZMAX/STEP),rings=[];
  for(var k=k0;k<=kN;k++){var s=k*STEP,a=proj(s,0,1),z=s-sCam;rings.push({s:s,k:k,cx:a.x,cy:a.y-Math.cos(0)*a.k+a.k*0,z:z,r:a.k,c:proj(s,0,0)});}
  var lp=objs.filter(function(o){return o.k==='loop';});
  function inLoopSeg(s){for(var i=0;i<lp.length;i++)if(s>=lp[i].s&&s<=lp[i].s+lp[i].L)return true;return false;}
  var wl=slide.wall,wl2=shade(wl,0.25),rain=['#ff5a4e','#ff9f1c','#ffe14d','#38c172','#3fb6ff','#a66bff'];
  // Ringe von nah nach fern
  for(var i=0;i<rings.length;i++){var R=rings[i],f=Math.min(1,Math.pow(R.z/ZMAX,1.4));
    var base=inLoopSeg(R.s)?rain[((R.k%6)+6)%6]:(R.k%2?wl:wl2);
    var colr=base.charAt(0)==='#'&&base.length===7?mix(base,FOG,f):base;
    circ(c,R.c.x,R.c.y,R.r);c.fillStyle=colr;c.fill();
    if(R.k%8===0){c.lineWidth=Math.max(1,R.r*0.03);c.strokeStyle=mix('#1d1a2b',FOG,f);c.stroke();}}
  var last=rings[rings.length-1];circ(c,last.c.x,last.c.y,last.r*0.95);c.fillStyle=FOG;c.fill();
  // Wasserrinne unten
  var WA=0.62;
  c.beginPath();for(i=0;i<rings.length;i++){var q=proj(rings[i].s,-WA,1);i?c.lineTo(q.x,q.y):c.moveTo(q.x,q.y);}
  for(i=rings.length-1;i>=0;i--){q=proj(rings[i].s,WA,1);c.lineTo(q.x,q.y);}c.closePath();
  c.fillStyle='rgba(79,195,255,.85)';c.fill();
  // Schaumstreifen
  c.strokeStyle='rgba(255,255,255,.7)';c.lineCap='round';
  for(i=0;i<14;i++){var ss=sCam+((i*1.9-t*3)%ZMAX+ZMAX)%ZMAX+0.6,th=((i*37)%11-5)/5*WA*0.8;
    var a1=proj(ss,th,1),a2=proj(ss+0.5,th,1);c.lineWidth=Math.max(1,a1.k*0.02);c.beginPath();c.moveTo(a1.x,a1.y);c.lineTo(a2.x,a2.y);c.stroke();}
  // Längslinien in der Röhre
  c.strokeStyle='rgba(255,255,255,.28)';c.lineWidth=2;
  [-2.2,-1.4,1.4,2.2,Math.PI].forEach(function(th){c.beginPath();for(var j=0;j<rings.length;j+=2){var q=proj(rings[j].s,th,1);j?c.lineTo(q.x,q.y):c.moveTo(q.x,q.y);}c.stroke();});
  // Objekte von fern nach nah
  var vis=objs.filter(function(o){return !o.done&&o.k!=='loop'&&o.s>sCam+0.4&&o.s<sCam+ZMAX;}).sort(function(a,b){return b.s-a.s;});
  vis.forEach(function(o){
    var r0=o.air?0.55:0.93,q=proj(o.s,o.th,r0),cen=proj(o.s,o.th,0),rot=Math.atan2(cen.x-q.x,-(cen.y-q.y));
    var sc=q.k/300,f=Math.min(1,Math.pow((o.s-sCam)/ZMAX,1.4));
    c.save();c.globalAlpha=1-f*0.6;c.translate(q.x,q.y);c.rotate(rot);
    if(o.k==='star'){star(c,0,-20*sc*2,30*sc*2,'#ffe14d');}
    else if(o.k==='duck')drawDuck(c,0,-10*sc*2,1.5*sc*2,t);
    else if(o.k==='ball')drawBeachBall(c,0,-16*sc*2,1.5*sc*2,t);
    else if(o.k==='boost'){c.scale(sc*2,sc*2);for(var b=0;b<3;b++){P(c,[-20,-6-b*18,0,-22-b*18,20,-6-b*18,0,-14-b*18]);fs(c,'#7fffb0',2.5);}}
    else if(o.k==='jumpsign'){c.scale(sc*2,sc*2);c.beginPath();c.roundRect(-46,-40,92,34,8);fs(c,'#ffffff',3);c.fillStyle=INK;c.font='16px Bungee, "Arial Black", sans-serif';c.textAlign='center';c.fillText('HÜPF!',0,-17);}
    c.restore();});
  // Looping-Schild vor dem Looping
  lp.forEach(function(o){var z=o.s-sCam;if(z<1||z>ZMAX)return;var q=proj(o.s,Math.PI,0.75);if(z<ZMAX*0.8){c.save();c.translate(q.x,q.y);var sc=q.k/150;c.scale(sc,sc);
    c.beginPath();c.roundRect(-70,-16,140,34,10);fs(c,'#ffe14d',3);c.fillStyle=INK;c.font='17px Bungee, "Arial Black", sans-serif';c.textAlign='center';c.fillText('LOOPING',0,8);c.restore();}});
  c.restore();
  // Monster (von hinten), dreht sich mit der Röhre
  var me2=me,mq=proj(pS(),me2.th,MR),mrot=-(me2.th-roll)*0;
  c.save();c.translate(W/2,H/2);c.rotate(roll);c.translate(-W/2,-H/2);
  var cen2=proj(pS(),me2.th,0),rr=Math.atan2(cen2.x-mq.x,-(cen2.y-mq.y));
  drawBack(c,me2.P,mq.x,mq.y,mq.k/300*1.35,t,{rot:rr,h:me2.h*200,flash:me2.inv>0?me2.inv:0,dizzy:me2.dizzy});
  if(me2.boost>0){c.fillStyle='rgba(127,255,176,.8)';for(var bq=0;bq<3;bq++)c.fillRect(mq.x-80+bq*60,mq.y+40+(bq%2)*10,30,5);}
  c.restore();
  fx.forEach(function(f){c.globalAlpha=Math.min(1,f.life/f.max*2);
    if(f.k==='c'){c.save();c.translate(f.x,f.y);c.rotate(f.r);c.fillStyle=f.col;c.fillRect(-5,-3,10,6);c.restore();}
    else if(f.k==='d'){circ(c,f.x,f.y,5);c.fillStyle='#d6f2ff';c.fill();}
    else{c.font='26px Bungee, "Arial Black", sans-serif';c.textAlign='center';c.lineWidth=5;c.strokeStyle=INK;c.lineJoin='round';c.strokeText(f.text,f.x,f.y);c.fillStyle=f.col;c.fillText(f.text,f.x,f.y);}});
  c.globalAlpha=1;
  if(state==='ready'){var n=Math.ceil(stateT/0.73);bigText(c,n>=3?'3':n===2?'2':'1 … Rutsch los!',150,n>=2?90:64,'#ffffff');}
  if(banner){var al=Math.min(1,banner.t*2,(banner.max-banner.t)*6);c.globalAlpha=al;bigText(c,banner.a,130,72,banner.a==='LOOPING!'?'#ffe14d':'#4fc3ff');if(banner.b)bigText(c,banner.b,180,26,'#ffffff');c.globalAlpha=1;}
}
function bigText(c,text,y,size,col){c.font=size+'px Bungee, "Arial Black", sans-serif';c.textAlign='center';c.lineJoin='round';
  c.lineWidth=Math.max(5,size/6);c.strokeStyle=INK;c.strokeText(text,W/2,y);c.fillStyle=col;c.fillText(text,W/2,y);}

/* ---------- Ton ---------- */
var AC=null,muted=false;
function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f0,f1,type,dur,vol,delay){
  var n=AC.currentTime+(delay||0),o=AC.createOscillator(),gn=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,n);o.frequency.exponentialRampToValueAtTime(f1,n+dur);
  gn.gain.setValueAtTime(vol,n);gn.gain.setValueAtTime(vol,n+dur*0.6);gn.gain.exponentialRampToValueAtTime(0.0001,n+dur);
  o.connect(gn);gn.connect(AC.destination);o.start(n);o.stop(n+dur+0.02);}
function sfx(k){if(!AC||muted)return;
  if(k==='star')tone(880,1320,'triangle',0.1,0.07);
  else if(k==='jump')tone(300,700,'sine',0.15,0.08);
  else if(k==='land')tone(200,90,'sine',0.12,0.08);
  else if(k==='ramp'){tone(300,900,'square',0.3,0.05);}
  else if(k==='boost'){tone(400,1200,'sawtooth',0.25,0.05);}
  else if(k==='quack'){tone(620,380,'square',0.09,0.07);tone(600,360,'square',0.1,0.07,0.12);}
  else if(k==='boing')tone(180,520,'sine',0.25,0.1);
  else if(k==='splash'){tone(500,60,'sawtooth',0.5,0.06);tone(200,40,'sine',0.6,0.12);}
  else if(k==='go'){tone(660,660,'triangle',0.12,0.07);tone(990,990,'triangle',0.2,0.07,0.13);}
  else if(k==='cheer'){[523,659,784,1047].forEach(function(f,i){tone(f,f,'triangle',0.18,0.07,i*0.12);});}}
$('mute').onclick=function(){muted=!muted;$('mute').textContent=muted?'🔇 Ton aus':'🔊 Ton an';initAudio();};

/* ---------- Schleife ---------- */
showBuilder();
var last=performance.now();
function loop(now){var raw=(now-last)/1000,dt=Math.min(0.033,raw);last=now;var t=now/1000;perfTick(raw);
  if(!$('builder').hidden)drawPreview(t);
  if(!$('game').hidden&&me){update(dt);drawGame(t);}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
