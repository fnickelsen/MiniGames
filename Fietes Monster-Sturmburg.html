<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="Sturmburg">
<title>Fietes Monster-Sturmburg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Bungee&display=swap">
<style>
/* Layout: Sturm-Himmel – Sticker-Karten mit harten Schatten auf Himmelblau, die schwebende Bau-Insel ist die Hauptbühne */
:root{
  --sky0:#bfe6ff; --dots:rgba(20,60,120,.12); --ink:#1d1a2b; --paper:#fffaf0;
  --grape:#6c3fd1; --go:#38c172; --sky:#3fb6ff; --white:#ffffff; --red:#ff5a4e; --p1:#ffe14d; --p2:#7fe3ff;
  --display:'Bungee','Arial Black',Impact,system-ui,sans-serif;
  --body:'Baloo 2','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;min-height:100%}
*{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
html,body{background-color:var(--sky0);color:var(--ink);
  background-image:radial-gradient(circle at 2px 2px,var(--dots) 2px,transparent 2.6px);background-size:28px 28px;background-attachment:fixed}
body{font-family:var(--body);font-size:18px;line-height:1.35;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,44px);line-height:1;margin:0;text-wrap:balance}
h1 span{color:var(--white);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.steps{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0}
.steps li{font-weight:800;font-size:16px;padding:3px 14px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);opacity:.5}
.steps li.on{opacity:1;background:var(--grape);color:var(--white)}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink)}
.builder{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start;max-width:1060px;width:100%;justify-self:center}
@media (max-width:820px){.builder{grid-template-columns:minmax(0,1fr)}}
.preview{padding:16px;display:grid;gap:10px}
@media (min-width:821px){.preview{position:sticky;top:12px}}
#pv{display:block;width:100%;height:auto;border:3px solid var(--ink);border-radius:14px}
label{font-weight:800}
.txt-in{font:inherit;font-weight:800;font-size:20px;padding:5px 14px;border:3px solid var(--ink);border-radius:12px;background:var(--white);color:var(--ink);width:100%;box-sizing:border-box}
.panel{padding:18px 20px;display:grid;gap:16px;min-width:0}
.flat{padding:0}
h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0;text-wrap:balance}
.row{display:grid;gap:6px}
.lab{font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:700;font-size:17px;padding:3px 14px;border:3px solid var(--ink);border-radius:12px;background:var(--white);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.chip.sel{background:var(--grape);color:var(--white)}
.chip.sw{width:42px;height:42px;padding:0;border-radius:50%}
.chip.sw.sel{outline:4px solid var(--grape);outline-offset:3px}
.chip:disabled{opacity:.25;cursor:not-allowed}
:focus-visible{outline:4px solid var(--sky);outline-offset:2px}
.sep{border:0;border-top:3px dashed rgba(29,26,43,.2);margin:4px 0;width:100%}
.btn{font-family:var(--display);font-weight:400;font-size:18px;padding:10px 18px;border:3px solid var(--ink);border-radius:14px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);background:var(--white);color:var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.go{background:var(--go)}
.btn.small{font-size:15px;padding:6px 14px;box-shadow:3px 3px 0 var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
.actions #go{margin-left:auto}
.who{font-family:var(--display);font-size:15px;justify-self:start;padding:2px 12px;border:3px solid var(--ink);border-radius:999px;background:var(--p1)}
.who.p2{background:var(--p2)}
.game{display:grid;gap:10px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.stage{position:relative;border:3px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:6px 6px 0 var(--ink);background:#8fd3ff;justify-self:center;width:100%;box-sizing:border-box}
#cv{display:block;width:100%;height:auto;touch-action:none}
.overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:grid;place-items:center;background:rgba(29,26,43,.5);padding:12px}
.ocard{padding:16px 22px;width:min(480px,100%);box-sizing:border-box;display:grid;gap:10px;text-align:center;max-height:100%;overflow:auto}
.ocard h2{font-size:26px}
.ocard p{margin:0;font-weight:700}
.ocard .big{font-size:38px;line-height:1.1}
.ocard .actions{justify-content:center}
.ocard .actions #go{margin-left:0}
@media (max-width:700px){.overlay{position:static;background:none;padding:12px 0 0}}
.pad{display:flex;align-items:center;gap:12px;justify-content:space-between}
.side{display:grid;gap:8px;flex:none}
.side.c2{grid-template-columns:repeat(2,auto)}
.side.c3{grid-template-columns:repeat(3,auto)}
.ctl{min-width:72px;min-height:64px;padding:4px 8px;font-size:26px;line-height:1;display:grid;place-items:center;gap:2px;touch-action:none;-webkit-user-select:none;user-select:none}
.ctl small{font-family:var(--body);font-weight:800;font-size:12px;line-height:1}
.ctl.wide{min-width:96px}
.ctl.big{min-width:96px;min-height:80px;font-size:32px}
.ctl:disabled{opacity:.3}
.side.s1 .ctl{background:#fff4b8}
.side.s2 .ctl{background:#d6f6ff}
.ctl.drop{background:var(--go)!important}
.ctl.done{background:#ffffff!important}
.ctl.on{outline:4px solid var(--grape);outline-offset:2px}
.mid{flex:1;min-width:0;display:grid;gap:8px;justify-items:center;align-content:center}
.hint{margin:0;text-align:center;font-weight:800;font-size:16px;line-height:1.25}
.tbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tbar .btn.small{font-size:13px;padding:5px 10px}
.foot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
body.playing{padding-block:8px 4px}
body.playing .top{display:none}
.hall{font-family:var(--display);font-size:14px;padding:4px 12px;border:3px solid var(--ink);border-radius:12px;background:var(--white);color:var(--ink);text-decoration:none;box-shadow:3px 3px 0 var(--ink)}
.blocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;font-weight:700;font-size:15px;line-height:1.25}
.blocks div{padding:6px 10px;border:3px solid var(--ink);border-radius:12px;background:var(--white)}
.blocks b{display:block}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Fietes <span>Monster-Sturmburg</span></h1>
    <a class="hall" href="index.html">← Spielehalle</a>
    <ol class="steps" id="steps"><li class="on">1 Monster</li><li>2 Bauen</li><li>3 Sturm</li></ol>
  </header>

  <section id="builder" class="builder">
    <div class="card preview">
      <canvas id="pv" width="440" height="300" aria-label="Vorschau von deinem Monster"></canvas>
      <label for="name">Wie heißt dein Monster?</label>
      <input id="name" class="txt-in" maxlength="14" autocomplete="off">
      <div class="blocks">
        <div><b>🪵 Holzbalken</b>lang, man kann ihn drehen</div>
        <div><b>📦 Holzklotz</b>klein und praktisch</div>
        <div><b>🪨 Stein</b>schwer, hält den Wind aus</div>
        <div><b>🔺 Dachziegel</b>breit und leicht</div>
      </div>
    </div>
    <div class="card panel">
      <div id="modebox" class="panel flat">
        <div class="row">
          <div class="lab">Wer baut?</div>
          <div class="chips"><button type="button" id="m1" class="chip sel">Allein</button><button type="button" id="m2" class="chip">Zu zweit gegeneinander</button></div>
        </div>
        <div class="row">
          <div class="lab">Wie stark ist der Sturm?</div>
          <div class="chips"><button type="button" id="d0" class="chip">🍃 Brise</button><button type="button" id="d1" class="chip sel">🌬️ Sturm</button><button type="button" id="d2" class="chip">🌪️ Orkan</button></div>
        </div>
        <hr class="sep">
      </div>
      <span id="who" class="who" hidden>Spieler 1</span>
      <h2>Bau dein Monster!</h2>
      <div id="rows" class="panel flat" style="gap:14px"></div>
      <div class="actions">
        <button id="back1" class="btn" hidden>← Spieler 1</button>
        <button id="rand" class="btn small">🎲 Zufalls-Monster</button>
        <button id="go" class="btn go">Ab auf die Insel!</button>
      </div>
    </div>
  </section>

  <section id="game" class="game" hidden>
    <div class="stage">
      <canvas id="cv" width="1000" height="600" aria-label="Die Bau-Insel im Sturm"></canvas>
      <div id="overlay" class="overlay" hidden></div>
    </div>
    <div class="pad">
      <div class="side" id="sideL"></div>
      <div class="mid" id="tmid"><p class="hint" id="hint"></p></div>
      <div class="side" id="sideR"></div>
    </div>
    <div class="foot">
      <button id="quit" class="btn small">← Zum Monster</button>
      <button id="pause" class="btn small">⏸ Pause</button>
      <button id="mute" class="btn small">🔊 Ton an</button>
    </div>
  </section>
</div>

<script>
/* ===== iPad-Grundlagen (Zielgerät: iPad Air 2, iOS 15, Safari) =====
   - Touch erkennen, Bildschirm einpassen, kein Scrollen/Zoomen im Spiel
   - Ton unter iOS freischalten (braucht ein echtes Antippen)
   - Bildqualität automatisch senken, wenn das Gerät zu langsam ist */
var DPR_MAX=2;
var IS_TOUCH=('ontouchstart' in window)||(navigator.maxTouchPoints||0)>0;
if(IS_TOUCH)document.documentElement.classList.add('is-touch');
function gameOn(){var g=document.getElementById('game');return !!g&&!g.hidden;}
function fitStage(){
  var game=document.getElementById('game'),stage=document.querySelector('.stage'),c=document.getElementById('cv');
  if(!game||game.hidden||!stage||!c)return;
  stage.style.maxWidth='';
  var other=game.getBoundingClientRect().height-stage.getBoundingClientRect().height;
  var avail=window.innerHeight-other-22;
  stage.style.maxWidth=Math.max(300,Math.floor(avail*c.width/c.height))+'px';
}
function enterGameScreen(){document.body.classList.add('playing');window.scrollTo(0,0);fitStage();requestAnimationFrame(fitStage);setTimeout(fitStage,400);}
function leaveGameScreen(){document.body.classList.remove('playing');var s=document.querySelector('.stage');if(s)s.style.maxWidth='';window.scrollTo(0,0);}
window.addEventListener('resize',fitStage);
window.addEventListener('orientationchange',function(){setTimeout(fitStage,400);});
var audioUnlocked=false;
function unlockAudio(){
  if(typeof initAudio!=='function')return;
  initAudio();
  if(audioUnlocked||!AC)return;
  try{var b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0);audioUnlocked=true;}catch(e){}
}
document.addEventListener('touchend',unlockAudio,true);
document.addEventListener('click',unlockAudio,true);
document.addEventListener('touchmove',function(e){
  if(gameOn()&&!(e.target&&e.target.closest&&e.target.closest('.ocard,.rcard')))e.preventDefault();
},{passive:false});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
var perfN=0,perfSum=0,lowQ=false;
function perfTick(raw){
  if(lowQ||!gameOn()||document.hidden||raw>0.25)return;
  perfN++;perfSum+=raw;
  if(perfN>=90){
    if(perfSum/perfN>0.026){lowQ=true;DPR_MAX=1;if(typeof onLowQuality==='function')onLowQuality();}
    perfN=0;perfSum=0;
  }
}
function compactControls(){
  if(!IS_TOUCH)return;
  var mid=document.getElementById('tmid'),foot=document.querySelector('.foot');if(!mid||!foot)return;
  var bar=document.createElement('div');bar.className='tbar';
  while(foot.firstElementChild)bar.appendChild(foot.firstElementChild);
  mid.appendChild(bar);foot.hidden=true;
}
compactControls();
/* ===== Ende iPad-Grundlagen ===== */


/* Kompatibilität: ältere Safari-Versionen (iPadOS < 16) kennen roundRect nicht */
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.max(0,Math.min(typeof r==='number'?r:(r&&r[0])||0,Math.abs(w)/2,Math.abs(h)/2));
    this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};
}
/* Fehler sichtbar machen, falls doch etwas schiefgeht (hilft auf dem iPad ohne Entwicklerwerkzeuge) */
window.addEventListener('error',function(e){
  var b=document.getElementById('errbox');
  if(!b){b=document.createElement('div');b.id='errbox';
    b.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#fffaf0;color:#1d1a2b;border:3px solid #1d1a2b;border-radius:14px;padding:10px 14px;font:600 15px/1.35 system-ui,sans-serif;box-shadow:4px 4px 0 #1d1a2b';
    document.body.appendChild(b);}
  b.textContent='Ups, da ist etwas kaputtgegangen. Bitte diesen Text an Claude schicken: '+e.message+' (Zeile '+e.lineno+')';
});

const INK='#1d1a2b', TAU=Math.PI*2;
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shade(hex,a){let n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  const f=v=>Math.round(a<0?v*(1+a):v+(255-v)*a);return `rgb(${f(r)},${f(g)},${f(b)})`;}
function P(c,p){c.beginPath();c.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);c.closePath();}
function fs(c,fill,lw=3){c.fillStyle=fill;c.fill();c.lineWidth=lw;c.strokeStyle=INK;c.stroke();}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,TAU);}
function setup(cv,w,h){const d=Math.min(DPR_MAX,window.devicePixelRatio||1);cv.width=w*d;cv.height=h*d;const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);return x;}

/* ---------- Monster ---------- */
const COLORS=['#38c172','#ff5a4e','#3fb6ff','#a66bff','#ff9f1c','#ff6fb5','#2ec4b6','#8d6e63'];
const OPTS={
  color:COLORS.map(v=>({v})),
  eyes:[{v:1,l:'1'},{v:2,l:'2'},{v:3,l:'3'},{v:5,l:'5'}],
  horns:[{v:'none',l:'Keine'},{v:'small',l:'Kleine'},{v:'big',l:'Riesig'},{v:'antenna',l:'Antennen'}],
  mouth:[{v:'smile',l:'Lächeln'},{v:'teeth',l:'Zähne'},{v:'fangs',l:'Riesenzähne'},{v:'tongue',l:'Zunge raus'}],
  arms:[{v:2,l:'2 Arme'},{v:4,l:'4 Arme'}],
  tail:[{v:'none',l:'Keiner'},{v:'tail',l:'Puschel'},{v:'spiky',l:'Stachel'}],
  wings:[{v:false,l:'Keine'},{v:true,l:'Flügel'}],
  pattern:[{v:'none',l:'Keins'},{v:'spots',l:'Punkte'},{v:'stripes',l:'Streifen'}],
};
const ROWS=[['color','Farbe'],['eyes','Augen'],['horns','Hörner'],['mouth','Mund'],['arms','Arme'],['tail','Schwanz'],['wings','Flügel'],['pattern','Muster']];
function randMonster(except){const m={};for(const k in OPTS)m[k]=pick(OPTS[k]).v;
  if(except){m.color=pick(COLORS.filter(c=>!except.includes(c)));}return m;}

function arm(c,x1,y1,x2,y2,col){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.lineWidth=10;c.strokeStyle=INK;c.stroke();
  c.lineWidth=5;c.strokeStyle=col;c.stroke();circ(c,x2,y2,4.5);fs(c,col,2.5);}
const EYES={1:[[10,-8,11]],2:[[2,-10,8],[18,-8,7]],3:[[-6,-12,7],[10,-15,7.5],[22,-3,6]],5:[[-10,-12,5.5],[1,-19,6],[13,-13,6.5],[23,-3,5],[5,-2,4.5]]};

function drawMonster(c,m,x,y,s,t){
  const col=m.color,dk=shade(col,-0.3),lt=shade(col,0.4);
  c.save();c.translate(x,y+Math.sin(t*7)*1.2);c.scale(s,s);c.lineJoin='round';c.lineCap='round';
  if(m.wings){const f=Math.sin(t*16)*0.4;c.save();c.translate(-8,-14);c.rotate(-0.5+f);
    c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(-20,-36,-46,-28);c.quadraticCurveTo(-34,-16,-40,-4);c.quadraticCurveTo(-22,-8,0,0);c.closePath();
    fs(c,'rgba(255,255,255,.9)',2.5);c.restore();}
  if(m.tail!=='none'){const w=Math.sin(t*6)*5;c.beginPath();c.moveTo(-22,12);c.quadraticCurveTo(-46,18+w,-50,-4+w);
    c.lineWidth=11;c.strokeStyle=INK;c.stroke();c.lineWidth=5;c.strokeStyle=col;c.stroke();
    if(m.tail==='spiky'){P(c,[-57,-2+w,-50,-18+w,-43,-2+w]);fs(c,'#fff1c9',2.5);}
    else{circ(c,-50,-5+w,7);fs(c,dk,2.5);}}
  if(m.arms===4)arm(c,-10,4,-28,-20+Math.sin(t*9)*7,col);
  const body=()=>{c.beginPath();c.ellipse(0,0,30,28,0,0,TAU);};
  body();c.fillStyle=col;c.fill();
  c.save();body();c.clip();
  c.fillStyle=lt;c.beginPath();c.ellipse(12,16,18,14,0,0,TAU);c.fill();
  c.fillStyle=dk;
  if(m.pattern==='spots')[[-15,-9,6],[-19,9,4],[-4,-21,3.5],[-8,14,3]].forEach(([a,b,r])=>{circ(c,a,b,r);c.fill();});
  if(m.pattern==='stripes')for(let i=-30;i<6;i+=11){P(c,[i,-30,i+5,-30,i-1,30,i-6,30]);c.fill();}
  c.restore();
  body();c.lineWidth=3;c.strokeStyle=INK;c.stroke();
  arm(c,6,28,36,33,col);
  const hc='#fff1c9';
  if(m.horns==='small'){P(c,[-15,-23,-9,-38,-4,-26]);fs(c,hc,2.5);P(c,[5,-27,12,-41,16,-24]);fs(c,hc,2.5);}
  if(m.horns==='big'){c.beginPath();c.moveTo(-20,-18);c.quadraticCurveTo(-34,-42,-14,-54);c.quadraticCurveTo(-22,-40,-6,-26);c.closePath();fs(c,hc,2.5);
    c.beginPath();c.moveTo(4,-27);c.quadraticCurveTo(10,-52,30,-54);c.quadraticCurveTo(18,-42,18,-20);c.closePath();fs(c,hc,2.5);}
  if(m.horns==='antenna'){const w=Math.sin(t*5)*3;[[-6,-27,-13+w,-48],[8,-27,15+w,-48]].forEach(([a,b,cx,cy])=>{
    c.beginPath();c.moveTo(a,b);c.lineTo(cx,cy);c.lineWidth=3;c.strokeStyle=INK;c.stroke();circ(c,cx,cy,5);fs(c,'#ffe14d',2.5);});}
  const blink=((t*0.7)%3)<0.09;
  for(const [ex,ey,r] of EYES[m.eyes]){circ(c,ex,ey,r);fs(c,'#fff',2.5);
    if(blink){c.beginPath();c.moveTo(ex-r,ey);c.lineTo(ex+r,ey);c.stroke();}
    else{circ(c,ex+r*0.35,ey+r*0.1,r*0.5);c.fillStyle=INK;c.fill();circ(c,ex+r*0.2,ey-r*0.15,r*0.17);c.fillStyle='#fff';c.fill();}}
  c.lineWidth=2.5;
  if(m.mouth==='smile'){c.beginPath();c.arc(16,3,9,0.25,Math.PI-0.7);c.lineWidth=3;c.strokeStyle=INK;c.stroke();}
  else if(m.mouth==='teeth'){c.beginPath();c.moveTo(6,8);c.quadraticCurveTo(18,22,28,5);c.closePath();fs(c,INK,2);
    for(const x of [11,17,23]){P(c,[x-3,7.5,x,13,x+3,7]);c.fillStyle='#fff';c.fill();}}
  else if(m.mouth==='fangs'){c.beginPath();c.moveTo(2,6);c.quadraticCurveTo(17,24,30,3);c.closePath();fs(c,INK,2);

/* ---------- Spiel ---------- */
var W=1000,H=600,cv=$('cv'),g=setup(cv,W,H),bgCache=null;

function makeView(i){

    mon:{x:2.2,face:1,walk:false,hold:0,lift:0,cd:0},fly:null,inp:{l:false,r:false},placed:0};
}
function curType(p){return ORDER[p.sel];}

function act(i,what){

/* ---------- Knöpfe ---------- */

    else if(mode===1)h='Laufen: ← → oder A D · Drehen: ↑ oder W · Ablegen: Leertaste oder ↓ · Klotz: 1–4 oder F · Fertig: Enter';
    else h='Spieler 1: A D laufen · W drehen · S ablegen · F Klotz · G fertig — Spieler 2: ← → · ↑ · ↓ · Enter · Shift';
  }

var KEYMAP=[
  {l:['KeyA'],r:['KeyD'],rot:['KeyW'],drop:['KeyS'],sel:['KeyF'],done:['KeyG']},
  {l:['ArrowLeft'],r:['ArrowRight'],rot:['ArrowUp'],drop:['ArrowDown'],sel:['Enter','NumpadEnter'],done:['ShiftRight']}

function keyAction(code){
  if(mode===1){if(code==='Space')return {p:0,w:'drop'};if(code==='Enter'||code==='NumpadEnter')return {p:0,w:'done'};}
  for(var i=0;i<2;i++){var m=KEYMAP[i];for(var k in m)if(m[k].indexOf(code)>=0)return {p:mode===1?0:i,w:k};}
  return null;
}
window.addEventListener('keydown',function(e){
  if(!gameOn())return;
  if(e.target&&e.target.tagName==='INPUT')return;
  var a=keyAction(e.code);
  if(mode===1&&/^Digit[1-4]$/.test(e.code)&&players[0]){selType(players[0],+e.code.slice(5)-1);e.preventDefault();return;}
  if(!a)return;e.preventDefault();
  if(a.w==='l'||a.w==='r'){keys[e.code]=true;return;}
  if(e.repeat)return;
  if(mode===1&&e.code==='Enter'&&state==='intro'){beginBuild();return;}
  act(a.p,a.w);
});
window.addEventListener('keyup',function(e){keys[e.code]=false;});
window.addEventListener('blur',function(){keys={};players.forEach(function(p){p.inp.l=p.inp.r=false;});});

  var list=mode===1?KEYMAP[0][dir].concat(KEYMAP[1][dir]):KEYMAP[p.i][dir];
  for(var j=0;j<list.length;j++)if(keys[list[j]])return true;return false;
}
/* Antippen der Klotz-Leiste im Bild */
var palRects=[];
cv.addEventListener('pointerdown',function(e){
  var r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  for(var j=0;j<palRects.length;j++){var q=palRects[j];if(x>=q.x&&x<=q.x+q.w&&y>=q.y&&y<=q.y+q.h){e.preventDefault();selType(players[q.p],q.j);return;}}
  if(state==='intro')return;
});

/* ---------- Ablauf ---------- */
var STEP=1/60;
function update(dt){
  if(state==='idle'||paused)return;
  parts.forEach(function(q){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g?q.g*dt:0;});parts=parts.filter(function(q){return q.life>0;});
  texts.forEach(function(q){q.life-=dt;q.y-=30*dt;});texts=texts.filter(function(q){return q.life>0;});
  if(banner){banner.life-=dt;if(banner.life<=0)banner=null;}
  if(state==='intro')return;
  if(state==='build'){phaseT-=dt;if(phaseT<=0||players.every(function(p){return p.done||blocksLeft(p)===0;}))beginCount();}
  else if(state==='count'){var before=Math.ceil(phaseT);phaseT-=dt;if(Math.ceil(phaseT)!==before&&phaseT>0)sfx('beep');if(phaseT<=0)beginStorm();}
  else if(state==='storm'){stormT+=dt;if(stormT>=STORM_T||players.every(function(p){return p.fell!==null;}))endStorm();}
  else if(state==='end'){endT+=dt;if(endT>2.6&&$('overlay').hidden)showResult();}
  var Wv=state==='storm'?windAt(stormT,STORM[stormLv].k):state==='end'?wind*Math.pow(0.3,dt):0;
  wind=Wv;
  var S=Math.abs(wind),dir=wind>=0?1:-1,K=STORM[stormLv].k;
  if(state==='storm'&&stormT>=60&&stormT-dt<60)banner={text:'Der Wind dreht!',life:1.8};
  players.forEach(function(p){
    var mon=p.mon,mv=0;
    if(canBuild()){if(p.inp.l||keyHeld(p,'l'))mv-=1;if(p.inp.r||keyHeld(p,'r'))mv+=1;}
    mon.walk=mv!==0;
    if(mv){mon.hold+=dt;mon.face=mv;var sp=(1.4+Math.min(1,mon.hold/0.5)*2.4)*(1-0.12*S*mv*-dir/K);mon.x+=mv*sp*dt;}else mon.hold=0;
    mon.x=clamp(mon.x,1.2,8.8);
    if(mon.cd>0)mon.cd-=dt;mon.lift=Math.max(0,mon.lift-dt*4);
    if(p.fly){p.fly.t+=dt;if(p.fly.t>=p.fly.T)land(p);}
  });
  acc+=dt;var n=0;
  while(acc>=STEP&&n<3){
    players.forEach(function(p){if(S>0)applyWind(p,wind);p.world.step(STEP);});
    acc-=STEP;n++;
  }
  if(n===3)acc=0;
  players.forEach(function(p){
    var v=p.view;
    p.blocks.forEach(function(b){if(!b.gone&&(b.y<-1.5||Math.abs(b.x-5)>9)){b.gone=true;p.world.remove(b);
      sfx('splash');for(var k=0;k<8;k++)parts.push({x:v.ox+b.x*v.px,y:v.gy+1.35*v.px,vx:(Math.random()-0.5)*120,vy:-80-Math.random()*90,g:300,life:0.7,max:0.7,r:3+Math.random()*3,col:'#ffffff'});}});
    if(state==='storm'){p.blocks.forEach(function(b){if(!b.gone&&!b.snap&&stormT-b.born>1)b.snap={x:b.x,y:b.y,a:b.a};});
      p.pct=score(p);
      if(p.fell===null&&stormT>0.5&&p.pct<FALL_PCT){p.fell=stormT;sfx('crash');
        texts.push({x:v.x0+v.w/2,y:H*0.45,text:'EINGESTÜRZT!',life:2.2,big:true});}}
    else if(state==='end')p.pct=score(p);
  });
  // Wind-Teilchen
  var I=S/4.6;
  if(state==='storm'||state==='end'){
    var want=Math.min(60,Math.round(I*70));
    while(streaks.length<want)streaks.push(newStreak(dir));
    streaks.forEach(function(s){s.x+=dir*s.v*(0.4+I)*dt;s.y+=Math.sin(s.x*0.02+s.ph)*20*dt;s.rot+=dt*6;});
    streaks=streaks.filter(function(s){return s.x>-60&&s.x<W+60;});
    if(streaks.length>want+10)streaks.length=want+10;
  } else streaks=[];
  clouds.forEach(function(cl){cl.x+=(8+dir*S*40)*dt*cl.s;if(cl.x>W+120)cl.x=-120;if(cl.x<-120)cl.x=W+120;});
}
function newStreak(dir){return {x:dir>0?-40-Math.random()*W*0.5:W+40+Math.random()*W*0.5,y:Math.random()*H*0.85,v:500+Math.random()*400,len:30+Math.random()*60,leaf:Math.random()<0.25,ph:Math.random()*6,rot:Math.random()*6};}

/* ---------- Zeichnen ---------- */
function drawBackground(c){
  var gr=c.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#6ec3ff');gr.addColorStop(0.75,'#cdeeff');gr.addColorStop(1,'#cdeeff');
  c.fillStyle=gr;c.fillRect(0,0,W,H);
  c.fillStyle='rgba(255,255,255,.35)';for(var i=0;i<4;i++){var hx=rnd(i+3)*W;c.beginPath();c.ellipse(hx,H-120,160+rnd(i)*120,60,0,Math.PI,0);c.fill();}
  players.forEach(function(p){var v=p.view,x1=v.ox+1*v.px,x2=v.ox+9*v.px,gy=v.gy,sea=gy+1.35*v.px;
    c.beginPath();c.moveTo(x1,gy);c.lineTo(x2,gy);c.quadraticCurveTo(x2-30,gy+60,v.ox+5*v.px+60,sea+30);c.lineTo(v.ox+5*v.px-60,sea+30);c.quadraticCurveTo(x1+30,gy+60,x1,gy);c.closePath();fs(c,'#8b6b4a',3);
    c.save();c.clip();c.fillStyle='rgba(60,40,20,.25)';for(var k=0;k<14;k++){circ(c,x1+rnd(k+p.i*20)*(x2-x1),gy+16+rnd(k+40)*60,4+rnd(k+80)*8);c.fill();}c.restore();
    c.beginPath();c.roundRect(x1-6,gy-8,x2-x1+12,16,8);fs(c,'#5cc461',3);
    c.fillStyle='#3e9b47';for(var q=0;q<30;q++){var gx=x1+q*(x2-x1)/30+4;P(c,[gx,gy-7,gx+3,gy-15,gx+6,gy-7]);c.fill();}
  });
  var sea=players.length?players[0].view.gy+1.35*players[0].view.px:H-40;
  c.fillStyle='#3a8fd9';c.fillRect(0,sea,W,H-sea);
  c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=3;c.beginPath();for(var x=0;x<W;x+=40){c.moveTo(x,sea+6);c.quadraticCurveTo(x+10,sea,x+20,sea+6);}c.stroke();
  if(mode===2){c.fillStyle=INK;c.fillRect(W/2-2,0,4,H);}
}
function toS(v,x,y){return [v.ox+x*v.px,v.gy-y*v.px];}
function drawBody(c,v,b,alpha){
  var s=toS(v,b.x,b.y),w=b.w*v.px,h=b.h*v.px;
  c.save();c.translate(s[0],s[1]);c.rotate(-b.a);if(alpha)c.globalAlpha=alpha;c.drawImage(tex(b.type,v.px),-w/2,-h/2,w,h);c.restore();
}
function pill(c,x,y,w,h,fill){c.beginPath();c.roundRect(x,y,w,h,h/2);fs(c,fill,3);}
function label(c,txt,x,y,size,fill,align){c.font=size+'px Bungee, "Arial Black", sans-serif';c.textAlign=align||'center';c.lineJoin='round';c.lineWidth=Math.max(4,size*0.28);c.strokeStyle=INK;c.strokeText(txt,x,y);c.fillStyle=fill||'#fff';c.fillText(txt,x,y);}
function render(t){
  var c=g;
  if(!bgCache){bgCache=document.createElement('canvas');var d=Math.min(DPR_MAX,window.devicePixelRatio||1);bgCache.width=W*d;bgCache.height=H*d;
    var bc=bgCache.getContext('2d');bc.setTransform(d,0,0,d,0,0);drawBackground(bc);}
  c.drawImage(bgCache,0,0,W,H);
  var S=Math.abs(wind),I=Math.min(1.2,S/4.6),dir=wind>=0?1:-1;
  if(I>0.02){c.fillStyle='rgba(30,35,70,'+(0.32*Math.min(1,I))+')';c.fillRect(0,0,W,H);}
  clouds.forEach(function(cl){var gcol=I>0.3?'rgba(150,155,175,.9)':'rgba(255,255,255,.85)';c.fillStyle=gcol;var s=cl.s;
    circ(c,cl.x,cl.y,22*s);c.fill();circ(c,cl.x+26*s,cl.y-8*s,28*s);c.fill();circ(c,cl.x+54*s,cl.y,20*s);c.fill();c.fillRect(cl.x,cl.y,54*s,20*s);});
  palRects=[];
  players.forEach(function(p){
    var v=p.view;
    c.save();if(mode===2){c.beginPath();c.rect(v.x0+(p.i?2:0),0,v.w-2,H);c.clip();}
    // Baum am Rand biegt sich im Wind
    var tx=v.ox+8.75*v.px,ty=v.gy-4,bend=dir*Math.min(0.5,S*0.09)+Math.sin(t*6)*0.03*I;
    c.save();c.translate(tx,ty);c.rotate(bend*0.4);c.beginPath();c.rect(-4,-46,8,46);fs(c,'#7a5230',2.5);c.translate(0,-50);c.rotate(bend);
    circ(c,0,-8,22);fs(c,'#2f9a45',2.5);circ(c,-8,-14,8);c.fillStyle='rgba(255,255,255,.2)';c.fill();c.restore();
    p.blocks.forEach(function(b){if(!b.gone)drawBody(c,v,b);});
    // Geist-Klotz
    if(canBuild()&&blocksLeft(p)>0&&!p.fly){var gh=ghost(p),s=toS(v,gh.x,gh.y),gw=gh.bw*v.px,ghh=gh.bh*v.px;
      c.save();c.globalAlpha=0.35;c.translate(s[0],s[1]);if(p.rot)c.rotate(Math.PI/2);
      var tt=BT[gh.type];c.drawImage(tex(gh.type,v.px),-tt.w*v.px/2,-tt.h*v.px/2,tt.w*v.px,tt.h*v.px);c.restore();
      c.save();c.setLineDash([6,6]);c.lineWidth=3;c.strokeStyle=gh.ok?'rgba(255,255,255,.95)':'#ff5a4e';c.strokeRect(s[0]-gw/2,s[1]-ghh/2,gw,ghh);
      var ms=toS(v,p.mon.x,2.1);c.lineWidth=2;c.strokeStyle='rgba(255,255,255,.6)';c.beginPath();c.moveTo(ms[0],ms[1]-14);c.lineTo(s[0],s[1]+ghh/2);c.stroke();c.restore();}
    // fliegender Klotz
    if(p.fly){var f=p.fly,k=f.t/f.T,fx=f.x0+(f.gh.x-f.x0)*k,fy=f.y0+(f.gh.y-f.y0)*k+Math.sin(k*Math.PI)*0.6,fs0=toS(v,fx,fy),ft=BT[f.gh.type];
      c.save();c.translate(fs0[0],fs0[1]);if(f.rot)c.rotate(Math.PI/2);c.rotate(Math.sin(k*Math.PI)*0.3);c.drawImage(tex(f.gh.type,v.px),-ft.w*v.px/2,-ft.h*v.px/2,ft.w*v.px,ft.h*v.px);c.restore();}
    // Monster
    var mk=v.px*0.0135,ms2=toS(v,p.mon.x,0),lean=-dir*Math.min(0.25,S*0.05)+(p.mon.walk?0:0);
    var hold=canBuild()&&blocksLeft(p)>0&&!p.fly&&p.mon.cd<=0.05?curType(p):null;
    drawWalker(c,p.def.m,ms2[0],ms2[1]+2,mk,p.mon.face,t+p.i*1.7,{walk:p.mon.walk,hold:hold,rot:p.rot,holdPx:v.px,lift:p.mon.lift,lean:state==='storm'?lean:0});
    c.restore();
    drawHud(c,p,t);
  });
  // Wind-Striche und Blätter
  streaks.forEach(function(s){
    if(s.leaf){c.save();c.translate(s.x,s.y);c.rotate(s.rot);c.beginPath();c.ellipse(0,0,7,3.5,0,0,TAU);fs(c,'#4fb34f',1.5);c.restore();}
    else{c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=2.5;c.beginPath();c.moveTo(s.x,s.y);c.lineTo(s.x-dir*s.len,s.y);c.stroke();}
  });
  parts.forEach(function(q){c.globalAlpha=Math.max(0,Math.min(1,q.life/q.max*1.5));circ(c,q.x,q.y,q.r);c.fillStyle=q.col;c.fill();});
  c.globalAlpha=1;
  texts.forEach(function(q){c.globalAlpha=Math.min(1,q.life*2);label(c,q.text,q.x,q.y,q.big?40:22,q.big?'#ff5a4e':'#ffe14d');});
  c.globalAlpha=1;
  drawTop(c,t);
  if(state==='count'){var n=Math.ceil(phaseT),sc=1+(phaseT%1)*0.4;c.save();c.translate(W/2,H*0.42);c.scale(sc,sc);label(c,n>0?String(n):'',0,30,90,'#ffe14d');c.restore();
    label(c,'Der Sturm kommt!',W/2,H*0.42+80,28,'#fff');}
  if(banner){c.save();c.globalAlpha=Math.min(1,banner.life*2);label(c,banner.text,W/2,H*0.4,54,'#ffe14d');c.restore();}
}
function drawHud(c,p,t){
  var v=p.view,x=v.x0+12,y=10,col=p.i?'#7fe3ff':'#ffe14d';
  c.font='800 17px "Baloo 2", sans-serif';var nw=Math.min(150,c.measureText(p.def.name).width+20);
  pill(c,x,y,nw,30,col);c.fillStyle=INK;c.textAlign='left';c.fillText(p.def.name.length>14?p.def.name.slice(0,14):p.def.name,x+10,y+21,nw-16);
  if(state==='storm'||state==='end'){
    var bx=x+nw+8,bw=150;c.beginPath();c.roundRect(bx,y,bw,30,15);fs(c,'#fff',3);
    var fr=clamp(p.pct,0,1);if(fr>0.02){c.save();c.beginPath();c.roundRect(bx+2,y+2,bw-4,26,13);c.clip();
      c.fillStyle=p.fell!==null?'#ff5a4e':fr<0.6?'#ffb020':'#38c172';c.fillRect(bx+2,y+2,(bw-4)*fr,26);c.restore();}
    c.font='15px Bungee, "Arial Black", sans-serif';c.textAlign='center';c.fillStyle=INK;c.fillText(p.fell!==null?'KAPUTT':'Burg '+Math.round(fr*100)+' %',bx+bw/2,y+21);
  }
  // Klotz-Leiste
  var sw=48,sh=44,px0=v.x0+v.w-12-4*(sw+6)+6;
  ORDER.forEach(function(type,j){var bx=px0+j*(sw+6),n=p.left[type],sel=p.sel===j&&blocksLeft(p)>0;
    c.beginPath();c.roundRect(bx,y,sw,sh,10);fs(c,sel?col:(n>0?'#fffaf0':'#d9d6cf'),3);
    var tt=BT[type],k=Math.min((sw-12)/(tt.w*40),(sh-20)/(tt.h*40),1),dw=tt.w*40*k,dh=tt.h*40*k;
    c.globalAlpha=n>0?1:0.35;c.drawImage(tex(type,40),bx+sw/2-dw/2,y+4+(sh-20)/2-dh/2+2,dw,dh);c.globalAlpha=1;
    c.font='800 14px "Baloo 2", sans-serif';c.textAlign='center';c.fillStyle=INK;c.fillText('×'+n,bx+sw/2,y+sh-5);
    palRects.push({x:bx,y:y,w:sw,h:sh,p:p.i,j:j});});
  if(state==='build'&&p.done){label(c,'Fertig! ✓',v.x0+v.w/2,y+90,22,'#38c172');}
  if(p.fell!==null&&state!=='storm'){label(c,'EINGESTÜRZT',v.x0+v.w/2,y+90,22,'#ff5a4e');}
}
function drawTop(c,t){
  var txt=null;
  if(state==='build')txt='🔨 Bauzeit '+fmt(phaseT);
  else if(state==='storm')txt=STORM[stormLv].e+' '+STORM[stormLv].n+' '+fmt(STORM_T-stormT);
  if(!txt)return;
  c.font='800 20px "Baloo 2", sans-serif';var w=c.measureText(txt).width+30,x=W/2-w/2,y=mode===2?62:58;
  pill(c,x,y,w,34,state==='build'&&phaseT<10?'#ff9f9f':'#fffaf0');c.fillStyle=INK;c.textAlign='center';c.fillText(txt,W/2,y+24);
  if(state==='storm'){var S=Math.abs(wind),ww=Math.round(clamp(S/(STORM[2].k*1.3),0,1)*5)+1;
    c.font='16px Bungee, "Arial Black", sans-serif';var arrow=wind>=0?'→':'←',bars='';for(var i=0;i<6;i++)bars+=i<ww?'▮':'▯';
    label(c,'Wind '+arrow+' '+bars,W/2,y+58,16,'#fff');}
}
function onLowQuality(){g=setup(cv,W,H);bgCache=null;texCache={};}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){bgCache=null;});

/* ---------- Ton ---------- */
var AC=null,muted=false,NOISE=null,windNode=null;
function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f0,f1,type,dur,vol,delay){
  var n=AC.currentTime+(delay||0),o=AC.createOscillator(),gn=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,n);o.frequency.exponentialRampToValueAtTime(f1,n+dur);
  gn.gain.setValueAtTime(vol,n);gn.gain.exponentialRampToValueAtTime(0.0001,n+dur);
  o.connect(gn);gn.connect(AC.destination);o.start(n);o.stop(n+dur+0.02);}
function noiseBuf(){if(!NOISE){NOISE=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);var d=NOISE.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return NOISE;}
function noise(dur,vol,freq){
  var n=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain();
  s.buffer=noiseBuf();f.type='lowpass';f.frequency.value=freq;gn.gain.setValueAtTime(vol,n);gn.gain.exponentialRampToValueAtTime(0.0001,n+dur);
  s.connect(f);f.connect(gn);gn.connect(AC.destination);s.start(n);s.stop(n+dur);}
function sfx(k){if(!AC||muted)return;
  if(k==='tick')tone(700,700,'square',0.04,0.03);
  else if(k==='hepp')tone(300,620,'triangle',0.14,0.06);
  else if(k==='thud'){noise(0.12,0.2,500);tone(140,70,'triangle',0.12,0.08);}
  else if(k==='no')tone(220,160,'square',0.15,0.04);
  else if(k==='ok')[523,784].forEach(function(f,i){tone(f,f,'triangle',0.12,0.06,i*0.08);});
  else if(k==='beep')tone(880,880,'square',0.1,0.04);
  else if(k==='splash'){noise(0.3,0.15,2200);tone(500,200,'sine',0.2,0.04);}
  else if(k==='crash'){noise(0.8,0.3,600);tone(110,40,'sawtooth',0.6,0.05);}
  else if(k==='win'){[523,659,784,1046,1318].forEach(function(f,i){tone(f,f,'triangle',0.22,0.07,i*0.12);});}}
function windSound(on){
  if(!AC)return;
  if(on&&!muted&&!windNode){var s=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain();
    s.buffer=noiseBuf();s.loop=true;f.type='bandpass';f.frequency.value=420;f.Q.value=0.8;gn.gain.value=0;
    s.connect(f);f.connect(gn);gn.connect(AC.destination);s.start();windNode={s:s,f:f,g:gn};}
  if(!on&&windNode){try{windNode.s.stop();}catch(e){}windNode=null;}
}
function windTick(){if(!windNode||!AC)return;var I=Math.min(1.2,Math.abs(wind)/4.6),n=AC.currentTime;
  windNode.g.gain.setTargetAtTime(0.05+0.22*I,n,0.15);windNode.f.frequency.setTargetAtTime(300+500*I,n,0.2);}
$('mute').onclick=function(){muted=!muted;$('mute').textContent=muted?'🔇 Ton aus':'🔊 Ton an';initAudio();
  if(muted)windSound(false);else if(state==='storm'&&!paused)windSound(true);};

/* ---------- Schleife ---------- */
showBuilder();
var last=performance.now();
function loop(now){var raw=(now-last)/1000,dt=Math.min(0.05,raw);last=now;var t=now/1000;perfTick(raw);
  if(!$('builder').hidden)drawPreview(t);
  if(!$('game').hidden&&players.length){update(dt);render(t);windTick();}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
