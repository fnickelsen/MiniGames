<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="Monster-Torwand">
<title>Fietes Monster-Torwandschießen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Bungee&display=swap">
<style>
/* Layout: Stadion-Rasen – Sticker-Karten mit harten Schatten auf gemähtem Grün, die Torwand ist die Hauptbühne */
:root{
  --lawn:#bfe8a6; --dots:rgba(20,70,30,.14); --ink:#1d1a2b; --paper:#fffaf0;
  --grape:#6c3fd1; --go:#38c172; --sky:#3fb6ff; --white:#ffffff; --red:#ff5a4e;
  --p1:#ffe14d; --p2:#7fe3ff; --gold:#ffd23f;
  --display:'Bungee','Arial Black',Impact,system-ui,sans-serif;
  --body:'Baloo 2','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;min-height:100%}
*{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
html,body{
  background-color:var(--lawn);color:var(--ink);
  background-image:linear-gradient(90deg,rgba(255,255,255,.18) 50%,transparent 50%),radial-gradient(circle at 2px 2px,var(--dots) 2px,transparent 2.6px);
  background-size:120px 100%,28px 28px;background-attachment:fixed;
}
body{
  font-family:var(--body);font-size:18px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 48px;
}
.wrap{max-width:1060px;margin:0 auto;display:grid;gap:20px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,44px);line-height:1;margin:0;text-wrap:balance}
h1 span{color:var(--white);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.steps{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0}
.steps li{font-weight:800;font-size:16px;padding:3px 14px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);opacity:.5}
.steps li.on{opacity:1;background:var(--grape);color:var(--white)}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink)}
.builder{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
@media (max-width:820px){.builder{grid-template-columns:minmax(0,1fr)}}
.preview{padding:16px;display:grid;gap:10px}
@media (min-width:821px){.preview{position:sticky;top:12px}}
#pv{display:block;width:100%;height:auto;border:3px solid var(--ink);border-radius:14px}
label{font-weight:800}
.txt-in{font:inherit;font-weight:800;font-size:20px;padding:5px 14px;border:3px solid var(--ink);border-radius:12px;background:var(--white);color:var(--ink);width:100%;box-sizing:border-box}
.panel{padding:18px 20px;display:grid;gap:16px;min-width:0}
.flat{padding:0}
h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0;text-wrap:balance}
.row{display:grid;gap:6px}
.lab{font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:700;font-size:17px;padding:3px 14px;border:3px solid var(--ink);border-radius:12px;background:var(--white);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.chip.sel{background:var(--grape);color:var(--white)}
.chip.sw{width:42px;height:42px;padding:0;border-radius:50%}
.chip.sw.sel{outline:4px solid var(--grape);outline-offset:3px}
.chip:disabled{opacity:.25;cursor:not-allowed}
:focus-visible{outline:4px solid var(--sky);outline-offset:2px}
.sep{border:0;border-top:3px dashed rgba(29,26,43,.2);margin:4px 0;width:100%}
.btn{font-family:var(--display);font-weight:400;font-size:18px;padding:10px 18px;border:3px solid var(--ink);border-radius:14px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);background:var(--white);color:var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.go{background:var(--go)}
.btn.small{font-size:15px;padding:6px 14px;box-shadow:3px 3px 0 var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
.actions #go{margin-left:auto}
.who{font-family:var(--display);font-size:15px;justify-self:start;padding:2px 12px;border:3px solid var(--ink);border-radius:999px;background:var(--p1)}
.who.p2{background:var(--p2)}
.game{display:grid;gap:12px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.score{padding:6px 14px;display:grid;gap:4px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:3px 8px;border-radius:12px;border:3px solid transparent}
.prow.on{border-color:var(--ink);background:var(--p1)}
.prow.on.p2{background:var(--p2)}
.pname{display:flex;align-items:center;gap:8px;min-width:0;font-weight:800;font-size:18px}
.pname .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.jdot{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink);flex:none}
.slots{display:flex;gap:5px}
.slot{width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:14px;background:var(--white);font-variant-numeric:tabular-nums}
.slot.hit{background:var(--go);color:var(--white)}
.slot.miss{background:#d8d4cc;color:#6b6778}
.slot.next{border-style:dashed}
.total{font-family:var(--display);font-size:28px;min-width:54px;text-align:right;font-variant-numeric:tabular-nums}
.total small{font-family:var(--body);font-size:13px;font-weight:800;display:block;line-height:1;opacity:.7}
@media (max-width:640px){.slot{width:22px;height:22px;font-size:11px;border-width:2px}.slots{gap:3px}.pname{font-size:15px}.total{font-size:22px}}
.stage{position:relative;border:3px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:6px 6px 0 var(--ink);background:#1d3d6b;justify-self:center;width:100%;box-sizing:border-box}
#cv{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
.overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:grid;place-items:center;background:rgba(29,26,43,.55);padding:12px}
.ocard{padding:16px 22px;width:min(460px,100%);box-sizing:border-box;display:grid;gap:10px;text-align:center}
.ocard h2{font-size:26px}
.ocard p{margin:0;font-weight:700}
.ocard .actions{justify-content:center}
.ocard .actions #go{margin-left:0}
@media (max-width:700px){.overlay{position:static;background:none;padding:12px 0 0}}
.pad{display:flex;align-items:center;gap:12px}
.mid{flex:1;min-width:0;display:grid;gap:8px;justify-items:center;align-content:center}
.hint{margin:0;text-align:center;font-weight:800;font-size:18px}
.stopbtn{min-width:240px;min-height:72px;font-size:26px;background:var(--red);color:var(--white);touch-action:none}
.tbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tbar .btn.small{font-size:13px;padding:5px 10px}
.foot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
body.playing{padding-block:8px 4px}
body.playing .top{display:none}
.hall{font-family:var(--display);font-size:14px;padding:4px 12px;border:3px solid var(--ink);border-radius:12px;background:var(--white);color:var(--ink);text-decoration:none;box-shadow:3px 3px 0 var(--ink)}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Fietes <span>Monster-Torwand</span></h1>
    <a class="hall" href="index.html">← Spielehalle</a>
    <ol class="steps" id="steps"><li class="on">1 Monster</li><li>2 Schießen</li></ol>
  </header>

  <section id="builder" class="builder">
    <div class="card preview">
      <canvas id="pv" width="440" height="300" aria-label="Vorschau von deinem Monster"></canvas>
      <label for="name">Wie heißt dein Monster?</label>
      <input id="name" class="txt-in" maxlength="14" autocomplete="off">
    </div>
    <div class="card panel">
      <div id="modebox" class="panel flat">
        <div class="row">
          <div class="lab">Wer schießt?</div>
          <div class="chips"><button type="button" id="m1" class="chip sel">Allein</button><button type="button" id="m2" class="chip">Zu zweit, abwechselnd</button></div>
        </div>
        <div class="row">
          <div class="lab">Wie schießt du?</div>
          <div class="chips"><button type="button" id="s0" class="chip">👆 Wischen</button><button type="button" id="s1" class="chip">🎯 Zielkreuz stoppen</button></div>
        </div>
        <div class="row">
          <div class="lab">Wie gut ist der Torwart?</div>
          <div class="chips"><button type="button" id="d0" class="chip">Leicht</button><button type="button" id="d1" class="chip sel">Normal</button><button type="button" id="d2" class="chip">Schwer</button></div>
        </div>
        <hr class="sep">
      </div>
      <span id="who" class="who" hidden>Spieler 1</span>
      <h2>Bau dein Monster!</h2>
      <div id="rows" class="panel flat" style="gap:14px"></div>
      <hr class="sep">
      <div class="row">
        <div class="lab">Trikotfarbe</div>
        <div class="chips" id="jrow"></div>
      </div>
      <div class="actions">
        <button id="back1" class="btn" hidden>← Spieler 1</button>
        <button id="rand" class="btn small">🎲 Zufalls-Monster</button>
        <button id="go" class="btn go">Los geht's!</button>
      </div>
    </div>
  </section>

  <section id="game" class="game" hidden>
    <div class="card score" id="score"></div>
    <div class="stage">
      <canvas id="cv" width="1000" height="620" aria-label="Torwand"></canvas>
      <div id="overlay" class="overlay" hidden></div>
    </div>
    <div class="pad">
      <div class="mid" id="tmid">
        <p class="hint" id="hint"></p>
        <button id="stop" class="btn stopbtn" hidden>STOPP! 🎯</button>
      </div>
    </div>
    <div class="foot">
      <button id="quit" class="btn small">← Zum Monster</button>
      <button id="mute" class="btn small">🔊 Ton an</button>
    </div>
  </section>
</div>

<script>
/* ===== iPad-Grundlagen (Zielgerät: iPad Air 2, iOS 15, Safari) =====
   - Touch erkennen, Bildschirm einpassen, kein Scrollen/Zoomen im Spiel
   - Ton unter iOS freischalten (braucht ein echtes Antippen)
   - Bildqualität automatisch senken, wenn das Gerät zu langsam ist */
var DPR_MAX=2;
var IS_TOUCH=('ontouchstart' in window)||(navigator.maxTouchPoints||0)>0;
if(IS_TOUCH)document.documentElement.classList.add('is-touch');
function gameOn(){var g=document.getElementById('game');return !!g&&!g.hidden;}
function fitStage(){
  var game=document.getElementById('game'),stage=document.querySelector('.stage'),c=document.getElementById('cv');
  if(!game||game.hidden||!stage||!c)return;
  stage.style.maxWidth='';
  var other=game.getBoundingClientRect().height-stage.getBoundingClientRect().height;
  var avail=window.innerHeight-other-22;
  stage.style.maxWidth=Math.max(300,Math.floor(avail*c.width/c.height))+'px';
}
function enterGameScreen(){document.body.classList.add('playing');window.scrollTo(0,0);fitStage();requestAnimationFrame(fitStage);setTimeout(fitStage,400);}
function leaveGameScreen(){document.body.classList.remove('playing');var s=document.querySelector('.stage');if(s)s.style.maxWidth='';window.scrollTo(0,0);}
window.addEventListener('resize',fitStage);
window.addEventListener('orientationchange',function(){setTimeout(fitStage,400);});
var audioUnlocked=false;
function unlockAudio(){
  if(typeof initAudio!=='function')return;
  initAudio();
  if(audioUnlocked||!AC)return;
  try{var b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0);audioUnlocked=true;}catch(e){}
}
document.addEventListener('touchend',unlockAudio,true);
document.addEventListener('click',unlockAudio,true);
document.addEventListener('touchmove',function(e){
  if(gameOn()&&!(e.target&&e.target.closest&&e.target.closest('.ocard,.rcard')))e.preventDefault();
},{passive:false});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
var perfN=0,perfSum=0,lowQ=false;
function perfTick(raw){
  if(lowQ||!gameOn()||document.hidden||raw>0.25)return;
  perfN++;perfSum+=raw;
  if(perfN>=90){
    if(perfSum/perfN>0.026){lowQ=true;DPR_MAX=1;if(typeof onLowQuality==='function')onLowQuality();}
    perfN=0;perfSum=0;
  }
}
function compactControls(){
  if(!IS_TOUCH)return;
  var mid=document.getElementById('tmid'),foot=document.querySelector('.foot');if(!mid||!foot)return;
  var bar=document.createElement('div');bar.className='tbar';
  while(foot.firstElementChild)bar.appendChild(foot.firstElementChild);
  mid.appendChild(bar);foot.hidden=true;
}
compactControls();
/* ===== Ende iPad-Grundlagen ===== */


/* Kompatibilität: ältere Safari-Versionen (iPadOS < 16) kennen roundRect nicht */
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.max(0,Math.min(typeof r==='number'?r:(r&&r[0])||0,Math.abs(w)/2,Math.abs(h)/2));
    this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};
}
/* Fehler sichtbar machen, falls doch etwas schiefgeht (hilft auf dem iPad ohne Entwicklerwerkzeuge) */
window.addEventListener('error',function(e){
  var b=document.getElementById('errbox');
  if(!b){b=document.createElement('div');b.id='errbox';
    b.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#fffaf0;color:#1d1a2b;border:3px solid #1d1a2b;border-radius:14px;padding:10px 14px;font:600 15px/1.35 system-ui,sans-serif;box-shadow:4px 4px 0 #1d1a2b';
    document.body.appendChild(b);}
  b.textContent='Ups, da ist etwas kaputtgegangen. Bitte diesen Text an Claude schicken: '+e.message+' (Zeile '+e.lineno+')';
});

const INK='#1d1a2b', TAU=Math.PI*2;
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shade(hex,a){let n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  const f=v=>Math.round(a<0?v*(1+a):v+(255-v)*a);return `rgb(${f(r)},${f(g)},${f(b)})`;}
function P(c,p){c.beginPath();c.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);c.closePath();}
function fs(c,fill,lw=3){c.fillStyle=fill;c.fill();c.lineWidth=lw;c.strokeStyle=INK;c.stroke();}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,TAU);}
function setup(cv,w,h){const d=Math.min(DPR_MAX,window.devicePixelRatio||1);cv.width=w*d;cv.height=h*d;const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);return x;}

/* ---------- Monster ---------- */
const COLORS=['#38c172','#ff5a4e','#3fb6ff','#a66bff','#ff9f1c','#ff6fb5','#2ec4b6','#8d6e63'];
const OPTS={
  color:COLORS.map(v=>({v})),
  eyes:[{v:1,l:'1'},{v:2,l:'2'},{v:3,l:'3'},{v:5,l:'5'}],
  horns:[{v:'none',l:'Keine'},{v:'small',l:'Kleine'},{v:'big',l:'Riesig'},{v:'antenna',l:'Antennen'}],
  mouth:[{v:'smile',l:'Lächeln'},{v:'teeth',l:'Zähne'},{v:'fangs',l:'Riesenzähne'},{v:'tongue',l:'Zunge raus'}],
  arms:[{v:2,l:'2 Arme'},{v:4,l:'4 Arme'}],
  tail:[{v:'none',l:'Keiner'},{v:'tail',l:'Puschel'},{v:'spiky',l:'Stachel'}],
  wings:[{v:false,l:'Keine'},{v:true,l:'Flügel'}],
  pattern:[{v:'none',l:'Keins'},{v:'spots',l:'Punkte'},{v:'stripes',l:'Streifen'}],
};
const ROWS=[['color','Farbe'],['eyes','Augen'],['horns','Hörner'],['mouth','Mund'],['arms','Arme'],['tail','Schwanz'],['wings','Flügel'],['pattern','Muster']];
function randMonster(except){const m={};for(const k in OPTS)m[k]=pick(OPTS[k]).v;
  if(except){m.color=pick(COLORS.filter(c=>!except.includes(c)));}return m;}

function arm(c,x1,y1,x2,y2,col){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.lineWidth=10;c.strokeStyle=INK;c.stroke();
  c.lineWidth=5;c.strokeStyle=col;c.stroke();circ(c,x2,y2,4.5);fs(c,col,2.5);}
const EYES={1:[[10,-8,11]],2:[[2,-10,8],[18,-8,7]],3:[[-6,-12,7],[10,-15,7.5],[22,-3,6]],5:[[-10,-12,5.5],[1,-19,6],[13,-13,6.5],[23,-3,5],[5,-2,4.5]]};

function drawMonster(c,m,x,y,s,t){
  const col=m.color,dk=shade(col,-0.3),lt=shade(col,0.4);
  c.save();c.translate(x,y+Math.sin(t*7)*1.2);c.scale(s,s);c.lineJoin='round';c.lineCap='round';
  if(m.wings){const f=Math.sin(t*16)*0.4;c.save();c.translate(-8,-14);c.rotate(-0.5+f);
    c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(-20,-36,-46,-28);c.quadraticCurveTo(-34,-16,-40,-4);c.quadraticCurveTo(-22,-8,0,0);c.closePath();
    fs(c,'rgba(255,255,255,.9)',2.5);c.restore();}
  if(m.tail!=='none'){const w=Math.sin(t*6)*5;c.beginPath();c.moveTo(-22,12);c.quadraticCurveTo(-46,18+w,-50,-4+w);
    c.lineWidth=11;c.strokeStyle=INK;c.stroke();c.lineWidth=5;c.strokeStyle=col;c.stroke();
    if(m.tail==='spiky'){P(c,[-57,-2+w,-50,-18+w,-43,-2+w]);fs(c,'#fff1c9',2.5);}
    else{circ(c,-50,-5+w,7);fs(c,dk,2.5);}}
  if(m.arms===4)arm(c,-10,4,-28,-20+Math.sin(t*9)*7,col);
  const body=()=>{c.beginPath();c.ellipse(0,0,30,28,0,0,TAU);};
  body();c.fillStyle=col;c.fill();
  c.save();body();c.clip();
  c.fillStyle=lt;c.beginPath();c.ellipse(12,16,18,14,0,0,TAU);c.fill();
  c.fillStyle=dk;
  if(m.pattern==='spots')[[-15,-9,6],[-19,9,4],[-4,-21,3.5],[-8,14,3]].forEach(([a,b,r])=>{circ(c,a,b,r);c.fill();});
  if(m.pattern==='stripes')for(let i=-30;i<6;i+=11){P(c,[i,-30,i+5,-30,i-1,30,i-6,30]);c.fill();}
  c.restore();
  body();c.lineWidth=3;c.strokeStyle=INK;c.stroke();
  arm(c,6,28,36,33,col);
  const hc='#fff1c9';
  if(m.horns==='small'){P(c,[-15,-23,-9,-38,-4,-26]);fs(c,hc,2.5);P(c,[5,-27,12,-41,16,-24]);fs(c,hc,2.5);}
  if(m.horns==='big'){c.beginPath();c.moveTo(-20,-18);c.quadraticCurveTo(-34,-42,-14,-54);c.quadraticCurveTo(-22,-40,-6,-26);c.closePath();fs(c,hc,2.5);
    c.beginPath();c.moveTo(4,-27);c.quadraticCurveTo(10,-52,30,-54);c.quadraticCurveTo(18,-42,18,-20);c.closePath();fs(c,hc,2.5);}
  if(m.horns==='antenna'){const w=Math.sin(t*5)*3;[[-6,-27,-13+w,-48],[8,-27,15+w,-48]].forEach(([a,b,cx,cy])=>{
    c.beginPath();c.moveTo(a,b);c.lineTo(cx,cy);c.lineWidth=3;c.strokeStyle=INK;c.stroke();circ(c,cx,cy,5);fs(c,'#ffe14d',2.5);});}
  const blink=((t*0.7)%3)<0.09;
  for(const [ex,ey,r] of EYES[m.eyes]){circ(c,ex,ey,r);fs(c,'#fff',2.5);
    if(blink){c.beginPath();c.moveTo(ex-r,ey);c.lineTo(ex+r,ey);c.stroke();}
    else{circ(c,ex+r*0.35,ey+r*0.1,r*0.5);c.fillStyle=INK;c.fill();circ(c,ex+r*0.2,ey-r*0.15,r*0.17);c.fillStyle='#fff';c.fill();}}
  c.lineWidth=2.5;
  if(m.mouth==='smile'){c.beginPath();c.arc(16,3,9,0.25,Math.PI-0.7);c.lineWidth=3;c.strokeStyle=INK;c.stroke();}

function leg(c,hx,hy,a,sock){

}
function drawFigure(c,m,jc,num,x,y,k,face,t,o){
  o=o||{};
  c.save();c.translate(x,y);c.scale(k*face,k);c.lineJoin='round';c.lineCap='round';
  c.fillStyle='rgba(10,50,10,.25)';c.beginPath();c.ellipse(0,1,22,5,0,0,TAU);c.fill();
  var run=o.run?Math.sin(t*18)*0.6:0;
  leg(c,-6,-9,run,'#f4f4f8');
  leg(c,6,-9,(o.legA!==undefined?o.legA:-run),'#f4f4f8');
  if(o.gloves){[-1,1].forEach(function(s){
    c.beginPath();c.moveTo(s*13,-40);c.lineTo(s*24,-64);c.lineWidth=9;c.strokeStyle=INK;c.stroke();c.lineWidth=5.5;c.strokeStyle=jc;c.stroke();
    circ(c,s*25,-67,7);fs(c,'#c6ff3d',2.5);});}
  P(c,[-15,-45,15,-45,25,-35,19,-29,15,-34,14,-14,-14,-14,-15,-34,-19,-29,-25,-35]);fs(c,jc,2.5);
  c.fillStyle=jText(jc)===INK?'rgba(29,26,43,.25)':'rgba(255,255,255,.55)';c.fillRect(-14,-21,28,3);
  c.save();c.scale(face,1);c.font='800 13px "Baloo 2", "Trebuchet MS", sans-serif';c.textAlign='center';c.textBaseline='middle';
  c.fillStyle=jText(jc);c.fillText(num,0,-28);c.restore();

function drawBall(c,x,y,r,rot){
  circ(c,x,y,r);c.fillStyle='#ffffff';c.fill();
  c.save();c.beginPath();c.arc(x,y,r,0,TAU);c.clip();
  c.fillStyle=INK;
  var pent=function(px,py,pr,a){c.beginPath();for(var i=0;i<5;i++){var b=a+i*TAU/5;c.lineTo(px+Math.cos(b)*pr,py+Math.sin(b)*pr);}c.closePath();c.fill();};
  pent(x+Math.cos(rot)*r*0.15,y+Math.sin(rot)*r*0.15,r*0.32,rot);

  c.restore();
  circ(c,x,y,r);c.lineWidth=Math.max(1.5,r*0.07);c.strokeStyle=INK;c.stroke();

/* ---------- Spielzustand ---------- */
var players=[],shotIdx=0,state='idle',stateT=0,ball=null,keeper=null,kicker={x:300,legA:0},aim=null,swipe=null,banner=null,fx=[],best=0,lastRes=null,rings=[];
function curP(){return players[shotIdx%players.length];}
function shotNo(){return Math.floor(shotIdx/players.length)+1;}
function startGame(){
  players=[];for(var i=0;i<mode;i++){var d=PLAYERS_DEF[i];players.push({name:d.name,m:d.m,jersey:d.jersey,num:i===0?'10':'7',res:[]});}
  var km=randMonster();
  keeper={m:km,name:pick(KEEPER_NAMES),x:0,dir:Math.random()<0.5?1:-1,sp:DIFF[diff].sp,jumpY:0,jumpT:-1,cheer:0,decided:false};
  shotIdx=0;fx=[];rings=[];banner=null;
  $('overlay').hidden=true;$('builder').hidden=true;$('game').hidden=false;setStep(2);
  buildScore();nextTurn();enterGameScreen();
}
function resetBall(){ball={x:0,y:BR,z:0,vx:0,vy:0,vz:0,rot:0,gone:false,flying:false,crossedG:false,crossedW:false};}
function nextTurn(){
  resetBall();kicker.x=300;kicker.legA=0;swipe=null;aim=null;
  state='intro';stateT=1.1;keeper.cheer=0;keeper.jumpT=-1;keeper.jumpY=0;keeper.decided=false;
  showBanner(curP().name+' ist dran!','Schuss '+shotNo()+' von '+SHOTS,1.1);
  updScore();setHint();
}
function beginAim(){
  state='aim';
  if(shootMode===1){aim={phase:0,x:-1.6,y:1.0,dx:1,dy:1};}
  setHint();
}
function setHint(){
  var stop=$('stop'),h=$('hint');
  if(state==='intro'){h.textContent='Gleich geht\'s los …';stop.hidden=true;return;}
  if(state!=='aim'){stop.hidden=true;h.textContent='';return;}
  if(shootMode===0){stop.hidden=true;h.textContent='👆 Wisch vom Ball zum Loch! Schneller wischen = höher schießen.';}
  else{stop.hidden=false;h.textContent=aim&&aim.phase===1?'Und jetzt die Höhe! '+(IS_TOUCH?'':'(Leertaste)'):'Stopp das Zielkreuz über dem Loch! '+(IS_TOUCH?'':'(Leertaste)');}
}
function buildScore(){
  var el=$('score');el.innerHTML='';
  players.forEach(function(p,i){
    var r=document.createElement('div');r.className='prow'+(i===1?' p2':'');r.id='prow'+i;
    var n=document.createElement('div');n.className='pname';
    var d=document.createElement('span');d.className='jdot';d.style.background=p.jersey;
    var tx=document.createElement('span');tx.className='tx';tx.textContent=p.name;n.appendChild(d);n.appendChild(tx);
    var sl=document.createElement('div');sl.className='slots';
    for(var k=0;k<SHOTS;k++){var s=document.createElement('span');s.className='slot';s.id='sl'+i+'_'+k;sl.appendChild(s);}
    var tot=document.createElement('div');tot.className='total';tot.id='tot'+i;
    r.appendChild(n);r.appendChild(sl);r.appendChild(tot);el.appendChild(r);
  });
}
function sum(a){return a.reduce(function(x,y){return x+y;},0);}
function updScore(){
  var ci=shotIdx%players.length;
  players.forEach(function(p,i){
    $('prow'+i).classList.toggle('on',state!=='over'&&i===ci);
    for(var k=0;k<SHOTS;k++){var s=$('sl'+i+'_'+k),v=p.res[k];
      s.className='slot'+(v===undefined?((i===ci&&k===p.res.length&&state!=='over')?' next':''):(v>0?' hit':' miss'));
      s.textContent=v===undefined?'':(v>0?String(v):'×');}
    $('tot'+i).innerHTML='';$('tot'+i).appendChild(document.createTextNode(String(sum(p.res))));
    if(mode===1&&best>0){var sm=document.createElement('small');sm.textContent='Rekord '+best;$('tot'+i).appendChild(sm);}
  });
}

/* ---------- Schießen ---------- */
function kickAt(tx,ty,sd){
  if(state!=='aim')return;
  var hs=1+clamp(ty,0,2.2)*0.7;tx+=gauss()*sd*hs;ty+=gauss()*sd*hs;
  ball.target={x:tx,y:ty};
  state='runup';stateT=0.42;$('stop').hidden=true;$('hint').textContent='';
}
function launch(){
  var tx=ball.target.x,ty=ball.target.y,T=0.6+0.05*clamp(ty,0,2.5);
  ball.vz=D/T;ball.vx=tx/T;ball.vy=(ty-BR+0.5*GRAV*T*T)/T;ball.flying=true;
  state='flight';stateT=4;sfx('kick');
}
function finishShot(points,text,col){
  if(state==='result')return;
  curP().res.push(points);
  state='result';stateT=1.7;
  showBanner(text,points>0?('+'+points+(points===1?' Punkt':' Punkte')):'',1.7,col);
  if(points>0){sfx('goal');var p=proj(ball.x,ball.y,D);for(var i=0;i<46;i++){var a=Math.random()*TAU,v=120+Math.random()*260;
    fx.push({x:p.x,y:p.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-160,life:1.4,max:1.4,col:pick(['#ffe14d','#ff5a4e','#3fb6ff','#38c172','#ff6fb5',curP().jersey]),r:Math.random()*TAU});}}
  else if(text.indexOf('Gehalten')===0){keeper.cheer=1.5;sfx('save');}
  else sfx(text.indexOf('Rand')>=0||text.indexOf('Wand')>=0?'clang':'miss');
  updScore();
}
function afterResult(){
  shotIdx++;
  if(shotIdx>=SHOTS*players.length){endGame();return;}
  nextTurn();
}
function endGame(){
  state='over';updScore();setHint();sfx('whistle');
  var card=document.createElement('div');card.className='card ocard';
  var h=document.createElement('h2'),p=document.createElement('p');
  if(mode===1){var s=sum(players[0].res),rec=s>best&&best>0;
    h.textContent=s>=20?'Super-Schütze! 🏆':s>=10?'Klasse geschossen! ⚽':'Gut gemacht! ⚽';
    p.textContent=players[0].name+' hat '+s+' von '+(SHOTS*5)+' Punkten geholt.'+(rec?' Neuer Rekord! 🎉':'');
    best=Math.max(best,s);}
  else{var a=sum(players[0].res),b=sum(players[1].res);
    h.textContent=a===b?'Unentschieden! 🤝':(a>b?players[0].name:players[1].name)+' gewinnt! 🏆';
    p.textContent=players[0].name+' '+a+' : '+b+' '+players[1].name;}
  card.appendChild(h);card.appendChild(p);
  var ac=document.createElement('div');ac.className='actions';
  var b1=document.createElement('button');b1.className='btn';b1.textContent='Monster ändern';b1.onclick=function(){$('quit').click();};
  var b2=document.createElement('button');b2.className='btn go';b2.textContent='Nochmal schießen!';b2.onclick=function(){startGame();};
  ac.appendChild(b1);ac.appendChild(b2);card.appendChild(ac);
  var o=$('overlay');o.innerHTML='';o.appendChild(card);o.hidden=false;updScore();
}
$('quit').onclick=function(){state='idle';$('game').hidden=true;$('overlay').hidden=true;$('builder').hidden=false;leaveGameScreen();cur=0;showBuilder();};

function stopAim(){
  if(state!=='aim'||shootMode!==1||!aim)return;
  if(aim.phase===0){aim.phase=1;aim.y=0.05;aim.dy=1;setHint();sfx('tick');}
  else kickAt(aim.x,aim.y,0.03);
}
$('stop').addEventListener('pointerdown',function(e){e.preventDefault();stopAim();});
addEventListener('keydown',function(e){
  if($('game').hidden||(e.target&&e.target.tagName==='INPUT'))return;
  if(e.code==='Space'||e.code==='Enter'||e.code==='NumpadEnter'){e.preventDefault();if(!e.repeat)stopAim();}
});
function cvPos(e){var r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height,t:performance.now()/1000};}
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();initAudio();
  if(state!=='aim')return;
  if(shootMode===1){stopAim();return;}
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  var p=cvPos(e);swipe={id:e.pointerId,pts:[p]};
});
cv.addEventListener('pointermove',function(e){if(swipe&&e.pointerId===swipe.id){swipe.pts.push(cvPos(e));if(swipe.pts.length>40)swipe.pts.shift();}});
function endSwipe(e){
  if(!swipe||e.pointerId!==swipe.id)return;
  var pts=swipe.pts,end=cvPos(e);pts.push(end);swipe=null;
  if(state!=='aim')return;
  var st=pts[0];for(var i=pts.length-1;i>=0;i--){if(end.t-pts[i].t>0.25){st=pts[i];break;}st=pts[i];}
  var dx=end.x-st.x,dy=end.y-st.y,dist=Math.hypot(dx,dy),dur=Math.max(0.05,end.t-st.t);
  if(dist<35){showBanner('Wisch kräftiger! 👆','',1,'#ffffff');return;}
  if(dy>-0.25*dist){showBanner('Nach oben wischen! ⬆️','',1,'#ffffff');return;}
  var tgt;
  var wallBottom=proj(0,0,D).y;
  if(end.y<wallBottom+10){tgt=toWall(end.x,end.y);}
  else{var speed=dist/dur,L=clamp(speed*0.28,80,760),bp=proj(0,BR,0);tgt=toWall(bp.x+dx/dist*L,bp.y+dy/dist*L);}
  kickAt(tgt.x,tgt.y,0.06);
}
cv.addEventListener('pointerup',endSwipe);cv.addEventListener('pointercancel',function(){swipe=null;});

/* ---------- Ablauf je Bild ---------- */
function update(dt){
  if(state==='idle'||state==='over')return;
  stateT-=dt;
  if(banner){banner.t-=dt;if(banner.t<=0)banner=null;}
  fx.forEach(function(f){f.life-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=360*dt;f.r+=dt*8;});fx=fx.filter(function(f){return f.life>0;});
  rings.forEach(function(r){r.life-=dt;});rings=rings.filter(function(r){return r.life>0;});
  var K=keeper,Dp=DIFF[diff];
  if(K.cheer>0)K.cheer-=dt;
  // Torwart läuft hin und her
  if(state==='flight'&&Dp.react>0&&ball.vz>0&&ball.z<ZG){
    var px=ball.x+ball.vx*(ZG-ball.z)/ball.vz,dx=px-K.x;K.x+=clamp(dx,-Dp.react*dt,Dp.react*dt);
  } else if(state!=='result'||K.cheer<=0){
    K.x+=K.dir*K.sp*dt;
    if(K.x>1.2){K.x=1.2;K.dir=-1;}if(K.x<-1.2){K.x=-1.2;K.dir=1;}
    if(Math.random()<0.45*dt){K.dir*=-1;K.sp=Dp.sp*(0.7+Math.random()*0.6);}
  }
  if(state==='flight'&&!K.decided&&ball.vz>0){var tt=(ZG-ball.z)/ball.vz;if(tt<0.3){K.decided=true;if(Math.random()<Dp.jump)K.jumpT=0;}}
  if(K.jumpT>=0){K.jumpT+=dt;K.jumpY=Math.sin(Math.min(1,K.jumpT/0.55)*Math.PI)*0.5;if(K.jumpT>0.55){K.jumpT=-1;K.jumpY=0;}}
  if(state==='intro'&&stateT<=0)beginAim();
  if(state==='aim'&&shootMode===1&&aim){var sp=Dp.aim;
    if(aim.phase===0){aim.x+=aim.dx*sp*dt;if(aim.x>1.65){aim.x=1.65;aim.dx=-1;}if(aim.x<-1.65){aim.x=-1.65;aim.dx=1;}}
    else{aim.y+=aim.dy*sp*0.8*dt;if(aim.y>2.15){aim.y=2.15;aim.dy=-1;}if(aim.y<0.05){aim.y=0.05;aim.dy=1;}}}
  if(state==='runup'){var k=1-stateT/0.42;kicker.x=300+k*140;kicker.legA=k<0.6?-0.8*k/0.6:-0.8+2.6*(k-0.6)/0.4;if(stateT<=0){kicker.legA=1.6;launch();}}
  if(ball.flying||state==='result')stepBall(dt);
  if(state!=='runup'&&state!=='flight'){kicker.legA*=Math.pow(0.02,dt);if(state!=='aim'&&state!=='intro')kicker.x+=(300-kicker.x)*Math.min(1,dt*2);}
  if(state==='flight'&&stateT<=0)finishShot(0,'Daneben!','#ffffff');
  if(state==='result'&&stateT<=0)afterResult();
}
function stepBall(dt){
  var b=ball;if(b.gone||!b.flying)return;
  var pz=b.z,px=b.x,py=b.y;
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;b.vy-=GRAV*dt;b.rot+=dt*(b.vz>0?14:-8);
  if(b.y<BR){b.y=BR;if(b.vy<0)b.vy=-b.vy*0.45;b.vx*=0.8;b.vz*=0.8;}
  if(state!=='flight')return;
  if(!b.crossedG&&pz<ZG&&b.z>=ZG){b.crossedG=true;
    var f=(ZG-pz)/(b.z-pz),cx=px+(b.x-px)*f,cy=py+(b.y-py)*f,K=keeper,half=DIFF[diff].half+0.05,top=1.25+K.jumpY;
    if(Math.abs(cx-K.x)<half+BR&&cy<top+BR){b.z=ZG-0.05;b.vz=-2.2;b.vx=(cx-K.x)*3+(Math.random()-0.5);b.vy=2;finishShot(0,'Gehalten! 🧤','#c6ff3d');return;}}
  if(!b.crossedW&&pz<D&&b.z>=D){b.crossedW=true;
    var f2=(D-pz)/(b.z-pz),wx=px+(b.x-px)*f2,wy=py+(b.y-py)*f2;
    for(var i=0;i<HOLES.length;i++){var h=HOLES[i],d=Math.hypot(wx-h.x,wy-h.y);
      if(d<=h.r-BR*0.55){b.gone=true;rings.push({h:h,life:0.6});finishShot(h.p,h.p>=5?'SUPER-TOR! ⭐':'TOR! ⚽','#ffe14d');return;}
      if(d<h.r+BR){b.z=D-0.02;b.vz=-b.vz*0.3;b.vx+=(wx-h.x)*4;b.vy=Math.abs(b.vy)*0.3+1;finishShot(0,'Am Rand abgeprallt! 😬','#ffffff');return;}}
    if(Math.abs(wx)<=WALLW/2+BR*0.5&&wy<=WALLH+BR*0.5){b.z=D-0.02;b.vz=-b.vz*0.28;b.vx*=0.5;finishShot(0,'Gegen die Wand!','#ffffff');return;}
    finishShot(0,'Daneben!','#ffffff');}
  if(b.z>D+5)b.gone=true;
}
function showBanner(a,b,t,col){banner={a:a,b:b||'',t:t,max:t,col:col||'#ffe14d'};}

/* ---------- Zeichnen ---------- */
function bigText(c,text,y,size,col){c.font=size+'px Bungee, "Arial Black", sans-serif';c.textAlign='center';c.textBaseline='alphabetic';c.lineJoin='round';
  c.lineWidth=Math.max(5,size/6);c.strokeStyle=INK;c.strokeText(text,W/2,y);c.fillStyle=col;c.fillText(text,W/2,y);}
function drawKeeper(c,t){
  var K=keeper,p=proj(K.x,K.jumpY,ZG),k=p.s*1.3/88,gp=proj(K.x,0,ZG);
  c.fillStyle='rgba(10,50,10,.3)';c.beginPath();c.ellipse(gp.x,gp.y,40,9,0,0,TAU);c.fill();
  drawFigure(c,K.m,'#c6ff3d','1',p.x,p.y,k,1,t,{gloves:true,run:state!=='result'&&state!=='over'});
  if(K.cheer>0){c.font='18px Bungee, "Arial Black", sans-serif';c.textAlign='center';c.lineWidth=5;c.strokeStyle=INK;var ty=p.y-k*96;c.strokeText('HAB IHN!',p.x,ty);c.fillStyle='#c6ff3d';c.fillText('HAB IHN!',p.x,ty);}
}
function drawBallNow(c){
  if(ball.gone)return;
  var p=proj(ball.x,ball.y,ball.z),sh=proj(ball.x,0,ball.z),r=BR*p.s;
  c.fillStyle='rgba(10,50,10,.3)';c.beginPath();c.ellipse(sh.x,sh.y,r*1.1,r*0.3,0,0,TAU);c.fill();
  drawBall(c,p.x,p.y,r,ball.rot);
}
function drawAim(c,t){
  if(state!=='aim'||shootMode!==1||!aim)return;
  var tl=proj(-1.7,2.2,D),br=proj(1.7,0,D),p=proj(aim.x,aim.y,D);
  c.save();c.setLineDash([10,8]);c.lineWidth=4;c.strokeStyle='#ffe14d';
  c.beginPath();c.moveTo(p.x,tl.y);c.lineTo(p.x,br.y);c.stroke();
  if(aim.phase===1){c.beginPath();c.moveTo(tl.x,p.y);c.lineTo(br.x,p.y);c.stroke();}
  c.restore();
  var y=aim.phase===1?p.y:proj(0,1.0,D).y;
  circ(c,p.x,y,18);c.lineWidth=7;c.strokeStyle=INK;c.stroke();c.lineWidth=4;c.strokeStyle='#ff5a4e';c.stroke();
  c.beginPath();c.moveTo(p.x-26,y);c.lineTo(p.x+26,y);c.moveTo(p.x,y-26);c.lineTo(p.x,y+26);c.lineWidth=3;c.strokeStyle='#ff5a4e';c.stroke();
}
function drawSwipeHelp(c,t){
  if(state!=='aim'||shootMode!==0)return;
  if(swipe&&swipe.pts.length>1){c.lineCap='round';
    for(var i=1;i<swipe.pts.length;i++){var a=swipe.pts[i-1],b=swipe.pts[i];c.globalAlpha=i/swipe.pts.length;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.lineWidth=10;c.strokeStyle='#ffe14d';c.stroke();}
    c.globalAlpha=1;return;}
  if(shotIdx<players.length){var bp=proj(0,BR,0),k=(t*0.8)%1,y=bp.y-60-k*170;c.globalAlpha=1-k;
    c.font='44px sans-serif';c.textAlign='center';c.fillText('👆',bp.x+20,y+60);c.globalAlpha=1;}
}
function render(t){
  var c=g;
  if(!bgCache){bgCache=document.createElement('canvas');var d=Math.min(DPR_MAX,window.devicePixelRatio||1);
    bgCache.width=W*d;bgCache.height=H*d;var bc=bgCache.getContext('2d');bc.setTransform(d,0,0,d,0,0);drawBackground(bc);}
  c.drawImage(bgCache,0,0,W,H);
  rings.forEach(function(r){var p=proj(r.h.x,r.h.y,D),s=sc(D);circ(c,p.x,p.y,r.h.r*s*(1+(0.6-r.life)));c.lineWidth=5;c.strokeStyle='rgba(255,225,77,'+(r.life/0.6)+')';c.stroke();});
  var behind=ball.z>ZG;
  if(behind)drawBallNow(c);
  drawKeeper(c,t);
  if(!behind)drawBallNow(c);
  var P0=curP()||players[0];
  if(P0)drawFigure(c,P0.m,P0.jersey,P0.num,kicker.x,604,2.2,1,t,{legA:kicker.legA,run:state==='runup'});
  drawAim(c,t);drawSwipeHelp(c,t);
  fx.forEach(function(f){c.globalAlpha=Math.min(1,f.life/f.max*2);c.save();c.translate(f.x,f.y);c.rotate(f.r);c.fillStyle=f.col;c.fillRect(-6,-3,12,6);c.restore();});
  c.globalAlpha=1;
  if(banner){var a=Math.min(1,banner.t*3,(banner.max-banner.t)*8);c.globalAlpha=a;
    bigText(c,banner.a,banner.b?120:130,banner.a.length>14?44:62,banner.col);if(banner.b)bigText(c,banner.b,176,32,'#ffffff');c.globalAlpha=1;}
}

/* ---------- Ton ---------- */
var AC=null,muted=false;
function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f0,f1,type,dur,vol,delay){
  var n=AC.currentTime+(delay||0),o=AC.createOscillator(),gn=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,n);o.frequency.exponentialRampToValueAtTime(f1,n+dur);
  gn.gain.setValueAtTime(vol,n);gn.gain.setValueAtTime(vol,n+dur*0.5);gn.gain.exponentialRampToValueAtTime(0.0001,n+dur);
  o.connect(gn);gn.connect(AC.destination);o.start(n);o.stop(n+dur+0.02);}
function sfx(k){if(!AC||muted)return;
  if(k==='kick')tone(160,55,'triangle',0.14,0.16);
  else if(k==='tick')tone(700,700,'square',0.05,0.04);
  else if(k==='goal'){tone(900,300,'sine',0.25,0.05);[523,659,784,1046].forEach(function(f,i){tone(f,f,'triangle',0.18,0.07,0.12+i*0.1);});}
  else if(k==='save')tone(230,110,'sawtooth',0.3,0.05);
  else if(k==='clang')tone(1300,900,'square',0.16,0.04);
  else if(k==='miss')tone(320,150,'triangle',0.35,0.07);
  else if(k==='whistle'){tone(2100,2300,'sine',0.16,0.05);tone(2100,2300,'sine',0.3,0.05,0.2);}}
$('mute').onclick=function(){muted=!muted;$('mute').textContent=muted?'🔇 Ton aus':'🔊 Ton an';initAudio();};

/* ---------- Schleife ---------- */
showBuilder();
var last=performance.now();
function loop(now){var raw=(now-last)/1000,dt=Math.min(0.033,raw);last=now;var t=now/1000;perfTick(raw);
  if(!$('builder').hidden)drawPreview(t);
  if(!$('game').hidden&&players.length){update(dt);render(t);}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
