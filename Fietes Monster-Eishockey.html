<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="Monster-Eishockey">
<title>Fietes Monster-Eishockey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Bungee&display=swap">
<style>
/* Layout: Eishalle – Sticker-Karten mit harten Schatten auf frostigem Hellblau, die Eisfläche ist die Hauptbühne */
:root{
  --ice:#cdeaff; --dots:rgba(30,60,130,.13); --ink:#1d1a2b; --paper:#fffaf0;
  --grape:#6c3fd1; --go:#38c172; --sky:#3fb6ff; --white:#ffffff; --red:#ff5a4e;
  --p1:#ffe14d; --p2:#7fe3ff; --clock:#7fffb0;
  --display:'Bungee','Arial Black',Impact,system-ui,sans-serif;
  --body:'Baloo 2','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{
  background-color:var(--ice);color:var(--ink);
  background-image:radial-gradient(circle at 2px 2px,var(--dots) 2px,transparent 2.6px);
  background-size:28px 28px;background-attachment:fixed;
}
html{min-height:100%}
body{margin:0}
body{
  font-family:var(--body);font-size:18px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 48px;
}
.wrap{max-width:1060px;margin:0 auto;display:grid;gap:20px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,44px);line-height:1;margin:0;text-wrap:balance}
h1 span{color:var(--white);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.steps{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0}
.steps li{font-weight:800;font-size:16px;padding:3px 14px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);opacity:.5}
.steps li.on{opacity:1;background:var(--grape);color:var(--white)}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink)}
.builder{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
@media (max-width:820px){.builder{grid-template-columns:minmax(0,1fr)}}
.preview{padding:16px;display:grid;gap:10px}
@media (min-width:821px){.preview{position:sticky;top:12px}}
#pv{display:block;width:100%;height:auto;border:3px solid var(--ink);border-radius:14px}
label{font-weight:800}
.txt-in{font:inherit;font-weight:800;font-size:20px;padding:5px 14px;border:3px solid var(--ink);border-radius:12px;background:var(--white);color:var(--ink);width:100%;box-sizing:border-box}
.panel{padding:18px 20px;display:grid;gap:16px;min-width:0}
.flat{padding:0}
h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0;text-wrap:balance}
.row{display:grid;gap:6px}
.lab{font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:700;font-size:17px;padding:3px 14px;border:3px solid var(--ink);border-radius:12px;background:var(--white);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.chip.sel{background:var(--grape);color:var(--white)}
.chip.sw{width:42px;height:42px;padding:0;border-radius:50%}
.chip.sw.sel{outline:4px solid var(--grape);outline-offset:3px}
.chip:disabled{opacity:.25;cursor:not-allowed}
.num-in{width:90px;text-align:center;font-family:var(--display);font-weight:400}
:focus-visible{outline:4px solid var(--sky);outline-offset:2px}
.sep{border:0;border-top:3px dashed rgba(29,26,43,.2);margin:4px 0;width:100%}
.btn{font-family:var(--display);font-weight:400;font-size:18px;padding:10px 18px;border:3px solid var(--ink);border-radius:14px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);background:var(--white);color:var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.go{background:var(--go)}
.btn.small{font-size:15px;padding:6px 14px;box-shadow:3px 3px 0 var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
.who{font-family:var(--display);font-size:15px;justify-self:start;padding:2px 12px;border:3px solid var(--ink);border-radius:999px;background:var(--p1)}
.who.p2{background:var(--p2)}
.game{display:grid;gap:14px}
.score{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto minmax(0,1fr);align-items:center;gap:12px;padding:8px 16px}
.tname{display:flex;align-items:center;gap:8px;min-width:0;font-weight:800;font-size:18px}
.tname .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#n1{justify-content:flex-end;text-align:right}
.jdot{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink);flex:none}
.goals{font-family:var(--display);font-size:36px;line-height:1;min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
.goals.pop{animation:pop .6s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(1)}}
.clock{font-family:var(--display);font-size:22px;background:var(--ink);color:var(--clock);padding:4px 12px;border-radius:10px;min-width:86px;text-align:center;font-variant-numeric:tabular-nums}
@media (max-width:560px){.tname{font-size:14px}.goals{font-size:26px}.clock{font-size:17px;min-width:64px}}
.stage{position:relative;border:3px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:6px 6px 0 var(--ink);background:#26305e}
#cv{display:block;width:100%;height:auto;touch-action:none}
.overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:grid;place-items:center;background:rgba(29,26,43,.55);padding:12px}
.ocard{padding:16px 22px;width:min(440px,100%);box-sizing:border-box;display:grid;gap:10px;text-align:center}
.ocard h2{font-size:26px}
.big-score{font-family:var(--display);font-size:22px}
.ocard p{margin:0;font-weight:700}
.ocard .actions{justify-content:center}
@media (max-width:700px){.overlay{position:static;background:none;padding:12px 0 0}}
.keys{margin:0;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;font-weight:700;font-size:16px}
.keys .tag{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:0 10px;border:3px solid var(--ink);border-radius:999px;background:var(--p1);margin-right:6px}
.keys .tag.p2{background:var(--p2)}
kbd{font-family:var(--body);font-weight:800;font-size:14px;padding:0 7px;border:2px solid var(--ink);border-bottom-width:4px;border-radius:6px;background:var(--white)}
.touch{display:none;justify-content:space-between;gap:12px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media (pointer:coarse){.touch{display:flex}.keys{display:none}}
html.is-touch .touch{display:flex}
html.is-touch .keys{display:none}
.touch.solo .tpad{display:contents}
.touch.solo .mid{order:1}
.touch.solo .tbtns{order:2}
html.is-touch .score{padding:4px 14px}
html.is-touch .goals{font-size:30px}
.tpad{display:flex;align-items:center;gap:14px}
.tpad.r{flex-direction:row-reverse}
.joy{width:124px;height:124px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);position:relative;touch-action:none;flex:none}
.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-30px 0 0 -30px;border-radius:50%;background:var(--p1);border:3px solid var(--ink);pointer-events:none}
#joy1 .knob{background:var(--p2)}
.tbtns{display:flex;flex-direction:column;gap:12px}
.tb{touch-action:none;min-width:100px;font-size:18px;padding:12px 14px}
.tb.shoot{background:var(--red);color:var(--white)}
.actions #go{margin-left:auto}
.foot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
@media (prefers-reduced-motion:reduce){.goals.pop{animation:none}}
/* iPad-Grundlagen */
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
.game{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.stage{justify-self:center;width:100%;box-sizing:border-box}
body.playing{padding-block:8px 4px}
.mid{flex:1;min-width:0;display:grid;gap:8px;justify-items:center;align-content:center}
.tbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tbar .btn.small{font-size:13px;padding:5px 10px}
body.playing .top{display:none}
.hall{font-family:var(--display);font-size:14px;padding:4px 12px;border:3px solid var(--ink);border-radius:12px;background:var(--white);color:var(--ink);text-decoration:none;box-shadow:3px 3px 0 var(--ink)}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Fietes <span>Monster-Eishockey</span></h1>
    <a class="hall" href="index.html">← Spielehalle</a>
    <ol class="steps" id="steps"><li class="on">1 Mannschaft</li><li>2 Spiel</li></ol>
  </header>

  <section id="builder" class="builder">
    <div class="card preview">
      <canvas id="pv" width="440" height="300" aria-label="Vorschau von deiner Mannschaft"></canvas>
      <label for="tname">Name der Mannschaft</label>
      <input id="tname" class="txt-in" maxlength="22" autocomplete="off">
      <label for="name">Name von deinem Kapitän</label>
      <input id="name" class="txt-in" maxlength="14" autocomplete="off">
    </div>
    <div class="card panel">
      <div id="modebox" class="panel flat">
        <div class="row">
          <div class="lab">Wer spielt?</div>
          <div class="chips"><button type="button" id="m1" class="chip sel">Gegen den Computer</button><button type="button" id="m2" class="chip">Zu zweit</button></div>
        </div>
        <div class="row" id="diffrow">
          <div class="lab">Wie schwer?</div>
          <div class="chips"><button type="button" id="d0" class="chip">Leicht</button><button type="button" id="d1" class="chip sel">Normal</button><button type="button" id="d2" class="chip">Schwer</button></div>
        </div>
        <hr class="sep">
      </div>
      <span id="who" class="who" hidden>Mannschaft 1</span>
      <h2>Bau deinen Kapitän!</h2>
      <div id="rows" class="panel flat" style="gap:14px"></div>
      <hr class="sep">
      <h2>Euer Trikot</h2>
      <div class="row">
        <div class="lab">Trikotfarbe</div>
        <div class="chips" id="jrow"></div>
      </div>
      <div class="row">
        <label class="lab" for="num">Rückennummer</label>
        <input id="num" class="txt-in num-in" inputmode="numeric" maxlength="2" autocomplete="off">
      </div>
      <div class="actions">
        <button id="rand" class="btn small">🎲 Zufalls-Kapitän</button>
        <button id="mates" class="btn small">🎲 Neue Mitspieler</button>
      </div>
      <div class="actions">
        <button id="back1" class="btn" hidden>← Mannschaft 1</button>
        <button id="go" class="btn go">Spiel starten!</button>
      </div>
    </div>
  </section>

  <section id="game" class="game" hidden>
    <div class="card score">
      <div class="tname" id="n0"><span class="jdot" id="j0"></span><span class="tx" id="t0"></span></div>
      <b class="goals" id="s0">0</b>
      <div class="clock" id="clock">5:00</div>
      <b class="goals" id="s1">0</b>
      <div class="tname" id="n1"><span class="tx" id="t1"></span><span class="jdot" id="j1"></span></div>
    </div>
    <div class="stage">
      <canvas id="cv" width="1000" height="540" aria-label="Eisfläche"></canvas>
      <div id="overlay" class="overlay" hidden></div>
    </div>
    <div class="touch" id="touch">
      <div class="tpad" id="tp0">
        <div class="joy" id="joy0"><div class="knob"></div></div>
        <div class="tbtns"><button id="sh0" class="btn tb shoot">Schuss</button><button id="pa0" class="btn tb">Pass</button></div>
      </div>
      <div class="mid" id="tmid"></div>
      <div class="tpad r" id="tp1">
        <div class="joy" id="joy1"><div class="knob"></div></div>
        <div class="tbtns"><button id="sh1" class="btn tb shoot">Schuss</button><button id="pa1" class="btn tb">Pass</button></div>
      </div>
    </div>
    <p class="keys" id="keys"></p>
    <div class="foot">
      <button id="quit" class="btn small">← Zur Mannschaft</button>
      <button id="pause" class="btn small">⏸ Pause</button>
      <button id="mute" class="btn small">🔊 Ton an</button>
    </div>
  </section>
</div>

<script>
/* ===== iPad-Grundlagen (Zielgerät: iPad Air 2, iOS 15, Safari) =====
   - Touch erkennen, Bildschirm einpassen, kein Scrollen/Zoomen im Spiel
   - Ton unter iOS freischalten (braucht ein echtes Antippen)
   - Bildqualität automatisch senken, wenn das Gerät zu langsam ist */
var DPR_MAX=2;
var IS_TOUCH=('ontouchstart' in window)||(navigator.maxTouchPoints||0)>0;
if(IS_TOUCH)document.documentElement.classList.add('is-touch');
function gameOn(){var g=document.getElementById('game');return !!g&&!g.hidden;}
function fitStage(){
  var game=document.getElementById('game'),stage=document.querySelector('.stage'),c=document.getElementById('cv');
  if(!game||game.hidden||!stage||!c)return;
  stage.style.maxWidth='';
  var other=game.getBoundingClientRect().height-stage.getBoundingClientRect().height;
  var avail=window.innerHeight-other-22;
  stage.style.maxWidth=Math.max(300,Math.floor(avail*c.width/c.height))+'px';
}
function enterGameScreen(){document.body.classList.add('playing');window.scrollTo(0,0);fitStage();requestAnimationFrame(fitStage);setTimeout(fitStage,400);}
function leaveGameScreen(){document.body.classList.remove('playing');var s=document.querySelector('.stage');if(s)s.style.maxWidth='';window.scrollTo(0,0);}
window.addEventListener('resize',fitStage);
window.addEventListener('orientationchange',function(){setTimeout(fitStage,400);});
var audioUnlocked=false;
function unlockAudio(){
  if(typeof initAudio!=='function')return;
  initAudio();
  if(audioUnlocked||!AC)return;
  try{var b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0);audioUnlocked=true;}catch(e){}
}
document.addEventListener('touchend',unlockAudio,true);
document.addEventListener('click',unlockAudio,true);
document.addEventListener('touchmove',function(e){
  if(gameOn()&&!(e.target&&e.target.closest&&e.target.closest('.ocard,.rcard')))e.preventDefault();
},{passive:false});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
var perfN=0,perfSum=0,lowQ=false;
function perfTick(raw){
  if(lowQ||!gameOn()||document.hidden||raw>0.25)return;
  perfN++;perfSum+=raw;
  if(perfN>=90){
    if(perfSum/perfN>0.026){lowQ=true;DPR_MAX=1;if(typeof onLowQuality==='function')onLowQuality();}
    perfN=0;perfSum=0;
  }
}
function compactControls(){
  if(!IS_TOUCH)return;
  var mid=document.getElementById('tmid'),foot=document.querySelector('.foot');if(!mid||!foot)return;
  var bar=document.createElement('div');bar.className='tbar';
  while(foot.firstElementChild)bar.appendChild(foot.firstElementChild);
  mid.appendChild(bar);foot.hidden=true;
}
compactControls();
/* ===== Ende iPad-Grundlagen ===== */


/* Kompatibilität: ältere Safari-Versionen (iPadOS < 16) kennen roundRect nicht */
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.max(0,Math.min(typeof r==='number'?r:(r&&r[0])||0,Math.abs(w)/2,Math.abs(h)/2));
    this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};
}
/* Fehler sichtbar machen, falls doch etwas schiefgeht (hilft auf dem iPad ohne Entwicklerwerkzeuge) */
window.addEventListener('error',function(e){
  var b=document.getElementById('errbox');
  if(!b){b=document.createElement('div');b.id='errbox';
    b.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#fffaf0;color:#1d1a2b;border:3px solid #1d1a2b;border-radius:14px;padding:10px 14px;font:600 15px/1.35 system-ui,sans-serif;box-shadow:4px 4px 0 #1d1a2b';
    document.body.appendChild(b);}
  b.textContent='Ups, da ist etwas kaputtgegangen. Bitte diesen Text an Claude schicken: '+e.message+' (Zeile '+e.lineno+')';
});

const INK='#1d1a2b', TAU=Math.PI*2;
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shade(hex,a){let n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  const f=v=>Math.round(a<0?v*(1+a):v+(255-v)*a);return `rgb(${f(r)},${f(g)},${f(b)})`;}
function P(c,p){c.beginPath();c.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);c.closePath();}
function fs(c,fill,lw=3){c.fillStyle=fill;c.fill();c.lineWidth=lw;c.strokeStyle=INK;c.stroke();}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,TAU);}
function setup(cv,w,h){const d=Math.min(DPR_MAX,window.devicePixelRatio||1);cv.width=w*d;cv.height=h*d;const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);return x;}

/* ---------- Monster ---------- */
const COLORS=['#38c172','#ff5a4e','#3fb6ff','#a66bff','#ff9f1c','#ff6fb5','#2ec4b6','#8d6e63'];
const OPTS={
  color:COLORS.map(v=>({v})),
  eyes:[{v:1,l:'1'},{v:2,l:'2'},{v:3,l:'3'},{v:5,l:'5'}],
  horns:[{v:'none',l:'Keine'},{v:'small',l:'Kleine'},{v:'big',l:'Riesig'},{v:'antenna',l:'Antennen'}],
  mouth:[{v:'smile',l:'Lächeln'},{v:'teeth',l:'Zähne'},{v:'fangs',l:'Riesenzähne'},{v:'tongue',l:'Zunge raus'}],
  arms:[{v:2,l:'2 Arme'},{v:4,l:'4 Arme'}],
  tail:[{v:'none',l:'Keiner'},{v:'tail',l:'Puschel'},{v:'spiky',l:'Stachel'}],
  wings:[{v:false,l:'Keine'},{v:true,l:'Flügel'}],
  pattern:[{v:'none',l:'Keins'},{v:'spots',l:'Punkte'},{v:'stripes',l:'Streifen'}],
};
const ROWS=[['color','Farbe'],['eyes','Augen'],['horns','Hörner'],['mouth','Mund'],['arms','Arme'],['tail','Schwanz'],['wings','Flügel'],['pattern','Muster']];
function randMonster(except){const m={};for(const k in OPTS)m[k]=pick(OPTS[k]).v;
  if(except){m.color=pick(COLORS.filter(c=>!except.includes(c)));}return m;}

function arm(c,x1,y1,x2,y2,col){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.lineWidth=10;c.strokeStyle=INK;c.stroke();
  c.lineWidth=5;c.strokeStyle=col;c.stroke();circ(c,x2,y2,4.5);fs(c,col,2.5);}
const EYES={1:[[10,-8,11]],2:[[2,-10,8],[18,-8,7]],3:[[-6,-12,7],[10,-15,7.5],[22,-3,6]],5:[[-10,-12,5.5],[1,-19,6],[13,-13,6.5],[23,-3,5],[5,-2,4.5]]};

function drawMonster(c,m,x,y,s,t){
  const col=m.color,dk=shade(col,-0.3),lt=shade(col,0.4);
  c.save();c.translate(x,y+Math.sin(t*7)*1.2);c.scale(s,s);c.lineJoin='round';c.lineCap='round';
  if(m.wings){const f=Math.sin(t*16)*0.4;c.save();c.translate(-8,-14);c.rotate(-0.5+f);
    c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(-20,-36,-46,-28);c.quadraticCurveTo(-34,-16,-40,-4);c.quadraticCurveTo(-22,-8,0,0);c.closePath();
    fs(c,'rgba(255,255,255,.9)',2.5);c.restore();}
  if(m.tail!=='none'){const w=Math.sin(t*6)*5;c.beginPath();c.moveTo(-22,12);c.quadraticCurveTo(-46,18+w,-50,-4+w);
    c.lineWidth=11;c.strokeStyle=INK;c.stroke();c.lineWidth=5;c.strokeStyle=col;c.stroke();
    if(m.tail==='spiky'){P(c,[-57,-2+w,-50,-18+w,-43,-2+w]);fs(c,'#fff1c9',2.5);}
    else{circ(c,-50,-5+w,7);fs(c,dk,2.5);}}
  if(m.arms===4)arm(c,-10,4,-28,-20+Math.sin(t*9)*7,col);
  const body=()=>{c.beginPath();c.ellipse(0,0,30,28,0,0,TAU);};
  body();c.fillStyle=col;c.fill();
  c.save();body();c.clip();

function boardCollide(o,r,b){

  if(kx!==null&&ky!==null){var dx=o.x-kx,dy=o.y-ky,d=Math.hypot(dx,dy),lim=R-r;

  else{
    if(o.x<RX0+r){o.x=RX0+r;if(o.vx<0){hit=-o.vx;o.vx=-o.vx*b;}}
    if(o.x>RX1-r){o.x=RX1-r;if(o.vx>0){hit=o.vx;o.vx=-o.vx*b;}}
    if(o.y<RY0+r){o.y=RY0+r;if(o.vy<0){hit=-o.vy;o.vy=-o.vy*b;}}
    if(o.y>RY1-r){o.y=RY1-r;if(o.vy>0){hit=o.vy;o.vy=-o.vy*b;}}
  }

}
function netCollide(o,r,px,isPuck){

    var lo=Math.min(fxl,bx)-r,hi=Math.max(fxl,bx)+r,top=cy-MH-r,bot=cy+MH+r;
    if(o.x<lo||o.x>hi||o.y<top||o.y>bot)continue;
    if(isPuck&&Math.abs(o.y-cy)<MH-2){
      var inFront=(o.x-fxl)*dir<0,wasFront=(px-fxl)*dir<=0;
      if(inFront)continue;
      if(wasFront)return s;
    }
    var d=[o.x-lo,hi-o.x,o.y-top,bot-o.y],k=0;for(var i=1;i<4;i++)if(d[i]<d[k])k=i;
    if(k===0){o.x=lo;if(o.vx>0)o.vx*=-0.5;}else if(k===1){o.x=hi;if(o.vx<0)o.vx*=-0.5;}
    else if(k===2){o.y=top;if(o.vy>0)o.vy*=-0.5;}else{o.y=bot;if(o.vy<0)o.vy*=-0.5;}
  }
  return -1;
}

function aiSpeed(p){return isHumanTeam(p.t)?238:[170,195,220][diff];}
function goalieSpeed(p){return isHumanTeam(p.t)?170:[110,135,160][diff];}

function stealRate(p){if(p.boost>0)return 40;if(isCtrl(p))return 3.2;return isHumanTeam(p.t)?2.4:[0.7,1.2,2][diff];}

function shoot(p,ay){
  var gx=oppGL(p.t),ty;
  if(ay===null||ay===undefined||Math.abs(ay)<0.25)ty=cy+(Math.random()*2-1)*(MH-4);
  else ty=cy+(ay>0?1:-1)*(MH-10)+(Math.random()*2-1)*12;
  var dx=gx-puck.x,dy=ty-puck.y,L=Math.hypot(dx,dy)||1,sp=640+Math.random()*60;
  var a=Math.atan2(dy,dx)+(Math.random()-0.5)*Math.min(0.28,L/2200);
  puck.owner=null;puck.vx=Math.cos(a)*sp;puck.vy=Math.sin(a)*sp;puck.shooter=p;puck.passTo=null;
  p.pickCD=0.35;lastTouch=p;sfx('shot');
}
function pass(p,to){
  if(!to)to=players.filter(function(q){return q.t===p.t&&q.role==='S'&&q!==p;})[0];
  if(!to)return;
  var tx=to.x+to.vx*0.35,ty=to.y+to.vy*0.35,dx=tx-puck.x,dy=ty-puck.y,L=Math.hypot(dx,dy)||1,sp=clamp(L*1.8,300,560);
  puck.owner=null;puck.vx=dx/L*sp;puck.vy=dy/L*sp;puck.passTo=to;puck.passT=1.3;puck.shooter=null;
  p.pickCD=0.4;lastTouch=p;sfx('pass');
  if(isHumanTeam(p.t))ctrl[p.t]=to;
}
function take(p){
  var prev=puck.owner;if(prev)prev.pickCD=0.6;
  puck.owner=p;puck.passTo=null;puck.shooter=null;p.hold=0;p.stealCD=0.45;lastTouch=p;sfx('pick');
  if(isHumanTeam(p.t)&&p.role==='S')ctrl[p.t]=p;
}
function deflect(p){
  var dx=puck.x-p.x,dy=puck.y-p.y,L=Math.hypot(dx,dy)||1,nx=dx/L,ny=dy/L,vn=puck.vx*nx+puck.vy*ny;
  if(vn<0){puck.vx-=2*vn*nx;puck.vy-=2*vn*ny;}
  puck.vx=puck.vx*0.5+(Math.random()-0.5)*120;puck.vy=puck.vy*0.5+(Math.random()-0.5)*120;
  puck.x=p.x+nx*20;puck.y=p.y+ny*20;sfx('board');
}
function manualSwitch(t){
  if(puck.owner&&puck.owner.t===t)return;
  var order=players.filter(function(q){return q.t===t;}),k=order.indexOf(ctrl[t]);ctrl[t]=order[(k+1)%order.length];switchLock[t]=1;
}
function autoSwitch(t,dt){
  switchLock[t]-=dt;
  var o=puck.owner;
  if(o&&o.t===t){if(o.role==='S')ctrl[t]=o;return;}
  if(puck.passTo&&puck.passTo.t===t&&puck.passTo.role==='S'){ctrl[t]=puck.passTo;return;}
}
function aiSkater(p,dt){
  var t=p.t,d=ATT[t],o=puck.owner,tx,ty;
  var mate=players.filter(function(q){return q.t===t&&q.role==='S'&&q!==p;})[0];
  if(o===p){
    p.hold+=dt;
    var gx=oppGL(t),dg=Math.hypot(gx-p.x,cy-p.y),inFront=(gx-p.x)*d>40;
    var opp=nearestOpp(p),od=opp?dist(opp,p):999;
    var rate=(dg<200?1.2:dg<310?0.35:0)*(isHumanTeam(t)?1:[0.45,0.7,1][diff]);
    tx=gx-d*80;ty=cy+(p.y<cy?-30:30);
    if(!inFront){tx=gx-d*130;ty=cy+(p.y<cy?-95:95);}
    if(inFront&&Math.random()<dt*rate)shoot(p,null);
    else if(p.hold>5){if(inFront)shoot(p,null);else pass(p,mate);}
    else if(od<75&&(opp.x-p.x)*d>0&&mate&&Math.random()<dt*1.8)pass(p,mate);
  } else if(puck.passTo===p){tx=puck.x;ty=puck.y;}
  else if(o&&o.t===t){
    if(o.role==='G'){tx=ownGL(t)+d*230;ty=p.i===0?cy-120:cy+120;}
    else{tx=clamp(o.x+d*140,RX0+80,RX1-80);ty=o.y<cy?cy+105:cy-105;}
  } else {
    var sk=skaters(t),chaser=dist(sk[0],puck)<=dist(sk[1],puck)?sk[0]:sk[1];
    if(chaser===p){tx=puck.x+(o?0:puck.vx*0.18);ty=puck.y+(o?0:puck.vy*0.18);}
    else{tx=ownGL(t)+d*190;ty=cy+(puck.y-cy)*0.5;}
  }
  var dx=tx-p.x,dy=ty-p.y,L=Math.hypot(dx,dy);
  if(L<12)return {x:0,y:0};
  var f=L<60?L/60:1;return {x:dx/L*f,y:dy/L*f};
}
function goalieMove(p,dt){
  var t=p.t,d=ATT[t],gx=ownGL(t),tx,ty;
  if(puck.owner===p){
    p.hold+=dt;tx=gx+d*22;ty=cy;
    if(p.hold>0.9&&state==='play'){
      var best=null,bs=-1;skaters(t).forEach(function(q){var s=1e9;players.forEach(function(o){if(o.t!==t)s=Math.min(s,dist(o,q));});if(s>bs){bs=s;best=q;}});
      pass(p,best);}
  } else {
    var near=Math.abs(puck.x-gx)<400;
    tx=gx+d*(near?24:16);ty=cy+(puck.y-cy)*(near?0.5:0.25);
    if(!puck.owner&&puck.vx*d<-150){var tt=(tx-puck.x)/puck.vx;if(tt>0&&tt<0.9)ty=puck.y+puck.vy*tt;}
    ty=clamp(ty,cy-MH+2,cy+MH-2);
  }
  var sp=goalieSpeed(p),dx=tx-p.x,dy=ty-p.y,L=Math.hypot(dx,dy);
  if(L>0.5){var step=Math.min(L,sp*dt),k=Math.min(1,L/12);p.vx=dx/L*sp*k;p.vy=dy/L*sp*k;p.x+=dx/L*step;p.y+=dy/L*step;}
  else{p.vx=p.vy=0;}
  p.face=d;
}

/* ---------- Spielablauf ---------- */
function update(dt){
  if(state==='idle'||state==='over'||paused)return;
  hype=Math.max(0,hype-dt);updFx(dt);
  if(banner){banner.t-=dt;if(banner.t<=0)banner=null;}
  stateT-=dt;
  if(state==='faceoff'){act.forEach(function(a){a.shoot=a.pass=0;});if(stateT<=0){state='play';sfx('whistle');}return;}
  if(state==='goal'&&stateT<=0){if(overtime){endGame();return;}faceoff();return;}
  if(state==='play'&&!overtime){
    clock-=dt;
    if(clock<=0){clock=0;
      if(score[0]===score[1]){overtime=true;showBanner('Verlängerung!','Wer zuerst trifft, gewinnt!',3);sfx('whistle');}
      else{updClock();endGame();return;}}
  }
  updClock();
  if(state==='play')for(var t=0;t<2;t++)if(isHumanTeam(t))autoSwitch(t,dt);
  players.forEach(function(p){
    p.pickCD-=dt;p.stealCD-=dt;p.boost-=dt;p.boostCD-=dt;
    var dir={x:0,y:0},spd=0,resp=2.2;
    if(state==='play'){
      if(isCtrl(p)){
        dir=inputVec(p.t);spd=p.role==='G'?210:265;resp=(dir.x||dir.y)?6:2.2;
        var a=act[p.t];
        if(a.shoot){if(puck.owner===p)shoot(p,dir.y);else if(p.boostCD<=0){p.boost=0.35;p.boostCD=0.9;}}
        if(a.pass){if(puck.owner===p)pass(p,null);else manualSwitch(p.t);}
        a.shoot=a.pass=0;
      } else if(p.role==='G'){goalieMove(p,dt);return;}
      else{dir=aiSkater(p,dt);spd=aiSpeed(p);resp=(dir.x||dir.y)?4.5:2.2;}
    }
    if(puck.owner===p)spd*=0.92;
    if(p.boost>0)spd*=1.5;
    var k=Math.min(1,dt*resp);
    p.vx+=(dir.x*spd-p.vx)*k;p.vy+=(dir.y*spd-p.vy)*k;
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(Math.abs(p.vx)>25)p.face=p.vx>0?1:-1;
    if(p.role==='G')p.face=ATT[p.t];
  });
  act.forEach(function(a){a.shoot=a.pass=0;});
  for(var i=0;i<players.length;i++)for(var j=i+1;j<players.length;j++){
    var A=players[i],B=players[j],dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy);
    if(d<28&&d>0.01){var push=(28-d)/2,nx=dx/d,ny=dy/d;A.x-=nx*push;A.y-=ny*push;B.x+=nx*push;B.y+=ny*push;}
  }
  players.forEach(function(p){boardCollide(p,14,0.3);netCollide(p,14,p.x,false);
    if(p.role==='G'){var gx=ownGL(p.t),d=ATT[p.t];p.x=gx+d*clamp((p.x-gx)*d,16,70);p.y=clamp(p.y,cy-MH-45,cy+MH+45);}});
  updatePuck(dt);
}
function updatePuck(dt){
  if(puck.passT>0){puck.passT-=dt;if(puck.passT<=0)puck.passTo=null;}
  if(state==='goal'){var f0=Math.pow(0.02,dt);puck.x+=puck.vx*dt;puck.y+=puck.vy*dt;puck.vx*=f0;puck.vy*=f0;
    var gx=puck.x<cx?GL0:GL1,dir=puck.x<cx?-1:1;puck.x=gx+dir*clamp((puck.x-gx)*dir,6,ND-6);puck.y=clamp(puck.y,cy-MH+6,cy+MH-6);return;}
  var o=puck.owner;
  if(o){puck.x=o.x+o.face*29;puck.y=o.y-1;puck.vx=o.vx;puck.vy=o.vy;boardCollide(puck,6,0);
    if(netCollide(puck,6,puck.x,false)>=0){}}
  else{
    var px=puck.x;
    puck.x+=puck.vx*dt;puck.y+=puck.vy*dt;
    var f=Math.pow(0.6,dt);puck.vx*=f;puck.vy*=f;
    var h=boardCollide(puck,6,0.7);
    if(h>140&&performance.now()-lastBoard>120){lastBoard=performance.now();sfx('board');}
    var gs=netCollide(puck,6,px,true);
    if(gs>=0){goalScored(gs===0?1:0);return;}
  }
  if(state!=='play')return;
  for(var i=0;i<players.length;i++){
    var p=players[i];
    if(p===puck.owner||p.pickCD>0)continue;
    var sx=p.x+p.face*27,dd=Math.min(Math.hypot(puck.x-sx,puck.y-p.y),Math.hypot(puck.x-p.x,puck.y-p.y));
    if(dd>(p.role==='G'?26:18))continue;
    if(puck.owner){
      if(puck.owner.t===p.t||puck.owner.stealCD>0)continue;
      if(Math.random()<stealRate(p)*dt){take(p);if(isHumanTeam(p.t))pop(p.x,p.y-70,'Geklaut!','#ffe14d');}
    } else {
      var sp=Math.hypot(puck.vx,puck.vy);
      if(p.role==='G'&&sp>220&&puck.shooter&&puck.shooter.t!==p.t){
        if(Math.random()<saveChance(p)){take(p);sfx('save');pop(p.x,p.y-70,'Gehalten!','#ffffff');}
        else{deflect(p);p.pickCD=0.6;}
      } else if(sp<470||puck.passTo===p)take(p);
      else{deflect(p);p.pickCD=0.3;}
    }
    if(puck.owner===p)break;
  }
}
function goalScored(team){

  var s=lastTouch,own=s&&s.t!==team,Tm=G.teams[team];

  sfx('horn');
  var nx=team===0?GL1+14:GL0-14;
  for(var i=0;i<60;i++){var a=Math.random()*TAU,v=120+Math.random()*260;
    fx.push({k:'c',x:nx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-120,life:1.6,max:1.6,col:pick(['#ffe14d','#ff5a4e','#3fb6ff','#38c172','#ff6fb5',Tm.jersey]),r:Math.random()*TAU});}
  puck.owner=null;puck.vx*=0.25;puck.vy*=0.25;

  c.restore();
  [0,1].forEach(function(s){var nx=s?GL1:GL0-ND,fxl=s?GL1:GL0,bx=s?GL1+ND:GL0-ND;
    c.fillStyle='rgba(255,255,255,.95)';c.fillRect(nx,cy-MH,ND,MH*2);

    c.lineWidth=7;c.strokeStyle=INK;c.stroke();c.lineWidth=4;c.strokeStyle='#e63946';c.stroke();});
  rinkPath(c);c.lineWidth=7;c.strokeStyle=INK;c.stroke();
  rinkPath(c);c.lineWidth=2.5;c.strokeStyle='#ffd23f';c.stroke();

  var moving=Math.hypot(p.vx,p.vy)>40,me=isCtrl(p)&&state!=='over';
  if(me){c.beginPath();c.ellipse(p.x,p.y+2,27,9,0,0,TAU);c.lineWidth=4;c.strokeStyle=ctrlColor(p.t);c.stroke();}
  if(p.boost>0){c.fillStyle='rgba(255,255,255,.8)';for(var q=0;q<3;q++)c.fillRect(p.x-p.face*(34+q*10)-(p.face>0?22:0),p.y-40+q*12,22,3);}
  drawSkater(c,p.m,G.teams[p.t].jersey,p.num,p.x,p.y,SC,p.face,t+p.t*0.5+p.i*0.3,{moving:moving,goalie:p.role==='G'});
  if(me){var lb=mode===2?(p.t===0?'S1':'S2'):'DU',ty=p.y-70;
    c.font='15px Bungee, "Arial Black", sans-serif';c.textAlign='center';c.lineWidth=5;c.strokeStyle=INK;c.lineJoin='round';
    c.strokeText(lb,p.x,ty);c.fillStyle=ctrlColor(p.t);c.fillText(lb,p.x,ty);
    P(c,[p.x-6,ty+5,p.x+6,ty+5,p.x,ty+12]);fs(c,ctrlColor(p.t),2);}
}
function bigText(c,text,y,size,col){c.font=size+'px Bungee, "Arial Black", sans-serif';c.textAlign='center';c.lineJoin='round';
  c.lineWidth=Math.max(5,size/6);c.strokeStyle=INK;c.strokeText(text,W/2,y);c.fillStyle=col;c.fillText(text,W/2,y);}
function render(t){
  var c=g;drawRink(c,t);
  var items=players.map(function(p){return {y:p.y,f:function(){drawPlayer(c,p,t);}};});
  items.push({y:puck.owner?puck.owner.y+0.5:puck.y,f:function(){drawPuck(c);}});
  items.sort(function(a,b){return a.y-b.y;}).forEach(function(i){i.f();});
  fx.forEach(function(f){c.globalAlpha=Math.min(1,f.life/f.max*2);
    if(f.k==='c'){c.save();c.translate(f.x,f.y);c.rotate(f.r);c.fillStyle=f.col;c.fillRect(-5,-3,10,6);c.restore();}
    else{c.font='20px Bungee, "Arial Black", sans-serif';c.textAlign='center';c.lineWidth=5;c.strokeStyle=INK;c.strokeText(f.text,f.x,f.y);c.fillStyle=f.col;c.fillText(f.text,f.x,f.y);}});
  c.globalAlpha=1;
  if(state==='faceoff')bigText(c,'Bully!',200,72,'#ffffff');
  if(banner){var a=Math.min(1,banner.t*2,(banner.max-banner.t)*6);c.globalAlpha=a;
    bigText(c,banner.a,200,banner.a==='TOR!'?110:64,'#ffe14d');bigText(c,banner.b,262,26,'#ffffff');c.globalAlpha=1;}
}

/* ---------- Ton ---------- */
var AC=null,muted=false;
function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f0,f1,type,dur,vol,delay){
  var n=AC.currentTime+(delay||0),o=AC.createOscillator(),gn=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,n);o.frequency.exponentialRampToValueAtTime(f1,n+dur);
  gn.gain.setValueAtTime(vol,n);gn.gain.setValueAtTime(vol,n+dur*0.6);gn.gain.exponentialRampToValueAtTime(0.0001,n+dur);
  o.connect(gn);gn.connect(AC.destination);o.start(n);o.stop(n+dur+0.02);}
function sfx(k){if(!AC||muted)return;
  if(k==='shot')tone(240,90,'square',0.08,0.08);
  else if(k==='pass')tone(330,200,'triangle',0.07,0.08);
  else if(k==='pick')tone(520,500,'triangle',0.03,0.04);
  else if(k==='board')tone(130,60,'triangle',0.1,0.1);
  else if(k==='save')tone(620,300,'square',0.12,0.06);
  else if(k==='whistle'){tone(2100,2300,'sine',0.16,0.05);tone(2100,2300,'sine',0.26,0.05,0.2);}
  else if(k==='horn'){tone(196,190,'sawtooth',1.2,0.06);tone(247,240,'sawtooth',1.2,0.045);}}
$('mute').onclick=function(){muted=!muted;$('mute').textContent=muted?'🔇 Ton aus':'🔊 Ton an';initAudio();};

function loop(now){var raw=(now-last)/1000,dt=Math.min(0.033,raw);last=now;var t=now/1000;perfTick(raw);
  if(!$('builder').hidden)drawPreview(t);
  if(!$('game').hidden&&puck){update(dt);render(t);}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
