<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spielehalle">
<meta name="format-detection" content="telephone=no">
<title>Fietes Spielehalle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Bungee&display=swap">
<style>
/* Layout: Spielhallen-Regal – große Sticker-Kacheln mit hartem Schatten, das neueste Spiel steht vorne */
:root{
  --bg:#ffe9a8; --dots:rgba(29,26,43,.12); --ink:#1d1a2b; --paper:#fffaf0;
  --grape:#6c3fd1; --go:#38c172; --hot:#ff5a4e; --white:#ffffff;
  --display:'Bungee','Arial Black',Impact,system-ui,sans-serif;
  --body:'Baloo 2','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
a.tile{-webkit-touch-callout:none}
html,body{background-color:var(--bg);color:var(--ink);
  background-image:radial-gradient(circle at 2px 2px,var(--dots) 2px,transparent 2.6px);background-size:28px 28px;background-attachment:fixed}
html{min-height:100%}
body{margin:0;font-family:var(--body);font-size:18px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:28px}
header{display:grid;gap:6px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,7vw,64px);line-height:1;margin:0;text-wrap:balance}
h1 span{color:var(--white);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink)}
.sub{margin:0;font-weight:700;font-size:20px}
.count{display:inline-block;font-family:var(--display);font-size:15px;padding:2px 12px;border:3px solid var(--ink);border-radius:999px;background:var(--white);justify-self:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:26px}
.tile{position:relative;display:grid;grid-template-rows:auto 1fr;background:var(--paper);border:3px solid var(--ink);border-radius:22px;
  box-shadow:7px 7px 0 var(--ink);color:inherit;text-decoration:none;overflow:hidden;transition:transform .12s,box-shadow .12s}
@media (hover:hover){a.tile:hover{transform:translate(-3px,-3px);box-shadow:10px 10px 0 var(--ink)}}
a.tile:active{transform:translate(4px,4px);box-shadow:3px 3px 0 var(--ink)}
a.tile:focus-visible{outline:5px solid var(--grape);outline-offset:4px}
.art{height:170px;display:grid;place-items:center;border-bottom:3px solid var(--ink);
  background-image:radial-gradient(circle at 3px 3px,rgba(255,255,255,.55) 3px,transparent 3.6px);background-size:22px 22px}
.emo{font-size:76px;line-height:1;filter:drop-shadow(4px 4px 0 rgba(29,26,43,.35))}
.info{padding:16px 18px 18px;display:grid;gap:10px;align-content:start}
.info h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;line-height:1.1;text-wrap:balance}
.info p{margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:0 10px;border:3px solid var(--ink);border-radius:999px;background:var(--white)}
.play{justify-self:start;font-family:var(--display);font-size:18px;padding:8px 18px;border:3px solid var(--ink);border-radius:14px;background:var(--go);box-shadow:4px 4px 0 var(--ink);margin-top:4px}
.new{position:absolute;top:12px;right:-6px;font-family:var(--display);font-size:18px;padding:4px 16px 4px 12px;background:var(--hot);color:var(--white);
  border:3px solid var(--ink);border-radius:10px 0 0 10px;transform:rotate(4deg);box-shadow:3px 3px 0 var(--ink)}
.soon{border-style:dashed;box-shadow:none;background:rgba(255,250,240,.6)}
.soon .art{background-color:rgba(29,26,43,.06);border-bottom-style:dashed}
.soon .emo{opacity:.55}
footer{font-weight:700;font-size:15px;opacity:.7;text-align:center}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Fietes <span>Spielehalle</span></h1>
    <p class="sub">Alle Spiele, die Fiete selbst erfunden hat. Such dir eins aus!</p>
    <span class="count" id="count"></span>
  </header>
  <main class="grid" id="grid"></main>
  <footer>Erfunden von Fiete · gebaut mit Claude</footer>
</div>

<script>
/* =====================================================================
   NEUES SPIEL HINZUFÜGEN:
   1. Die Spiel-Datei (z. B. "Fietes Monster-Fußball.html") in denselben Ordner legen.
   2. Hier unten einen neuen Eintrag in die Liste schreiben.
   Das neueste Spiel (nach Datum) steht automatisch vorne und bekommt "NEU!".
   ===================================================================== */
var SPIELE = [
  {
    datei:   'Fietes Monster-Obstattacke.html',
    titel:   'Monster-Obstattacke',
    text:    'Dein Riesenmonster wirft Obst mit Superkräften auf ein Dorf: Apfel-Bombe, Trauben-Regen, Ananas-Stacheln und Roll-Melone. Schaffst du 100 % kaputt?',
    bild:    '🍉💥',
    farbe:   '#ffb38a',
    spieler: ['1 Spieler', 'iPad & Touch'],
    datum:   '2026-10-29'
  },
  {
    datei:   'Fietes Monster-Torwandschießen.html',
    titel:   'Monster-Torwandschießen',
    text:    'Bau dein Monster und schieß 8 Mal auf die Torwand mit 6 Löchern. Je kleiner das Loch, desto mehr Punkte. Pass auf das Torwart-Monster auf!',
    bild:    '⚽🥅',
    farbe:   '#a8e890',
    spieler: ['1–2 Spieler', 'iPad & Touch'],
    datum:   '2026-10-28'
  },
  {
    datei:   'Fietes Monster-Eishockey.html',
    titel:   'Monster-Eishockey',
    text:    'Bau deine Monster-Mannschaft mit Trikot und Rückennummer und spiel 3 gegen 3 auf dem Eis. Fünf Minuten, wer schießt mehr Tore?',
    bild:    '🏒👾',
    farbe:   '#9fdcff',
    spieler: ['1–2 Spieler', 'iPad & Touch'],
    datum:   '2026-10-28'
  },
  {
    datei:   'Fietes Monster-Rennen.html',
    titel:   'Monster-Rennen',
    text:    'Bau dein eigenes Monster, such dir ein Fahrzeug aus (auch ein Klo!) und rase gegen andere Monster durch zufällige Welten.',
    bild:    '🏎️👾',
    farbe:   '#ffcf33',
    spieler: ['1–2 Spieler', 'iPad & Touch'],
    datum:   '2026-10-27'
  }
];

(function(){
  var grid=document.getElementById('grid');
  var list=SPIELE.slice().sort(function(a,b){return a.datum<b.datum?1:a.datum>b.datum?-1:0;});
  list.forEach(function(s,i){
    var a=document.createElement('a');a.className='tile';a.href=encodeURI(s.datei);
    var art=document.createElement('div');art.className='art';art.style.backgroundColor=s.farbe;
    var emo=document.createElement('span');emo.className='emo';emo.textContent=s.bild;art.appendChild(emo);
    var info=document.createElement('div');info.className='info';
    var h=document.createElement('h2');h.textContent=s.titel;
    var p=document.createElement('p');p.textContent=s.text;
    var tags=document.createElement('div');tags.className='tags';
    (s.spieler||[]).forEach(function(t){var e=document.createElement('span');e.className='tag';e.textContent=t;tags.appendChild(e);});
    var btn=document.createElement('span');btn.className='play';btn.textContent='Spielen ▶';
    info.appendChild(h);info.appendChild(p);info.appendChild(tags);info.appendChild(btn);
    a.appendChild(art);a.appendChild(info);
    if(i===0&&list.length>1){var n=document.createElement('span');n.className='new';n.textContent='NEU!';a.appendChild(n);}
    grid.appendChild(a);
  });
  var soon=document.createElement('div');soon.className='tile soon';
  soon.innerHTML='<div class="art"><span class="emo">❓🎮</span></div><div class="info"><h2>Spiel Nr. '+(list.length+1)+'</h2><p>Kommt bald! Welches Spiel erfindest du als Nächstes?</p></div>';
  grid.appendChild(soon);
  document.getElementById('count').textContent=list.length+(list.length===1?' Spiel':' Spiele');
})();
</script>
</body>
</html>
